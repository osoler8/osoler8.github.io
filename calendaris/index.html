<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El meu Calendari</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            margin-top: 40px;
        }
        h1 { color: #333; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3ecf8e; /* Verd Supabase */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: #34b27b; }
        #calendar-container { display: none; }
    </style>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="login-container" class="container">
        <h1>Inicia Sessió</h1>
        <input type="email" id="email" placeholder="Correu electrònic">
        <input type="password" id="password" placeholder="Contrasenya">
        <button id="btn-login">Entrar al Calendari</button>
    </div>

    <div id="calendar-container" class="container">
        <h1>El teu Calendari Privat</h1>
        <p>🎉 Sessió iniciada correctament!</p>
        <div id="calendar-content" style="margin: 20px 0; padding: 20px; background: #eee; border-radius: 6px;">
            [Aquí es mostrarà el contingut del teu calendari]
        </div>
        <button id="btn-logout" style="background-color: #e74c3c;">Tancar Sessió</button>
    </div>

    <script>
        // CONFIGURACIÓ DE SUPABASE
        const SUPABASE_URL = "https://vgmevmnvehroobssyxpc.supabase.co";
        
        // ⚠️ CANVIA AIXÒ: Posa la teva clau 'anon' pública real (La que comença per eyJ...)
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnbWV2bW52ZWhyb29ic3N5eHBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzU0MzAsImV4cCI6MjA5NTQ1MTQzMH0.ZhEIRGiK9yGakU31EpJ6L8lBB2WHnnD4Lq2GshveOY4";

        // Inicialitzem el client (Només una vegada en tot el fitxer)
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Captura d'elements de la pàgina
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const loginContainer = document.getElementById('login-container');
        const calendarContainer = document.getElementById('calendar-container');

        // PROGRAMACIÓ DEL BOTÓ DE LOGIN
        btnLogin.addEventListener('click', async () => {
            alert("📢 PAS 1: Has clicat el botó de login correctament!");

            const email = emailInput.value;
            const password = passwordInput.value;

            if (!email || !password) {
                alert("⚠️ Alerta: Omple el correu i la contrasenya.");
                return;
            }

            alert("📢 PAS 2: Enviant dades de connexió a Supabase Auth...");

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    alert("❌ Error de Supabase: " + error.message);
                    console.error(error);
                } else {
                    alert("📢 PAS 3: Connexió acceptada! Obrint calendari...");
                    mostrarCalendari();
                }
            } catch (err) {
                alert("💥 Error crític inesperat: " + err.message);
                console.error(err);
            }
        });

        // FUNCIONS PER CANVIAR DE PANTALLA
        function mostrarCalendari() {
            loginContainer.style.display = 'none';
            calendarContainer.style.display = 'block';
        }

        function mostrarLogin() {
            loginContainer.style.display = 'block';
            calendarContainer.style.display = 'none';
        }

        // Tancar sessió
        btnLogout.addEventListener('click', async () => {
            await supabase.auth.signOut();
            mostrarLogin();
            alert("🔒 Sessió tancada.");
        });

        // Comprovació automàtica si l'usuari ja s'havia logejat abans
        window.addEventListener('load', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                mostrarCalendari();
            }
        });
    </script>
</body>
</html>
