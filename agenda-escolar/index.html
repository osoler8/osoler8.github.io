<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Agenda escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg: #f1f5f9; --blue: #2563eb; --red: #ef4444; --green: #10b981; --orange: #f59e0b; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        .toolbar { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; background: white; padding: 15px; border-radius: 12px; }
        button { padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; color: white; font-weight: 600; }
        
        .subjects { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .tag { padding: 8px 14px; background: #e2e8f0; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.2s; }
        .tag:hover { background: #cbd5e1; }

        .agenda-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .day-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #cbd5e1; }
        .day-header { font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; }
        textarea { width: 100%; height: 120px; margin-top: 5px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="toolbar" id="toolbar">
        <button style="background:var(--red)" onclick="clearData()"><i class="fa-solid fa-trash"></i> Esborrar</button>
        <button style="background:var(--green)" onclick="saveData()"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
        <button style="background:var(--orange)" onclick="downloadPNG()"><i class="fa-solid fa-image"></i> PNG</button>
    </div>

    <div class="subjects">
        <div class="tag" onclick="insertTag('📚 CATALÀ')">📚 CATALÀ</div>
        <div class="tag" onclick="insertTag('📖 CASTELLÀ')">📖 CASTELLÀ</div>
        <div class="tag" onclick="insertTag('📐 MATES')">📐 MATES</div>
        <div class="tag" onclick="insertTag('🌍 MEDI')">🌍 MEDI</div>
        <div class="tag" onclick="insertTag('💬 ANGLÈS')">💬 ANGLÈS</div>
        <div class="tag" onclick="insertTag('🎨 PLÀSTICA')">🎨 PLÀSTICA</div>
        <div class="tag" onclick="insertTag('🤝 VALORS')">🤝 VALORS</div>
        <div class="tag" onclick="insertTag('⛪ RELIGIÓ')">⛪ RELIGIÓ</div>
        <div class="tag" onclick="insertTag('👤 TUTORIA')">👤 TUTORIA</div>
    </div>

    <div class="agenda-grid" id="agendaArea">
        <div class="day-card"><div class="day-header"><span>Dilluns</span><span id="date-dl"></span></div><textarea id="dl"></textarea></div>
        <div class="day-card"><div class="day-header"><span>Dimarts</span><span id="date-dt"></span></div><textarea id="dt"></textarea></div>
        <div class="day-card"><div class="day-header"><span>Dimecres</span><span id="date-dc"></span></div><textarea id="dc"></textarea></div>
        <div class="day-card"><div class="day-header"><span>Dijous</span><span id="date-dj"></span></div><textarea id="dj"></textarea></div>
        <div class="day-card"><div class="day-header"><span>Divendres</span><span id="date-dv"></span></div><textarea id="dv"></textarea></div>
    </div>

    <script>
        function updateDates() {
            const days = ['dl','dt','dc','dj','dv'];
            days.forEach((id, i) => {
                let d = new Date(); d.setDate(d.getDate() + (i - d.getDay() + 1));
                document.getElementById('date-'+id).innerText = d.toLocaleDateString('ca-ES', {day:'numeric', month:'short'});
            });
        }

        function insertTag(text) {
            const area = document.querySelector('textarea:focus') || document.querySelector('textarea');
            area.value += (area.value ? "\n" : "") + text + ": ";
            area.focus();
        }

        function saveData() {
            const data = { dl: document.getElementById('dl').value, dt: document.getElementById('dt').value, dc: document.getElementById('dc').value, dj: document.getElementById('dj').value, dv: document.getElementById('dv').value };
            localStorage.setItem('agendaData', JSON.stringify(data));
            alert("Dades guardades!");
        }

        function loadData() {
            const saved = localStorage.getItem('agendaData');
            if(saved) {
                const d = JSON.parse(saved);
                ['dl','dt','dc','dj','dv'].forEach(id => document.getElementById(id).value = d[id] || "");
            }
        }

        function clearData() {
            if(confirm("Segur que vols esborrar les dades?")) {
                document.querySelectorAll('textarea').forEach(a => a.value = "");
                localStorage.removeItem('agendaData');
            }
        }

        function downloadPNG() {
            document.getElementById('toolbar').style.display = 'none';
            html2canvas(document.body).then(canvas => {
                const link = document.createElement('a');
                link.download = 'agenda.png';
                link.href = canvas.toDataURL();
                link.click();
                document.getElementById('toolbar').style.display = 'flex';
            });
        }

        window.onload = () => { updateDates(); loadData(); };
    </script>
</body>
</html>
