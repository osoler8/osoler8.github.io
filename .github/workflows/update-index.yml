name: Generate Pro Portfolio Index
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Repositories and Generate HTML
        run: |
          # Obtenim les dades de l'API de GitHub
          curl -s "https://api.github.com/users/${{ github.repository_owner }}/repos?per_page=100&sort=updated" > repos.json
          
          # Inici de l'HTML amb CSS "Top"
          cat <<EOF > index.html
          <!DOCTYPE html>
          <html lang="ca">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Portafoli de Projectes</title>
              <script src="https://cdn.tailwindcss.com"></script>
              <style>
                  body { background-color: #0f172a; color: white; }
                  .glass { 
                      background: rgba(30, 41, 59, 0.7);
                      backdrop-filter: blur(12px);
                      border: 1px solid rgba(255, 255, 255, 0.1);
                      transition: all 0.3s ease;
                  }
                  .glass:hover { 
                      transform: translateY(-5px);
                      border-color: #38bdf8;
                      box-shadow: 0 10px 30px -10px rgba(56, 189, 248, 0.3);
                  }
                  .gradient-text {
                      background: linear-gradient(90deg, #38bdf8, #818cf8);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                  }
              </style>
          </head>
          <body class="min-h-screen py-12 px-4">
              <div class="max-w-5xl mx-auto">
                  <header class="text-center mb-16">
                      <h1 class="text-5xl font-extrabold mb-4 uppercase tracking-tight">Els meus <span class="gradient-text">Projectes</span></h1>
                      <p class="text-slate-400 text-lg">Explora les meves creacions a GitHub Pages</p>
                  </header>
                  
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          EOF

          # Generació de les targetes dinàmicament
          jq -c '.[] | select(.has_pages == true and .name != "${{ github.repository_owner }}.github.io")' repos.json | while read i; do
            NAME=$(echo $i | jq -r '.name')
            DESC=$(echo $i | jq -r '.description // "Sense descripció disponible."')
            LANG=$(echo $i | jq -r '.language // "Codi"')
            URL="https://${{ github.repository_owner }}.github.io/$NAME"
            
            echo "          <a href='$URL' target='_blank' class='glass p-6 rounded-2xl flex flex-col justify-between'>" >> index.html
            echo "              <div>" >> index.html
            echo "                  <div class='flex justify-between items-start mb-4'>" >> index.html
            echo "                      <span class='text-sky-400 text-xs font-bold uppercase tracking-widest'>$LANG</span>" >> index.html
            echo "                      <svg class='w-5 h-5 text-slate-500' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path d='M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14'></path></svg>" >> index.html
            echo "                  </div>" >> index.html
            echo "                  <h3 class='text-xl font-bold mb-2 text-white'>$NAME</h3>" >> index.html
            echo "                  <p class='text-slate-400 text-sm leading-relaxed'>$DESC</p>" >> index.html
            echo "              </div>" >> index.html
            echo "          </a>" >> index.html
          done

          # Tancament de l'HTML
          cat <<EOF >> index.html
                  </div>
                  <footer class="mt-20 text-center text-slate-500 text-sm">
                      Actualitzat automàticament mitjançant GitHub Actions
                  </footer>
              </div>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🚀 Auto-update professional index"
          file_pattern: index.html