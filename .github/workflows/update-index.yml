name: Generate Folders Index
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Folder-based HTML
        run: |
          # Inici de l'HTML amb el disseny Top
          cat <<EOF > index.html
          <!DOCTYPE html>
          <html lang="ca">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Els meus Projectes</title>
              <script src="https://cdn.tailwindcss.com"></script>
              <style>
                  body { background-color: #0f172a; color: white; font-family: sans-serif; }
                  .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
                  .glass:hover { transform: translateY(-5px); border-color: #38bdf8; box-shadow: 0 10px 30px -10px rgba(56, 189, 248, 0.3); }
                  .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
              </style>
          </head>
          <body class="min-h-screen py-12 px-4">
              <div class="max-w-5xl mx-auto">
                  <header class="text-center mb-16">
                      <h1 class="text-5xl font-extrabold mb-4 uppercase tracking-tight">Índex de <span class="gradient-text">Projectes</span></h1>
                      <p class="text-slate-400 text-lg">Accedeix a cada carpeta del repositori</p>
                  </header>
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          EOF

          # Busquem totes les carpetes, ignorant les ocultes (.github, .git)
          for dir in */; do
              # Traiem la barra final del nom
              folder_name=${dir%/}
              
              # Ignorem carpetes de sistema
              if [[ "$folder_name" != ".github" && "$folder_name" != ".git" && "$folder_name" != "node_modules" ]]; then
                  echo "Generating card for: $folder_name"
                  
                  echo "          <a href='./$folder_name/' class='glass p-8 rounded-2xl flex flex-col items-center justify-center text-center group'>" >> index.html
                  echo "              <div class='mb-4 p-4 rounded-full bg-sky-500/10 text-sky-400 group-hover:bg-sky-500/20 transition-colors'>" >> index.html
                  echo "                  <svg class='w-8 h-8' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z'></path></svg>" >> index.html
                  echo "              </div>" >> index.html
                  echo "              <h3 class='text-xl font-bold text-white'>$folder_name</h3>" >> index.html
                  echo "              <p class='text-slate-400 text-sm mt-2 font-mono'>./$folder_name/</p>" >> index.html
                  echo "          </a>" >> index.html
              fi
          done

          cat <<EOF >> index.html
                  </div>
                  <footer class="mt-20 text-center text-slate-500 text-sm italic">
                      Actualitzat automàticament • $(date +'%Y')
                  </footer>
              </div>
          </body>
          </html>
          EOF

      - name: Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🚀 Índex de carpetes actualitzat" || exit 0
          git push
