name: Pro Index Fix
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Index
        run: |
          echo "<!DOCTYPE html><html><body style='background:#111;color:white;font-family:sans-serif;padding:50px;'>" > index.html
          echo "<h1>El meu Portafoli</h1><ul>" >> index.html
          
          # Aquesta línia és màgica: busca tots els teus repositoris públics
          curl -s "https://api.github.com/users/${{ github.repository_owner }}/repos?per_page=100" | jq -r '.[] | "<li><a style='color:cyan' href=\(.html_url)>\(.name)</a> - \(.description // "Sense descripció")</li>"' >> index.html
          
          echo "</ul></body></html>" >> index.html

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🚀 Forçant actualització" || exit 0
          git push
