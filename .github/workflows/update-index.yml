name: Generate Pro Portfolio Index
on:
  workflow_dispatch:
  push:
    branches: [ main, master, master-branch ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Professional HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Agafem els repositoris amb el token oficial per evitar llistes buides
          curl -H "Authorization: token $GH_TOKEN" -s "https://api.github.com/users/${{ github.repository_owner }}/repos?sort=updated&per_page=100" > repos.json
          
          # 2. Inici de l'HTML
          cat <<EOF > index.html
          <!DOCTYPE html>
          <html lang="ca">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>El meu Portafoli</title>
              <script src="https://cdn.tailwindcss.com"></script>
              <style>
                  body { background-color: #0f172a; color: white; font-family: sans-serif; }
                  .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
                  .glass:hover { transform: translateY(-5px); border-color: #38bdf8; }
                  .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
              </style>
          </head>
          <body class="min-h-screen py-12 px-4">
              <div class="max-w-5xl mx-auto">
                  <header class="text-center mb-16">
                      <h1 class="text-5xl font-extrabold mb-4 uppercase tracking-tight">El meu <span class="gradient-text">Portafoli</span></h1>
                      <p class="text-slate-400 text-lg">Projectes actualitzats automàticament</p>
                  </header>
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          EOF

          # 3. FILTRE ULTRA-SIMPLE: Mostra tot el que no sigui un "fork"
          # Hem tret el filtre del nom del repo per si de cas
          count=$(jq '. | length' repos.json)
          
          if [ "$count" -eq "0" ] || [ "$count" == "null" ]; then
            echo "<div class='glass p-6 rounded-2xl col-span-full text-center text-red-400'>No s'han trobat repositoris. Revisa els permisos de l'API.</div>" >> index.html
          else
            jq -c '.[] | select(.fork == false)' repos.json | while read i; do
              NAME=$(echo $i | jq -r '.name')
              DESC=$(echo $i | jq -r '.description // "Explora el meu codi a GitHub."')
              LANG=$(echo $i | jq -r '.language // "Codi"')
              URL=$(echo $i | jq -r '.homepage // .html_url')
              
              echo "          <a href='$URL' target='_blank' class='glass p-6 rounded-2xl flex flex-col justify-between'>" >> index.html
              echo "              <div>" >> index.html
              echo "                  <div class='flex justify-between items-start mb-4'>" >> index.html
              echo "                      <span class='text-sky-400 text-xs font-bold uppercase tracking-widest'>$LANG</span>" >> index.html
              echo "                  </div>" >> index.html
              echo "                  <h3 class='text-xl font-bold mb-2'>$NAME</h3>" >> index.html
              echo "                  <p class='text-slate-400 text-sm'>$DESC</p>" >> index.html
              echo "              </div>" >> index.html
              echo "          </a>" >> index.html
            done
          fi

          cat <<EOF >> index.html
                  </div>
                  <footer class="mt-20 text-center text-slate-500 text-sm">
                      Actualitzat: $(date +'%d/%m/%Y') • GitHub Actions
                  </footer>
              </div>
          </body>
          </html>
          EOF

      - name: Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🚀 Portafoli Top actualitzat" || exit 0
          git push
