name: Debug Index
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and Show
        run: |
          # 1. Agafem les dades
          curl -s "https://api.github.com/users/${{ github.repository_owner }}/repos?per_page=100" > repos.json
          
          # 2. DEBUG: Això ens mostrarà a la consola de GitHub si realment hi ha dades
          echo "Repositoris trobats:"
          jq -r '.[] | .name' repos.json
          
          # 3. Generem un HTML minimalista sense cap filtre
          echo "<html><body><h1>Llista de Repos</h1><ul>" > index.html
          jq -r '.[] | "<li>\(.name)</li>"' repos.json >> index.html
          echo "</ul></body></html>" >> index.html
          
      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Debug update" || exit 0
          git push
