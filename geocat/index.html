<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geografia Interactiva de Catalunya - GitHub Pages</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar / Panell de control -->
    <aside class="sidebar">
      <div class="brand">
        <span class="flag-icon">🟡🔴</span>
        <h2>GeoCatalunya</h2>
        <span class="badge">Interactiu</span>
      </div>

      <nav class="mode-selector">
        <button class="nav-btn active" data-mode="exploracio">🧭 Exploració Lliure</button>
        <button class="nav-btn" data-mode="joc-comarques">🎯 Joc: Comarques</button>
        <button class="nav-btn" data-mode="joc-capitals">🏙️ Joc: Capitals</button>
        <button class="nav-btn" data-mode="joc-relleu">⛰️ Joc: Relleu & Cims</button>
        <button class="nav-btn" data-mode="joc-rius">🌊 Joc: Rius</button>
      </nav>

      <!-- Panell del Joc -->
      <div class="game-panel" id="game-panel">
        <div class="game-header">
          <span class="stat-pill">⭐ Punts: <b id="score">0</b></span>
          <span class="stat-pill">🔥 Ratxa: <b id="streak">0</b></span>
          <span class="stat-pill">❓ Pregunta: <b id="question-count">0/10</b></span>
        </div>

        <div class="prompt-box">
          <p class="prompt-title">On es troba...?</p>
          <h3 id="target-name">Fes clic per començar</h3>
          <p id="target-hint" class="hint-text">Selecciona una modalitat per posar a prova els teus coneixements.</p>
        </div>

        <!-- Opcions tipus test si s'escau -->
        <div id="quiz-options" class="quiz-options hidden"></div>

        <div id="feedback-msg" class="feedback-msg"></div>

        <button id="btn-next" class="btn-primary hidden">Següent Pregunta →</button>
        <button id="btn-restart" class="btn-secondary">Reiniciar Joc</button>
      </div>

      <!-- Filtres i capes -->
      <div class="layer-toggles">
        <h4>Capes visibles</h4>
        <label><input type="checkbox" id="toggle-capitals" checked> Capitals de Comarca</label>
        <label><input type="checkbox" id="toggle-cims" checked> Cims i Relleu</label>
        <label><input type="checkbox" id="toggle-rius" checked> Rius principals</label>
        <label><input type="checkbox" id="toggle-labels" checked> Etiquetes de text</label>
      </div>

      <footer class="footer">
        <p>Desenvolupat per a GitHub Pages &bull; Adaptat per a Primària i ESO</p>
      </footer>
    </aside>

    <!-- Mapa -->
    <main class="map-wrapper">
      <div id="map"></div>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
