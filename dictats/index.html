<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictats en línia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #e74c3c; --success: #27ae60; --highlight: #f39c12; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; max-width: 850px; margin: 0 auto; padding: 40px 20px; background: var(--bg); color: var(--primary); display: flex; flex-direction: column; min-height: 95vh; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        h1 { text-align: center; color: var(--primary); font-size: 2.2em; margin-bottom: 30px; border-bottom: 4px solid var(--accent); padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.85em; text-transform: uppercase; color: #64748b; }
        select, input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .btn { border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .btn-main { background: var(--accent); color: white; margin-top: 10px; }
        .btn-audio { background: #3498db; color: white; }
        .btn-show { background: var(--highlight); color: white; }
        .btn-pdf { background: var(--success); color: white; }
        #full-text { display: none; text-align: left; padding: 25px; background: #fffde7; border-radius: 12px; border-left: 8px solid var(--highlight); font-size: 1.3em; line-height: 1.8; margin-top: 20px; white-space: pre-wrap; }
        .correct { font-weight: bold; color: #d35400; text-decoration: underline; background: #ffeaa7; }
        #loading { display: none; text-align: center; color: var(--accent); font-weight: bold; margin-bottom: 10px; }
        footer { margin-top: auto; text-align: center; padding: 20px; color: #94a3b8; border-top: 1px solid #e2e8f0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>Dictats en línia</h1>
    
    <div class="card" id="setup">
        <label>🔑 API Key de Groq:</label>
        <input type="password" id="api-key" placeholder="gsk_xxxxxxxxxxxxxxxxxxxx">
        
        <div class="grid" style="margin-top: 20px;">
            <div>
                <label>🎓 Nivell:</label>
                <select id="nivell">
                    <option value="1r de primària">1r de Primària</option>
                    <option value="2n de primària">2n de Primària</option>
                    <option value="3r de primària">3r de Primària</option>
                    <option value="4t de primària">4t de Primària</option>
                    <option value="5è de primària">5è de Primària</option>
                    <option value="6è de primària">6è de Primària</option>
                </select>
            </div>
            <div>
                <label>🎯 Objectiu:</label>
                <select id="categoria">
                    <option value="A/E">A / E</option>
                    <option value="O/U">O / U</option>
                    <option value="B/V">B / V</option>
                    <option value="R/RR">R / RR</option>
                    <option value="H">La lletra H</option>
                    <option value="S/SS/C/Ç/Z">S/SS/C/Ç/Z (Sibilants)</option>
                    <option value="G/J, TG/TJ">G/J, TG/TJ</option>
                    <option value="accentuació">Accentuació i dièresi</option>
                    <option value="L/LL/L·L">L / LL / L·L</option>
                    <option value="apòstrofs i contraccions">Apòstrofs</option>
                </select>
            </div>
        </div>
        <div id="loading">Generant dictat amb IA...</div>
        <button class="btn btn-main" id="btn-generar" onclick="generar()">Generar Dictat ✨</button>
    </div>

    <div class="card hidden" id="workspace">
        <div id="display-container" style="text-align: center;">
            <div id="subtitles" style="font-size: 1.5em; color: #3498db; font-weight: bold; min-height: 60px;">Llest</div>
            <div id="full-text"></div>
        </div>
        <div class="grid" style="margin-top: 30px;">
            <button class="btn btn-audio" onclick="reproduir()">🔊 Escolta</button>
            <button class="btn btn-show" onclick="toggleCorreccio()">👁️ Correcció</button>
            <button class="btn btn-pdf" onclick="exportarPDF()">📄 PDF Dual</button>
            <button class="btn" onclick="location.reload()" style="background:#64748b; color:white;">🔄 Nou</button>
        </div>
        <div style="text-align: center; margin-top: 15px;">
            <input type="range" id="speed" min="0.3" max="0.8" step="0.1" value="0.6">
            <span style="font-size: 0.8em; display:block">Velocitat de lectura</span>
        </div>
    </div>

    <footer>Creat per Oriol Soler &copy; 2026</footer>

    <script>
        let dText = "", dKeywords = [], curNivell = "", curCat = "";

        async function generar() {
            const apiKey = document.getElementById('api-key').value.trim();
            curNivell = document.getElementById('nivell').value;
            curCat = document.getElementById('categoria').value;

            if(!apiKey) return alert("Siusplau, introdueix la teva API Key de Groq.");

            document.getElementById('loading').style.display = 'block';
            document.getElementById('btn-generar').disabled = true;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{
                            role: "system",
                            content: "Ets un mestre de català. Genera dictats educatius."
                        }, {
                            role: "user",
                            content: `Crea un dictat per a ${curNivell} sobre ${curCat}. Retorna el text i després les paraules clau separades per comes després de ###. No posis títols.`
                        }],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const rawContent = data.choices[0].message.content;
                const parts = rawContent.split("###");
                dText = parts[0].trim();
                dKeywords = parts[1] ? parts[1].split(",").map(p => p.trim()) : [];

                let textHTML = dText;
                dKeywords.forEach(p => {
                    if(p.length > 1) {
                        const regex = new RegExp(`\\b${p}\\b`, 'gi');
                        textHTML = textHTML.replace(regex, `<span class="correct">${p}</span>`);
                    }
                });

                document.getElementById('full-text').innerHTML = textHTML;
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('workspace').classList.remove('hidden');
            } catch (e) {
                alert("Error: " + e.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('btn-generar').disabled = false;
            }
        }

        function reproduir() {
            window.speechSynthesis.cancel();
            const ut = new SpeechSynthesisUtterance(dText);
            ut.lang = 'ca-ES';
            ut.rate = document.getElementById('speed').value;
            ut.onstart = () => { document.getElementById('subtitles').innerText = "Llegint dictat..."; };
            ut.onend = () => { document.getElementById('subtitles').innerText = "Dictat finalitzat ✅"; };
            window.speechSynthesis.speak(ut);
        }

        function toggleCorreccio() {
            const ft = document.getElementById('full-text');
            ft.style.display = (ft.style.display === 'block') ? 'none' : 'block';
        }

        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(20);
            doc.text("Dictat per a l'alumne", 20, 30);
            doc.setFontSize(12);
            doc.text(`Nivell: ${curNivell} | Objectiu: ${curCat}`, 20, 40);
            doc.line(20, 45, 190, 45);
            doc.setFontSize(14);
            doc.text(doc.splitTextToSize(dText, 170), 20, 60);
            
            doc.addPage();
            doc.setFontSize(20);
            doc.setTextColor(39, 174, 96);
            doc.text("Guia Docent (Solucions)", 20, 30);
            doc.setTextColor(0);
            doc.setFontSize(12);
            doc.text("Paraules clau: " + dKeywords.join(", "), 20, 45, {maxWidth: 170});
            doc.text(doc.splitTextToSize(dText, 170), 20, 70);
            doc.save(`Dictat_${curCat}.pdf`);
        }
    </script>
</body>
</html>
