<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictats en línia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --highlight: #f39c12; --bg: #f8fafc; --error: #e74c3c; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 40px 20px; background: var(--bg); color: var(--primary); display: flex; flex-direction: column; min-height: 95vh; }
        
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        h1 { text-align: center; color: var(--primary); font-size: 2.5em; margin-bottom: 30px; border-bottom: 4px solid var(--accent); display: inline-block; width: 100%; padding-bottom: 10px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.85em; text-transform: uppercase; color: #64748b; }
        select, input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        
        .btn { border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .btn-main { background: var(--accent); color: white; margin-top: 10px; }
        .btn-main:hover { background: #219150; transform: translateY(-2px); }
        .btn-audio { background: #3498db; color: white; }
        .btn-show { background: var(--highlight); color: white; }
        .btn-pdf { background: var(--error); color: white; }
        .btn:disabled { background: #cbd5e0; cursor: not-allowed; }

        #display-container { text-align: center; margin-top: 10px; }
        #subtitles { font-size: 1.6em; color: var(--accent); font-weight: bold; min-height: 60px; display: flex; align-items: center; justify-content: center; line-height: 1.3; }
        
        #full-text { display: none; text-align: left; padding: 25px; background: #fffde7; border-radius: 12px; border-left: 8px solid var(--highlight); font-size: 1.3em; line-height: 1.8; margin-top: 20px; white-space: pre-wrap; }
        .correct { font-weight: bold; color: #d35400; text-decoration: underline; background: #ffeaa7; padding: 0 2px; }
        
        #error-msg { color: white; background: var(--error); padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 0.9em; line-height: 1.4; }
        
        footer { margin-top: auto; text-align: center; padding: 20px; color: #94a3b8; font-weight: 500; border-top: 1px solid #e2e8f0; }
        .hidden { display: none !important; }

        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <h1>Dictats en línia</h1>
    
    <div id="error-msg"></div>

    <div class="card" id="setup">
        <label>🔑 Clau API Gemini:</label>
        <input type="password" id="api-key" placeholder="Enganxa la clau de Google AI Studio">
        
        <div class="grid" style="margin-top: 20px;">
            <div>
                <label>🎓 Curs Educatiu:</label>
                <select id="nivell">
                    <option value="1r de primària">1r de Primària</option>
                    <option value="2n de primària">2n de Primària</option>
                    <option value="3r de primària">3r de Primària</option>
                    <option value="4t de primària">4t de Primària</option>
                    <option value="5è de primària">5è de Primària</option>
                    <option value="6è de primària">6è de Primària</option>
                </select>
            </div>
            <div>
                <label>🎯 Repte Ortogràfic:</label>
                <select id="categoria">
                    <option value="vocalisme A/E">A / E</option>
                    <option value="vocalisme O/U">O / U</option>
                    <option value="G/J, IX/X, TG/TJ, TX/IG">G/J, X, TG/TJ, TX/IG</option>
                    <option value="sibilants S/SS/C/Ç/Z">S / SS / C / Ç / Z</option>
                    <option value="nasals M/N/NY">M / N / NY</option>
                    <option value="oclusives finals B/P, T/D, C/G">B/P, T/D, C/G finals</option>
                    <option value="B/V">B / V</option>
                    <option value="apòstrofs i contraccions">Apòstrofs i contraccions</option>
                    <option value="R/RR">R / RR</option>
                    <option value="la lletra H">La lletra H</option>
                    <option value="accentuació i dièresi">Accentuació i dièresi</option>
                    <option value="guionet">Guionet</option>
                    <option value="L/LL/L·L">L / LL / L·L</option>
                    <option value="continguts combinats generals">Continguts combinats</option>
                </select>
            </div>
        </div>
        <button class="btn btn-main" id="btn-generar" onclick="generar()">Generar Dictat ✨</button>
    </div>

    <div class="card hidden" id="workspace">
        <div id="display-container">
            <div id="subtitles">Llest per començar</div>
            <div id="full-text"></div>
        </div>

        <div class="grid" style="margin-top: 30px;">
            <button class="btn btn-audio" onclick="reproduir()">🔊 Escolta</button>
            <button class="btn btn-show" onclick="toggleCorreccio()">👁️ Correcció</button>
            <button class="btn btn-pdf" onclick="exportarPDF()">📄 PDF Dual</button>
            <button class="btn" onclick="location.reload()" style="background:#64748b; color:white;">🔄 Nou</button>
        </div>
        
        <div style="text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <label style="text-transform: none; color: #94a3b8;">Velocitat de lectura</label>
            <input type="range" id="speed" min="0.3" max="0.8" step="0.1" value="0.6" style="width:200px">
        </div>
    </div>

    <footer>
        Creat per Oriol Soler &copy; 2026
    </footer>

    <script>
        let dText = ""; 
        let dKeywords = [];
        let curNivell = "";
        let curCat = "";

        async function generar() {
            const key = document.getElementById('api-key').value.trim();
            const errDiv = document.getElementById('error-msg');
            const btn = document.getElementById('btn-generar');
            
            curNivell = document.getElementById('nivell').value;
            curCat = document.getElementById('categoria').value;

            if(!key) {
                mostrarError("Cal que introdueixis la teva Clau API de Gemini.");
                return;
            }

            errDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "L'IA està redactant...";

            const prompt = `Ets un mestre de llengua catalana. Crea un dictat adaptat a alumnes de ${curNivell} que treballi específicament: ${curCat}. 
            Després del text, afegeix exactament el símbol ### i a continuació una llista de les paraules del text que contenen el repte ortogràfic seleccionat, separades per comes.`;

            try {
                // Utilitzem v1beta per a màxima compatibilitat amb el model Flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                const rawContent = data.candidates[0].content.parts[0].text;
                const parts = rawContent.split("###");
                
                dText = parts[0].trim();
                dKeywords = parts[1] ? parts[1].split(",").map(p => p.trim()) : [];

                // Preparem el text amb les correccions marcades
                let textHTML = dText;
                // Ordenem paraules per llargada per evitar conflictes de substitució
                const sortedKeywords = [...new Set(dKeywords)].sort((a, b) => b.length - a.length);
                
                sortedKeywords.forEach(p => {
                    if(p.length > 1) {
                        const regex = new RegExp(`\\b${p}\\b`, 'gi');
                        textHTML = textHTML.replace(regex, `<span class="correct">${p}</span>`);
                    }
                });

                document.getElementById('full-text').innerHTML = textHTML;
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('workspace').classList.remove('hidden');

            } catch (e) {
                mostrarError("Error: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Generar Dictat ✨";
            }
        }

        function mostrarError(msg) {
            const errDiv = document.getElementById('error-msg');
            errDiv.innerText = msg;
            errDiv.style.display = 'block';
            window.scrollTo(0,0);
        }

        function reproduir() {
            window.speechSynthesis.cancel();
            const frases = dText.split(/[.!?;]/).filter(f => f.trim().length > 0);
            let i = 0;

            function parlarFrase() {
                if(i < frases.length) {
                    const fraseActual = frases[i].trim();
                    document.getElementById('subtitles').innerText = fraseActual;
                    
                    const ut = new SpeechSynthesisUtterance(fraseActual);
                    ut.lang = 'ca-ES';
                    ut.rate = document.getElementById('speed').value;
                    
                    ut.onend = () => {
                        i++;
                        setTimeout(parlarFrase, 1500); // Pausa de seguretat entre frases
                    };
                    window.speechSynthesis.speak(ut);
                } else {
                    document.getElementById('subtitles').innerText = "Dictat finalitzat ✅";
                }
            }
            parlarFrase();
        }

        function toggleCorreccio() {
            const ft = document.getElementById('full-text');
            ft.style.display = (ft.style.display === 'block') ? 'none' : 'block';
            if(ft.style.display === 'block') ft.scrollIntoView({behavior: 'smooth'});
        }

        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // PÀGINA 1: ALUMNE
            doc.setFontSize(22);
            doc.setTextColor(44, 62, 80);
            doc.text("Dictat Alumne", 20, 30);
            
            doc.setFontSize(12);
            doc.text(`Nivell: ${curNivell} | Objectiu: ${curCat}`, 20, 40);
            doc.line(20, 45, 190, 45);
            
            doc.setFontSize(14);
            const textLínies = doc.splitTextToSize(dText, 170);
            doc.text(textLínies, 20, 60);

            // PÀGINA 2: MESTRE
            doc.addPage();
            doc.setFontSize(22);
            doc.setTextColor(39, 174, 96);
            doc.text("Guia de Correcció (Docent)", 20, 30);
            
            doc.setFontSize(12);
            doc.setTextColor(0);
            doc.text("Paraules clau a avaluar:", 20, 45);
            doc.setFontSize(11);
            doc.text(dKeywords.join(", "), 20, 52, { maxWidth: 170 });
            
            doc.line(20, 60, 190, 60);
            doc.setFontSize(14);
            doc.text(textLínies, 20, 75);
            
            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text("Generat per Dictats en línia - Oriol Soler", 20, 285);

            doc.save(`Dictat_${curCat.replace(/\//g, '-')}.pdf`);
        }
    </script>
</body>
</html>
