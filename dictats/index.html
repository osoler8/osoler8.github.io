<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictats en línia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --highlight: #f39c12; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 40px 20px; background: var(--bg); color: var(--primary); display: flex; flex-direction: column; min-height: 95vh; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 25px; }
        h1 { text-align: center; color: var(--primary); font-size: 2.5em; margin-bottom: 30px; border-bottom: 3px solid var(--accent); display: inline-block; width: 100%; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.9em; text-transform: uppercase; color: #64748b; }
        select, input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; }
        .btn { border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .btn-main { background: var(--accent); color: white; }
        .btn-pdf { background: #e74c3c; color: white; }
        .btn-audio { background: #3498db; color: white; }
        #full-text { display: none; text-align: left; padding: 25px; background: #fffde7; border-radius: 12px; border-left: 8px solid var(--highlight); font-size: 1.25em; line-height: 1.8; margin-top: 20px; }
        .correct { font-weight: bold; color: #d35400; text-decoration: underline; }
        #error-msg { color: #e74c3c; background: #fdeaea; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; font-size: 0.9em; }
        footer { margin-top: auto; text-align: center; padding: 20px; color: #94a3b8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Dictats en línia</h1>
    
    <div class="card" id="setup">
        <label>🔑 Clau API Gemini (Copia de Google AI Studio):</label>
        <input type="password" id="api-key" placeholder="Enganxa la clau aquí">
        <div id="error-msg"></div>
        
        <div class="grid" style="margin-top: 20px;">
            <div>
                <label>🎓 Curs Escolar:</label>
                <select id="nivell">
                    <option value="1r de primària">1r de Primària</option>
                    <option value="2n de primària">2n de Primària</option>
                    <option value="3r de primària">3r de Primària</option>
                    <option value="4t de primària">4t de Primària</option>
                    <option value="5è de primària">5è de Primària</option>
                    <option value="6è de primària">6è de Primària</option>
                </select>
            </div>
            <div>
                <label>🎯 Objectiu Ortogràfic:</label>
                <select id="categoria">
                    <option value="A/E">A / E</option>
                    <option value="O/U">O / U</option>
                    <option value="B/V">B / V</option>
                    <option value="R/RR">R / RR</option>
                    <option value="S/SS/C/Ç/Z">Sibilants</option>
                    <option value="G/J, IX/X, TG/TJ, TX/IG">G/J, X, TG/TJ</option>
                    <option value="accentuació">Accentuació</option>
                </select>
            </div>
        </div>
        <button class="btn btn-main" onclick="generar()">Generar Dictat ✨</button>
    </div>

    <div class="card hidden" id="workspace">
        <div id="subtitles" style="font-size: 1.5em; text-align: center; min-height: 50px; color: var(--accent); font-weight: bold;"></div>
        <div id="full-text"></div>
        <div class="grid" style="margin-top: 30px;">
            <button class="btn btn-audio" onclick="llegir()">🔊 Escolta</button>
            <button class="btn btn-pdf" onclick="exportPDF()">📄 PDF Dual</button>
            <button class="btn" onclick="toggleCorreccio()" style="background:var(--highlight); color:white;">👁️ Correcció</button>
        </div>
        <button class="btn" onclick="location.reload()" style="background:#64748b; color:white; margin-top:10px;">🔄 Nou Dictat</button>
    </div>

    <footer>Creat per Oriol Soler &copy; 2026</footer>

    <script>
        let dText = "", dKeywords = [], curNivell = "", curCat = "";

        async function generar() {
            const key = document.getElementById('api-key').value.trim();
            const errDiv = document.getElementById('error-msg');
            curNivell = document.getElementById('nivell').value;
            curCat = document.getElementById('categoria').value;

            if(!key) { errDiv.innerText = "Siusplau, posa la clau API."; errDiv.style.display = 'block'; return; }
            errDiv.style.display = 'none';

            const prompt = `Ets un mestre de català. Crea un dictat per a ${curNivell} sobre ${curCat}. 
            Retorna primer el text i després les paraules clau separades per comes després del símbol ###.`;

            try {
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error.message || "Error desconegut");
                }

                const data = await response.json();
                const raw = data.candidates[0].content.parts[0].text;
                const parts = raw.split("###");
                dText = parts[0].trim();
                dKeywords = parts[1] ? parts[1].split(",").map(p => p.trim()) : [];

                let textHTML = dText;
                dKeywords.forEach(p => {
                    const regex = new RegExp(`\\b${p}\\b`, 'gi');
                    textHTML = textHTML.replace(regex, `<span class="correct">${p}</span>`);
                });

                document.getElementById('full-text').innerHTML = textHTML;
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('workspace').classList.remove('hidden');
            } catch (e) {
                errDiv.innerText = "Error API: " + e.message;
                errDiv.style.display = 'block';
            }
        }

        function llegir() {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(dText);
            u.lang = 'ca-ES';
            u.rate = 0.6;
            u.onboundary = (event) => {
                // Aproximació de subtítols simple
                document.getElementById('subtitles').innerText = "Llegint el dictat...";
            };
            window.speechSynthesis.speak(u);
        }

        function toggleCorreccio() {
            const ft = document.getElementById('full-text');
            ft.style.display = ft.style.display === 'block' ? 'none' : 'block';
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Dictat Alumne (" + curCat + ")", 20, 20);
            doc.setFontSize(14);
            doc.text(doc.splitTextToSize(dText, 170), 20, 40);
            doc.addPage();
            doc.text("Guia Mestre - Solucions", 20, 20);
            doc.text("Paraules: " + dKeywords.join(", "), 20, 40);
            doc.save("dictat.pdf");
        }
    </script>
</body>
</html>
