<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictats en línia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --highlight: #f39c12; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 40px 20px; background: var(--bg); color: var(--primary); display: flex; flex-direction: column; min-height: 95vh; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 25px; }
        h1 { text-align: center; color: var(--primary); font-size: 2.5em; margin-bottom: 30px; border-bottom: 3px solid var(--accent); display: inline-block; width: 100%; padding-bottom: 10px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.9em; text-transform: uppercase; color: #64748b; }
        select, input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; }
        
        .btn { border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-main { background: var(--accent); color: white; width: 100%; }
        .btn-main:hover { background: #219150; transform: translateY(-2px); }
        .btn-audio { background: #3498db; color: white; }
        .btn-show { background: var(--highlight); color: white; }
        .btn-pdf { background: #e74c3c; color: white; }

        #display-container { text-align: center; margin-top: 20px; }
        #subtitles { font-size: 1.8em; color: var(--accent); font-weight: bold; min-height: 80px; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
        #full-text { display: none; text-align: left; padding: 25px; background: #fffde7; border-radius: 12px; border-left: 8px solid var(--highlight); font-size: 1.25em; line-height: 1.8; margin-top: 20px; }
        .correct { font-weight: bold; color: #d35400; text-decoration: underline; }
        
        footer { margin-top: auto; text-align: center; padding: 20px; color: #94a3b8; font-weight: 500; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Dictats en línia</h1>
    
    <div class="card" id="setup">
        <label>🔑 Clau API Gemini:</label>
        <input type="password" id="api-key" placeholder="Enganxa la teva clau de Google AI Studio">
        
        <div class="grid" style="margin-top: 20px;">
            <div>
                <label>🎓 Curs Escolar:</label>
                <select id="nivell">
                    <option value="1r de primària">1r de Primària</option>
                    <option value="2n de primària">2n de Primària</option>
                    <option value="3r de primària">3r de Primària</option>
                    <option value="4t de primària">4t de Primària</option>
                    <option value="5è de primària">5è de Primària</option>
                    <option value="6è de primària">6è de Primària</option>
                </select>
            </div>
            <div>
                <label>🎯 Objectiu Ortogràfic:</label>
                <select id="categoria">
                    <option value="A/E">A / E</option>
                    <option value="O/U">O / U</option>
                    <option value="B/V">B / V</option>
                    <option value="H">Lletra H</option>
                    <option value="R/RR">R / RR</option>
                    <option value="S/SS/C/Ç/Z">Sibilants (S/SS/C/Ç/Z)</option>
                    <option value="G/J, IX/X, TG/TJ, TX/IG">G/J, IX/X, TG/TJ, TX/IG</option>
                    <option value="M/N/NY">M / N / NY</option>
                    <option value="B/P, T/D, C/G finals">Oclusives (B/P, T/D, C/G)</option>
                    <option value="apòstrofs i contraccions">Apòstrofs i contraccions</option>
                    <option value="accentuació i dièresi">Accentuació i dièresi</option>
                    <option value="L/LL/L·L">L / LL / L·L</option>
                </select>
            </div>
        </div>
        <button class="btn btn-main" onclick="generar()">Generar Dictat Intel·ligent ✨</button>
    </div>

    <div class="card hidden" id="workspace">
        <div id="display-container">
            <div id="subtitles">Llest per començar el dictat.</div>
            <div id="full-text"></div>
        </div>

        <div class="grid" style="margin-top: 30px;">
            <button class="btn btn-audio" onclick="llegir()">🔊 Escolta</button>
            <button class="btn btn-show" onclick="toggleCorreccio()">👁️ Correcció</button>
            <button class="btn btn-pdf" onclick="exportPDF()">📄 Baixar PDF Dual</button>
            <button class="btn" onclick="location.reload()" style="background:#64748b; color:white;">🔄 Nou</button>
        </div>
        <div style="text-align: center; margin-top: 10px;">
            <input type="range" id="speed" min="0.3" max="0.9" step="0.1" value="0.6" style="width:150px">
            <span style="font-size: 0.8em; display:block">Velocitat de lectura</span>
        </div>
    </div>

    <footer>
        Creat per Oriol Soler &copy; 2026
    </footer>

    <script>
        let dText = ""; 
        let dKeywords = [];
        let curNivell = "";
        let curCat = "";

        async function generar() {
            const key = document.getElementById('api-key').value;
            curNivell = document.getElementById('nivell').value;
            curCat = document.getElementById('categoria').value;
            if(!key) return alert("Cal una API Key válida");

            const btn = document.querySelector('.btn-main');
            btn.innerText = "Preparant materials...";
            btn.disabled = true;

            const prompt = `Ets un mestre de primària. Crea un dictat de català per a ${curNivell} centrat en ${curCat}. 
            Després del text afegeix una llista de les paraules que contenen el repte ${curCat} separades per comes.
            Format: [TEXT] ### [PARAULES]`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                const raw = data.candidates[0].content.parts[0].text;
                const parts = raw.split("###");
                
                dText = parts[0].trim();
                dKeywords = parts[1] ? parts[1].split(",").map(p => p.trim()) : [];

                // Marcar correcció
                let textHTML = dText;
                dKeywords.forEach(p => {
                    const regex = new RegExp(`\\b${p}\\b`, 'gi');
                    textHTML = textHTML.replace(regex, `<span class="correct">${p}</span>`);
                });

                document.getElementById('full-text').innerHTML = textHTML;
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('workspace').classList.remove('hidden');
            } catch (e) { alert("Error de connexió"); }
            finally { btn.disabled = false; btn.innerText = "Generar Dictat Intel·ligent ✨"; }
        }

        function llegir() {
            window.speechSynthesis.cancel();
            const frases = dText.split(/[.!?;]/).filter(f => f.trim().length > 0);
            let idx = 0;

            function parlarFrase() {
                if(idx < frases.length) {
                    const t = frases[idx].trim();
                    document.getElementById('subtitles').innerText = t;
                    const u = new SpeechSynthesisUtterance(t);
                    u.lang = 'ca-ES';
                    u.rate = document.getElementById('speed').value;
                    u.onend = () => { idx++; setTimeout(parlarFrase, 1200); };
                    window.speechSynthesis.speak(u);
                } else {
                    document.getElementById('subtitles').innerText = "Dictat finalitzat.";
                }
            }
            parlarFrase();
        }

        function toggleCorreccio() {
            const ft = document.getElementById('full-text');
            ft.style.display = ft.style.display === 'block' ? 'none' : 'block';
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // PÀGINA 1: ALUMNE
            doc.setFontSize(22);
            doc.text("Dictat per a l'alumne", 20, 30);
            doc.setFontSize(12);
            doc.text(`Nivell: ${curNivell} | Objectiu: ${curCat}`, 20, 40);
            doc.setLineWidth(0.5);
            doc.line(20, 45, 190, 45);
            
            doc.setFontSize(14);
            const lines = doc.splitTextToSize(dText, 170);
            doc.text(lines, 20, 60);

            // PÀGINA 2: MESTRE
            doc.addPage();
            doc.setFontSize(22);
            doc.setTextColor(46, 204, 113);
            doc.text("Guia de Correcció (Mestre)", 20, 30);
            doc.setTextColor(0);
            doc.setFontSize(12);
            doc.text("Paraules a revisar: " + dKeywords.join(", "), 20, 45);
            
            doc.setFontSize(14);
            doc.text(lines, 20, 60);
            doc.setFontSize(10);
            doc.text("Generat amb Dictats en línia - Oriol Soler", 20, 280);

            doc.save(`Dictat_${curCat}_${curNivell}.pdf`);
        }
    </script>
</body>
</html>
