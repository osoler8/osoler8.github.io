<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictats en línia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --highlight: #f39c12; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; max-width: 850px; margin: 0 auto; padding: 20px; background: var(--bg); color: var(--primary); line-height: 1.5; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        h1 { text-align: center; color: var(--primary); font-size: 2.2em; margin-bottom: 25px; border-bottom: 4px solid var(--accent); padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.85em; text-transform: uppercase; color: #64748b; }
        select, input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .btn { border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .btn-main { background: var(--accent); color: white; }
        .btn-audio { background: #5d6d7e; color: white; }
        .btn-show { background: var(--highlight); color: white; }
        .btn-pdf { background: var(--success); color: white; }
        #full-text { display: none; text-align: left; padding: 25px; background: #fffde7; border-radius: 12px; border-left: 8px solid var(--highlight); font-size: 1.3em; line-height: 2; margin-top: 20px; white-space: pre-wrap; }
        .correct { font-weight: bold; color: #d35400; text-decoration: underline; background: #ffeaa7; }
        #subtitles { font-size: 1.6em; color: var(--accent); font-weight: bold; min-height: 80px; text-align: center; display: flex; align-items: center; justify-content: center; border: 2px dashed #d1d9e0; border-radius: 10px; padding: 10px; margin-bottom: 20px; }
        footer { text-align: center; padding: 20px; color: #94a3b8; font-size: 0.9em; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>Dictats en línia</h1>
    
    <div class="card" id="setup">
        <label>🔑 API Key de Groq:</label>
        <input type="password" id="api-key" placeholder="gsk_...">
        
        <div class="grid" style="margin-top: 20px;">
            <div>
                <label>🎓 Nivell Educatiu:</label>
                <select id="nivell">
                    <option value="1r de primària (Molt curt: només 2 o 3 frases molt simples)">1r de Primària</option>
                    <option value="2n de primària (Curt: 3-4 frases senzilles)">2n de Primària</option>
                    <option value="3r de primària (Text breu: unes 30-40 paraules)">3r de Primària</option>
                    <option value="4t de primària (Text mitjà: unes 50 paraules)">4t de Primària</option>
                    <option value="5è de primària (Text complex: unes 70 paraules)">5è de Primària</option>
                    <option value="6è de primària (Text llarg: unes 90 paraules)">6è de Primària</option>
                </select>
            </div>
            <div>
                <label>🎯 Aspecte Ortogràfic:</label>
                <select id="categoria">
                    <option value="A/E">A / E</option>
                    <option value="O/U">O / U</option>
                    <option value="G/J, IX/X, TG/TJ, TX/IG">G/J, IX/X, TG/TJ, TX/IG</option>
                    <option value="S/SS/C/Ç/Z">S / SS / C / Ç / Z</option>
                    <option value="M/N/NY">M / N / NY</option>
                    <option value="B/P, T/D, C/G">B/P, T/D, C/G (Oclusives)</option>
                    <option value="B/V">B / V</option>
                    <option value="Apòstrofs i contraccions">Apòstrofs i contraccions</option>
                    <option value="R/RR">R / RR</option>
                    <option value="La lletra H">La lletra H</option>
                    <option value="Accentuació i dièresi">Accentuació i dièresi</option>
                    <option value="Guionet">Guionet</option>
                    <option value="L/LL/L·L">L / LL / L·L</option>
                    <option value="Continguts combinats generals">Continguts combinats generals</option>
                    <option value="Continguts combinats vocalisme">Continguts combinats vocalisme</option>
                    <option value="Continguts combinats consonantisme">Continguts combinats consonantisme</option>
                </select>
            </div>
        </div>
        <button class="btn btn-main" id="btn-generar" onclick="generar()">Crear Dictat ✨</button>
    </div>

    <div class="card hidden" id="workspace">
        <div id="subtitles">Llest per començar</div>
        <div id="full-text"></div>

        <div class="grid" style="margin-top: 25px;">
            <button class="btn btn-audio" id="btn-play" onclick="reproduir()">▶️ Escolta i Escriu</button>
            <button class="btn btn-show" onclick="toggleCorreccio()">👁️ Correcció</button>
            <button class="btn btn-pdf" onclick="exportarPDF()">📄 Baixar PDF</button>
            <button class="btn" onclick="location.reload()" style="background:#64748b; color:white;">🔄 Nou</button>
        </div>
        
        <div style="text-align: center; margin-top: 20px; background: #f1f5f9; padding: 15px; border-radius: 12px;">
            <label style="text-transform: none; color: #475569;">Velocitat de lectura (més lenta a l'esquerra)</label>
            <input type="range" id="speed" min="0.1" max="0.5" step="0.05" value="0.3" style="width:100%; margin-top:10px;">
        </div>
    </div>

    <footer>Creat per Oriol Soler &copy; 2026</footer>

    <script>
        let dText = "", dKeywords = [], curNivellText = "", curCat = "";

        async function generar() {
            const apiKey = document.getElementById('api-key').value.trim();
            const nivellSel = document.getElementById('nivell');
            curNivellText = nivellSel.options[nivellSel.selectedIndex].text;
            curCat = document.getElementById('categoria').value;

            if(!apiKey) return alert("Posa l'API Key de Groq.");
            const btn = document.getElementById('btn-generar');
            btn.disabled = true;
            btn.innerText = "Pensant el dictat...";

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{
                            role: "system",
                            content: "Ets un mestre de català. Crea dictats precisos. Si el nivell és inicial (1r/2n), usa frases molt simples i curtes. Separa el text de les paraules clau amb ###."
                        }, {
                            role: "user",
                            content: `Dictat per a ${nivellSel.value} sobre ${curCat}.`
                        }]
                    })
                });

                const data = await response.json();
                const raw = data.choices[0].message.content;
                const parts = raw.split("###");
                dText = parts[0].trim().replace(/\n/g, " ");
                dKeywords = parts[1] ? parts[1].split(",").map(p => p.trim()) : [];

                let textHTML = dText;
                dKeywords.forEach(p => {
                    if(p.length > 1) {
                        const regex = new RegExp(`\\b${p}\\b`, 'gi');
                        textHTML = textHTML.replace(regex, `<span class="correct">${p}</span>`);
                    }
                });

                document.getElementById('full-text').innerHTML = textHTML;
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('workspace').classList.remove('hidden');
            } catch (e) { alert("Error: " + e.message); }
            finally { btn.disabled = false; btn.innerText = "Crear Dictat ✨"; }
        }

        function reproduir() {
            window.speechSynthesis.cancel();
            const btnPlay = document.getElementById('btn-play');
            const speed = document.getElementById('speed').value;
            
            // Separem per frases o pauses naturals
            const fragments = dText.split(/([.!?;])/).reduce((acc, val, i, arr) => {
                if (i % 2 === 0) acc.push(val + (arr[i+1] || ""));
                return acc;
            }, []).filter(f => f.trim().length > 2);

            let i = 0;
            btnPlay.disabled = true;
            btnPlay.innerText = "Dictant...";

            function llegirFragment() {
                if(i < fragments.length) {
                    const fragmentText = fragments[i].trim();
                    document.getElementById('subtitles').innerText = fragmentText;
                    
                    const ut = new SpeechSynthesisUtterance(fragmentText);
                    ut.lang = 'ca-ES';
                    ut.rate = speed;
                    ut.pitch = 0.85; // To més humà
                    
                    ut.onend = () => {
                        i++;
                        // Pausa de 4 segons entre frases per escriure
                        setTimeout(llegirFragment, 4000); 
                    };
                    window.speechSynthesis.speak(ut);
                } else {
                    document.getElementById('subtitles').innerText = "Dictat finalitzat ✅";
                    btnPlay.disabled = false;
                    btnPlay.innerText = "▶️ Tornar a dictar";
                }
            }
            llegirFragment();
        }

        function toggleCorreccio() {
            const ft = document.getElementById('full-text');
            ft.style.display = (ft.style.display === 'block') ? 'none' : 'block';
        }

        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(20);
            doc.text("Dictat Alumne: " + curNivellText, 20, 30);
            doc.setFontSize(14);
            doc.text("Objectiu: " + curCat, 20, 40);
            doc.line(20, 45, 190, 45);
            doc.text(doc.splitTextToSize(dText, 170), 20, 60);
            doc.addPage();
            doc.text("Correcció mestre:", 20, 30);
            doc.text("Paraules clau: " + dKeywords.join(", "), 20, 45, {maxWidth: 170});
            doc.save(`Dictat_${curNivellText}.pdf`);
        }
    </script>
</body>
</html>
