<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛰️ EXPEDICIÓ MATEMÀTICA: EL GRAN REPTE ⛰️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Share+Tech+Mono&display=swap');

        :root {
            --sky-blue: #a1e3ff;
            --mountain-rock: #4b4b4b;
            --easy-green: #2ed573;
            --med-blue: #1e90ff;
            --hard-black: #2f3542;
            --danger-red: #ff4757;
        }

        body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; height: 100vh; display: flex; flex-direction: column; background-color: var(--sky-blue); overflow: hidden; }

        /* --- CONTENIDOR PRINCIPAL --- */
        #main-wrapper { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* --- PANELL ESQUERRA: MUNTANYA --- */
        #mountain-viewport { width: 40%; height: 100%; background: linear-gradient(to bottom, #74b9ff 0%, #ffffff 100%); position: relative; border-right: 5px solid #2f3542; overflow: hidden; }
        .peak { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 25vw solid transparent; border-right: 25vw solid transparent; border-bottom: 90vh solid var(--mountain-rock); z-index: 1; }
        .snow-cap { position: absolute; bottom: 60vh; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10vw solid transparent; border-right: 10vw solid transparent; border-bottom: 30vh solid white; z-index: 2; }
        
        /* ESCALADOR ANIMAT CORREGIT */
        #climber {
            position: absolute;
            width: 40px;
            height: 60px;
            z-index: 10;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -100%); /* Ajustat perquè no surti per dalt */
            bottom: 5%; /* Posició inicial */
            left: 50%;
        }
        .climber-body { width: 8px; height: 25px; background: #e74c3c; position: absolute; left: 16px; top: 15px; border-radius: 5px; }
        .climber-head { width: 15px; height: 15px; background: #ffdbac; position: absolute; left: 12.5px; top: 0; border-radius: 50%; }
        .arm { width: 15px; height: 5px; background: #e74c3c; position: absolute; top: 20px; }
        .arm.left { left: 2px; transform: rotate(45deg); }
        .arm.right { right: 2px; transform: rotate(-45deg); }
        .leg { width: 6px; height: 20px; background: #2f3542; position: absolute; top: 38px; }
        .leg.left { left: 12px; transform: rotate(20deg); }
        .leg.right { right: 12px; transform: rotate(-20deg); }

        .climbing-anim .arm.left { animation: armL 0.3s infinite alternate; }
        .climbing-anim .arm.right { animation: armR 0.3s infinite alternate; }
        @keyframes armL { from { transform: rotate(45deg); } to { transform: rotate(-45deg); } }
        @keyframes armR { from { transform: rotate(-45deg); } to { transform: rotate(45deg); } }

        /* --- PANELL DRETA: JOC --- */
        #game-panel { width: 60%; height: 100%; display: flex; flex-direction: column; background: #f4f7f6; }
        header { background: white; padding: 15px 30px; border-bottom: 2px solid #ddd; display: flex; justify-content: space-between; align-items: center; min-height: 70px; }
        
        .badges-container { display: flex; gap: 15px; align-items: center; }
        .badge { width: 45px; height: 45px; border-radius: 50%; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; filter: grayscale(1); transition: 0.5s; border: 2px solid #ccc; box-shadow: inset 0 0 5px rgba(0,0,0,0.1); }
        .badge.active { filter: grayscale(0); border-color: #f1c40f; transform: scale(1.1); box-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .badge-green.active { background: var(--easy-green); }
        .badge-blue.active { background: var(--med-blue); }
        .badge-black.active { background: var(--hard-black); color: white; }

        #lives-display { font-weight: bold; font-size: 1.2rem; white-space: nowrap; }
        #lives-icons { color: var(--danger-red); margin-left: 5px; }

        /* --- CONTINGUT --- */
        #container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; display: none; }
        .active { display: block; animation: fadeInUp 0.5s ease; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .diff-btn { padding: 15px; margin: 8px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; width: 160px; font-size: 0.9rem; transition: 0.3s; position: relative; }
        .diff-btn.completed::after { content: "✅"; position: absolute; top: -8px; right: -8px; font-size: 1.2rem; }
        .btn-easy { background: var(--easy-green); }
        .btn-med { background: var(--med-blue); }
        .btn-hard { background: var(--hard-black); }

        .problem-box { font-size: 1.3rem; line-height: 1.6; margin: 20px 0; padding: 20px; background: #f9f9f9; border-radius: 10px; border-left: 5px solid var(--med-blue); }
        .op-text { font-weight: bold; background: #eee; padding: 2px 6px; border-radius: 4px; }

        input { font-size: 2rem; width: 180px; padding: 10px; text-align: center; border: 3px solid #ddd; border-radius: 12px; font-family: 'Share Tech Mono'; outline: none; margin-bottom: 15px; }
        
        button.action-btn { background: var(--med-blue); color: white; border: none; padding: 12px 35px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        #feedback { height: 25px; margin-top: 10px; font-weight: bold; }

        /* --- PEU DE PÀGINA --- */
        footer { background: #2f3542; color: white; text-align: center; padding: 8px; font-size: 0.8rem; letter-spacing: 1px; }

    </style>
</head>
<body>

    <div id="main-wrapper">
        <div id="mountain-viewport">
            <div class="peak"></div>
            <div class="snow-cap"></div>
            <div id="climber">
                <div class="climber-head"></div>
                <div class="climber-body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>
        </div>

        <div id="game-panel">
            <header>
                <div class="badges-container">
                    <div id="badge-easy" class="badge badge-green">🌲</div>
                    <div id="badge-med" class="badge badge-blue">❄️</div>
                    <div id="badge-hard" class="badge badge-black">🦅</div>
                </div>
                <div id="lives-display">
                    Vides: <span id="lives-icons">❤️❤️❤️</span>
                </div>
            </header>

            <div id="container">
                <div id="card-select" class="card active">
                    <h1>🏔️ Expedició al Cim</h1>
                    <p>Supera les 3 rutes per completar el repte!</p>
                    <div style="display: flex; flex-wrap: wrap; justify-content: center;">
                        <button id="btn-route-easy" class="diff-btn btn-easy" onclick="startRoute('fàcil')">RUTA VERDA</button>
                        <button id="btn-route-med" class="diff-btn btn-med" onclick="startRoute('mitjana')">RUTA BLAVA</button>
                        <button id="btn-route-hard" class="diff-btn btn-hard" onclick="startRoute('difícil')">RUTA NEGRA</button>
                    </div>
                </div>

                <div id="card-game" class="card">
                    <h3>PREGUNTA <span id="node-idx">1</span> / 10</h3>
                    <div class="problem-box" id="problem-text"> Carregant... </div>
                    <input type="number" id="user-input" placeholder="?">
                    <br>
                    <button id="btn-submit" class="action-btn" onclick="checkAnswer()">COMPROVA</button>
                    <div id="feedback"></div>
                </div>

                <div id="card-end" class="card">
                    <h1>🏆 RUTA COMPLETADA!</h1>
                    <p>Has aconseguit una nova insígnia d'escalada.</p>
                    <button class="action-btn" onclick="goToMenu()">TORNAR AL MENÚ</button>
                </div>

                <div id="card-final" class="card">
                    <h1 style="color: #f1c40f;">👑 MESTRE DE L'HIMÀLAIA</h1>
                    <p>Increïble Oriol! Has conquerit els 3 cims.</p>
                    <div style="font-size: 3rem; margin: 20px;">🏅🏅🏅</div>
                    <button class="action-btn" onclick="location.reload()">REINICIAR JOC</button>
                </div>
            </div>
        </div>
    </div>

    <footer>Fet per Oriol Soler</footer>

    <script>
        const database = {
            'fàcil': [
                { q: "Suma: <span class='op-text'>450 + 325</span>", a: 775 },
                { q: "Resta: <span class='op-text'>900 - 465</span>", a: 435 },
                { q: "Multiplicació: <span class='op-text'>12 &times; 11</span>", a: 132 },
                { q: "Divisió: <span class='op-text'>150 / 5</span>", a: 30 },
                { q: "Suma: <span class='op-text'>1.200 + 850</span>", a: 2050 },
                { q: "Combinada: <span class='op-text'>(10 + 5) &times; 2</span>", a: 30 },
                { q: "Resta: <span class='op-text'>1.500 - 850</span>", a: 650 },
                { q: "Multiplicació: <span class='op-text'>25 &times; 4</span>", a: 100 },
                { q: "Divisió: <span class='op-text'>240 / 6</span>", a: 40 },
                { q: "Combinada: <span class='op-text'>50 + 50 &times; 2</span>", a: 150 }
            ],
            'mitjana': [
                { q: "Suma: <span class='op-text'>1.450 + 2.670</span>", a: 4120 },
                { q: "Resta: <span class='op-text'>3.000 - 1.245</span>", a: 1755 },
                { q: "Multiplicació: <span class='op-text'>125 &times; 12</span>", a: 1500 },
                { q: "Divisió: <span class='op-text'>1.440 / 12</span>", a: 120 },
                { q: "Combinada: <span class='op-text'>(400 + 200) / 3</span>", a: 200 },
                { q: "Resta: <span class='op-text'>10.000 - 4.560</span>", a: 5440 },
                { q: "Multiplicació: <span class='op-text'>45 &times; 22</span>", a: 990 },
                { q: "Divisió: <span class='op-text'>3.500 / 70</span>", a: 50 },
                { q: "Combinada: <span class='op-text'>(15 &times; 4) + (100 / 2)</span>", a: 110 },
                { q: "Combinada: <span class='op-text'>1.000 - 25 &times; 10</span>", a: 750 }
            ],
            'difícil': [
                { q: "Suma: <span class='op-text'>12.450 + 8.550</span>", a: 21000 },
                { q: "Multiplicació: <span class='op-text'>325 &times; 15</span>", a: 4875 },
                { q: "Divisió: <span class='op-text'>4.800 / 15</span>", a: 320 },
                { q: "Combinada: <span class='op-text'>5 &times; (1.200 - 850)</span>", a: 1750 },
                { q: "Resta: <span class='op-text'>50.000 - 12.345</span>", a: 37655 },
                { q: "Multiplicació: <span class='op-text'>12 &times; 12 &times; 5</span>", a: 720 },
                { q: "Divisió: <span class='op-text'>15.625 / 25</span>", a: 625 },
                { q: "Combinada: <span class='op-text'>(300 + 200) &times; (40 / 8)</span>", a: 2500 },
                { q: "Combinada: <span class='op-text'>2.500 - 150 &times; 4</span>", a: 1900 },
                { q: "Combinada Final: <span class='op-text'>(800 / 4) + (125 &times; 8)</span>", a: 1200 }
            ]
        };

        let currentDiff = '';
        let currentIndex = 0;
        let lives = 3;
        let completedRoutes = { 'fàcil': false, 'mitjana': false, 'difícil': false };

        function startRoute(diff) {
            currentDiff = diff;
            currentIndex = 0;
            lives = 3;
            document.getElementById('card-select').classList.remove('active');
            document.getElementById('card-game').classList.add('active');
            updateLives();
            showLevel();
            updateClimber(0);
        }

        function showLevel() {
            const level = database[currentDiff][currentIndex];
            document.getElementById('node-idx').innerText = currentIndex + 1;
            document.getElementById('problem-text').innerHTML = level.q;
            document.getElementById('user-input').value = "";
            document.getElementById('user-input').focus();
            document.getElementById('feedback').innerText = "";
        }

        function checkAnswer() {
            const input = document.getElementById('user-input');
            const val = parseInt(input.value);
            const correct = database[currentDiff][currentIndex].a;
            const btn = document.getElementById('btn-submit');

            if (val === correct) {
                currentIndex++;
                document.getElementById('climber').classList.add('climbing-anim');
                updateClimber(currentIndex);
                document.getElementById('feedback').innerText = "✅ Molt bé!";
                document.getElementById('feedback').style.color = "green";
                
                setTimeout(() => {
                    document.getElementById('climber').classList.remove('climbing-anim');
                    if (currentIndex >= 10) finishRoute();
                    else showLevel();
                }, 1200);
            } else {
                lives--;
                updateLives();
                document.getElementById('feedback').innerText = "❌ Revisa el càlcul!";
                document.getElementById('feedback').style.color = "red";
                btn.disabled = true;
                setTimeout(() => { btn.disabled = false; }, 4000);
                if (lives <= 0) { alert("Forces esgotades! Torna a començar la ruta."); goToMenu(); }
            }
        }

        function finishRoute() {
            completedRoutes[currentDiff] = true;
            const badgeId = currentDiff === 'fàcil' ? 'badge-easy' : (currentDiff === 'mitjana' ? 'badge-med' : 'badge-hard');
            document.getElementById(badgeId).classList.add('active');
            const btnId = currentDiff === 'fàcil' ? 'btn-route-easy' : (currentDiff === 'mitjana' ? 'btn-route-med' : 'btn-route-hard');
            document.getElementById(btnId).classList.add('completed');
            document.getElementById('card-game').classList.remove('active');
            document.getElementById('card-end').classList.add('active');
        }

        function goToMenu() {
            document.getElementById('card-game').classList.remove('active');
            document.getElementById('card-end').classList.remove('active');
            if(completedRoutes['fàcil'] && completedRoutes['mitjana'] && completedRoutes['difícil']) {
                document.getElementById('card-final').classList.add('active');
            } else {
                document.getElementById('card-select').classList.add('active');
                updateClimber(0);
            }
        }

        function updateLives() {
            document.getElementById('lives-icons').innerText = "❤️".repeat(Math.max(0, lives));
        }

        function updateClimber(step) {
            const climber = document.getElementById('climber');
            // Mantenim el personatge entre el 5% i el 90% d'alçada per seguretat
            const basePos = 5;
            const stepSize = 8.5; 
            let newBottom = basePos + (step * stepSize);
            if(newBottom > 92) newBottom = 92; // Límit superior per no sortir del mapa

            climber.style.bottom = newBottom + "%";
            climber.style.left = (50 + (step % 2 === 0 ? 3 : -3)) + "%";
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') checkAnswer();
        });
    </script>
</body>
</html>
