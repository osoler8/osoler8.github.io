<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛰️ EXPEDICIÓ MATEMÀTICA: EL GRAN REPTE ⛰️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Share+Tech+Mono&display=swap');

        :root {
            --sky-blue: #a1e3ff;
            --mountain-rock: #4b4b4b;
            --easy-green: #2ed573;
            --med-blue: #1e90ff;
            --hard-black: #2f3542;
            --danger-red: #ff4757;
        }

        * { box-sizing: border-box; }

        body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; height: 100vh; display: flex; flex-direction: column; background-color: var(--sky-blue); overflow: hidden; }

        /* --- CONTENIDOR PRINCIPAL --- */
        #main-wrapper { display: flex; flex: 1; height: calc(100vh - 40px); overflow: hidden; }

        /* --- PANELL ESQUERRA: MUNTANYA (FIXAT) --- */
        #mountain-viewport { 
            width: 40%; 
            height: 100%; 
            background: linear-gradient(to bottom, #74b9ff 0%, #ffffff 100%); 
            position: relative; 
            border-right: 5px solid #2f3542; 
            overflow: hidden; 
        }

        /* La muntanya ara es basa en el contenidor */
        .peak { 
            position: absolute; 
            bottom: 0; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 0; 
            height: 0; 
            border-left: 18vw solid transparent; 
            border-right: 18vw solid transparent; 
            border-bottom: 85vh solid var(--mountain-rock); 
            z-index: 1; 
        }

        .snow-cap { 
            position: absolute; 
            bottom: 55vh; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 0; 
            height: 0; 
            border-left: 6.5vw solid transparent; 
            border-right: 6.5vw solid transparent; 
            border-bottom: 30vh solid white; 
            z-index: 2; 
        }
        
        /* ESCALADOR (Dins de la muntanya) */
        #climber {
            position: absolute;
            width: 40px;
            height: 60px;
            z-index: 10;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            bottom: 5%; 
            left: 50%;
            transform: translateX(-50%);
        }
        .climber-head { width: 14px; height: 14px; background: #ffdbac; position: absolute; left: 13px; top: 0; border-radius: 50%; border: 1px solid #000; }
        .climber-body { width: 8px; height: 22px; background: #e74c3c; position: absolute; left: 16px; top: 14px; border-radius: 3px; }
        .arm { width: 12px; height: 4px; background: #e74c3c; position: absolute; top: 18px; }
        .arm.left { left: 4px; transform: rotate(45deg); }
        .arm.right { right: 4px; transform: rotate(-45deg); }
        .leg { width: 6px; height: 16px; background: #2f3542; position: absolute; top: 34px; }
        .leg.left { left: 13px; transform: rotate(15deg); }
        .leg.right { right: 13px; transform: rotate(-15deg); }

        .climbing-anim .arm.left { animation: armL 0.3s infinite alternate; }
        .climbing-anim .arm.right { animation: armR 0.3s infinite alternate; }
        @keyframes armL { from { transform: rotate(60deg); } to { transform: rotate(-20deg); } }
        @keyframes armR { from { transform: rotate(-60deg); } to { transform: rotate(20deg); } }

        /* --- PANELL DRETA: INTERFÍCIE --- */
        #game-panel { width: 60%; height: 100%; display: flex; flex-direction: column; background: #f0f2f5; }
        
        header { 
            background: white; 
            padding: 10px 25px; 
            border-bottom: 2px solid #ddd; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            min-height: 80px; 
        }
        
        .badges-container { display: flex; gap: 12px; }
        .badge { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            background: #e0e0e0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.5rem; 
            filter: grayscale(1) opacity(0.5); 
            transition: 0.5s; 
            border: 3px solid #ccc; 
        }
        .badge.active { filter: grayscale(0) opacity(1); border-color: #f1c40f; transform: scale(1.1); background: white; }

        #lives-display { font-weight: 700; font-size: 1.1rem; background: #f8d7da; padding: 8px 15px; border-radius: 10px; border: 1px solid #f5c6cb; }
        #lives-icons { color: var(--danger-red); margin-left: 5px; }

        #container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
        .card { background: white; padding: 35px; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 500px; text-align: center; display: none; }
        .active { display: block; animation: fadeInUp 0.4s ease-out; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .problem-box { font-size: 1.5rem; margin: 25px 0; padding: 25px; background: #f8f9fa; border-radius: 15px; border-left: 6px solid var(--med-blue); }
        .op-text { font-weight: bold; padding: 0 10px; color: #1e272e; }

        input { font-size: 2.2rem; width: 200px; padding: 12px; text-align: center; border: 3px solid #cbd5e0; border-radius: 15px; font-family: 'Share Tech Mono'; outline: none; margin-bottom: 20px; }
        input:focus { border-color: var(--med-blue); }

        .action-btn { background: var(--med-blue); color: white; border: none; padding: 15px 40px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .action-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .action-btn:disabled { background: #a0aec0; cursor: not-allowed; }

        /* --- PEU DE PÀGINA --- */
        footer { height: 40px; background: #1e272e; color: #cbd5e0; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold; }

    </style>
</head>
<body>

    <div id="main-wrapper">
        <div id="mountain-viewport">
            <div class="peak"></div>
            <div class="snow-cap"></div>
            <div id="climber">
                <div class="climber-head"></div>
                <div class="climber-body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>
        </div>

        <div id="game-panel">
            <header>
                <div class="badges-container">
                    <div id="badge-easy" class="badge">🌲</div>
                    <div id="badge-med" class="badge">❄️</div>
                    <div id="badge-hard" class="badge">🦅</div>
                </div>
                <div id="lives-display">
                    Vides: <span id="lives-icons">❤️❤️❤️</span>
                </div>
            </header>

            <div id="container">
                <div id="card-select" class="card active">
                    <h1 style="margin-top:0">🌋 Expedició matemàtica</h1>
                    <p>Completa les 3 rutes per arribar al cim final.</p>
                    <div style="display: grid; grid-template-columns: 1fr; gap: 10px; width: 100%;">
                        <button id="btn-easy" class="action-btn" style="background: var(--easy-green)" onclick="startRoute('fàcil')">RUTA VERDA (Fàcil)</button>
                        <button id="btn-med" class="action-btn" style="background: var(--med-blue)" onclick="startRoute('mitjana')">RUTA BLAVA (Mitjana)</button>
                        <button id="btn-hard" class="action-btn" style="background: var(--hard-black)" onclick="startRoute('difícil')">RUTA NEGRA (Difícil)</button>
                    </div>
                </div>

                <div id="card-game" class="card">
                    <h3 style="color:#718096">PREGUNTA <span id="node-idx">1</span> / 10</h3>
                    <div class="problem-box" id="problem-text"></div>
                    <input type="number" id="user-input" placeholder="?">
                    <br>
                    <button id="btn-submit" class="action-btn" onclick="checkAnswer()">COMPROVA</button>
                    <div id="feedback" style="margin-top:15px; font-weight:bold; min-height:20px"></div>
                </div>

                <div id="card-end" class="card">
                    <h1 style="font-size:3rem">🏆</h1>
                    <h2>RUTA COMPLETADA!</h2>
                    <p>Has guanyat una insígnia. Torna al menú per la següent.</p>
                    <button class="action-btn" onclick="goToMenu()">TORNAR AL MENÚ</button>
                </div>

                <div id="card-final" class="card">
                    <h1 style="color:#f1c40f; font-size:3rem">🏅</h1>
                    <h2>VICTÒRIA TOTAL!</h2>
                    <p>Increïble! Has dominat la muntanya matemàtica.</p>
                    <button class="action-btn" onclick="location.reload()">TORNA A JUGAR</button>
                </div>
            </div>
        </div>
    </div>

    <footer>Fet per Oriol Soler</footer>

    <script>
        const database = {
            'fàcil': [
                { q: "450 + 325", a: 775 }, { q: "900 - 465", a: 435 }, { q: "12 &times; 11", a: 132 }, { q: "150 / 5", a: 30 }, { q: "1.200 + 850", a: 2050 }, { q: "(10 + 5) &times; 2", a: 30 }, { q: "1.500 - 850", a: 650 }, { q: "25 &times; 4", a: 100 }, { q: "240 / 6", a: 40 }, { q: "50 + 50 &times; 2", a: 150 }
            ],
            'mitjana': [
                { q: "1.450 + 2.670", a: 4120 }, { q: "3.000 - 1.245", a: 1755 }, { q: "125 &times; 12", a: 1500 }, { q: "1.440 / 12", a: 120 }, { q: "(400 + 200) / 3", a: 200 }, { q: "10.000 - 4.560", a: 5440 }, { q: "45 &times; 22", a: 990 }, { q: "3.500 / 70", a: 50 }, { q: "(15 &times; 4) + (100 / 2)", a: 110 }, { q: "1.000 - 25 &times; 10", a: 750 }
            ],
            'difícil': [
                { q: "12.450 + 8.550", a: 21000 }, { q: "325 &times; 15", a: 4875 }, { q: "4.800 / 15", a: 320 }, { q: "5 &times; (1.200 - 850)", a: 1750 }, { q: "50.000 - 12.345", a: 37655 }, { q: "12 &times; 12 &times; 5", a: 720 }, { q: "15.625 / 25", a: 625 }, { q: "(300 + 200) &times; (40 / 8)", a: 2500 }, { q: "2.500 - 150 &times; 4", a: 1900 }, { q: "(800 / 4) + (125 &times; 8)", a: 1200 }
            ]
        };

        let currentDiff = '';
        let currentIndex = 0;
        let lives = 3;
        let completed = { 'fàcil': false, 'mitjana': false, 'difícil': false };

        function startRoute(diff) {
            currentDiff = diff;
            currentIndex = 0;
            lives = 3;
            document.getElementById('card-select').classList.remove('active');
            document.getElementById('card-game').classList.add('active');
            updateLives();
            showLevel();
            updateClimber(0);
        }

        function showLevel() {
            const level = database[currentDiff][currentIndex];
            document.getElementById('node-idx').innerText = currentIndex + 1;
            document.getElementById('problem-text').innerHTML = `<span class="op-text">${level.q}</span>`;
            document.getElementById('user-input').value = "";
            document.getElementById('user-input').focus();
            document.getElementById('feedback').innerText = "";
        }

        function checkAnswer() {
            const userVal = parseInt(document.getElementById('user-input').value);
            const correctVal = database[currentDiff][currentIndex].a;
            const btn = document.getElementById('btn-submit');

            if (userVal === correctVal) {
                currentIndex++;
                document.getElementById('climber').classList.add('climbing-anim');
                updateClimber(currentIndex);
                document.getElementById('feedback').innerText = "✅ CORRECTE!";
                document.getElementById('feedback').style.color = "#2ed573";
                
                setTimeout(() => {
                    document.getElementById('climber').classList.remove('climbing-anim');
                    if (currentIndex >= 10) finishRoute();
                    else showLevel();
                }, 1300);
            } else {
                lives--;
                updateLives();
                document.getElementById('feedback').innerText = "❌ REVISA EL CÀLCUL!";
                document.getElementById('feedback').style.color = "#ff4757";
                btn.disabled = true;
                setTimeout(() => { btn.disabled = false; }, 4000);
                if (lives <= 0) { alert("Has perdut les vides! Torna a començar la ruta."); goToMenu(); }
            }
        }

        function finishRoute() {
            completed[currentDiff] = true;
            const idBadge = currentDiff === 'fàcil' ? 'badge-easy' : (currentDiff === 'mitjana' ? 'badge-med' : 'badge-hard');
            document.getElementById(idBadge).classList.add('active');
            
            const idBtn = currentDiff === 'fàcil' ? 'btn-easy' : (currentDiff === 'mitjana' ? 'btn-med' : 'btn-hard');
            document.getElementById(idBtn).style.opacity = "0.5";
            document.getElementById(idBtn).innerText += " ✅";
            document.getElementById(idBtn).disabled = true;

            document.getElementById('card-game').classList.remove('active');
            document.getElementById('card-end').classList.add('active');
        }

        function goToMenu() {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            if(completed['fàcil'] && completed['mitjana'] && completed['difícil']) {
                document.getElementById('card-final').classList.add('active');
            } else {
                document.getElementById('card-select').classList.add('active');
                updateClimber(0);
            }
        }

        function updateLives() {
            document.getElementById('lives-icons').innerText = "❤️".repeat(Math.max(0, lives));
        }

        function updateClimber(step) {
            const c = document.getElementById('climber');
            const bottomPos = 5 + (step * 8.5); 
            c.style.bottom = bottomPos + "%";
            // Oscil·lació lateral per realisme
            c.style.left = (50 + (step % 2 === 0 ? 2 : -2)) + "%";
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') checkAnswer();
        });
    </script>
</body>
</html>
