<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERATIUM - Matemàtiques Romanes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:wght@400;700&display=swap');

        :root {
            --roman-red: #8b0000;
            --dark-red: #3d0000;
            --gold: #c5a059;
            --light-bg: #fdfbf7;
            --text-dark: #1a1a1a;
        }

        body {
            font-family: 'Lora', serif;
            background: linear-gradient(135deg, var(--dark-red) 0%, #111111 100%);
            color: var(--light-bg);
            text-align: center;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background-color: var(--light-bg);
            color: var(--text-dark);
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            max-width: 600px;
            width: 90%;
            border: 3px solid var(--gold);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--roman-red);
            font-size: 3.5em;
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: 700;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.2em;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.1em;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #444;
        }

        .level-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn {
            background: var(--light-bg);
            color: var(--roman-red);
            border: 2px solid var(--gold);
            padding: 15px 25px;
            font-size: 1.1em;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            width: 80%;
            max-width: 350px;
            margin-bottom: 5px;
        }

        .btn:hover {
            background: var(--roman-red);
            color: var(--light-bg);
            border-color: var(--roman-red);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 0, 0, 0.3);
        }

        .high-score-text {
            font-size: 0.9em;
            color: var(--gold);
            font-weight: bold;
        }

        .btn-abandon {
            background: transparent;
            color: #777;
            border: 1px solid #ccc;
            font-size: 0.9em;
            margin-top: 20px;
            width: auto;
        }

        .btn-abandon:hover {
            background: #eee;
            color: var(--text-dark);
            border-color: #999;
            box-shadow: none;
            transform: none;
        }

        #game-screen, #game-over-screen {
            display: none;
        }

        .stats-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #e0d8c3;
            margin-bottom: 30px;
            font-size: 1.1em;
            font-weight: bold;
            color: var(--roman-red);
        }

        .lives {
            font-size: 1.3em;
            letter-spacing: 2px;
        }

        .problem {
            font-size: 4.5em;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 30px 0;
            color: var(--text-dark);
        }

        input[type="number"] {
            font-size: 2.5em;
            padding: 15px;
            width: 60%;
            text-align: center;
            border: 2px solid var(--gold);
            border-radius: 8px;
            background: #fff;
            color: var(--roman-red);
            margin-bottom: 25px;
            font-family: 'Lora', serif;
            font-weight: bold;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--roman-red);
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.1);
        }

        .feedback {
            font-size: 1.2em;
            min-height: 30px;
            margin-top: 20px;
            font-weight: bold;
        }

        .correct { color: #2e7d32; }
        .incorrect { color: var(--roman-red); }
        
        #new-record-msg {
            color: #2e7d32;
            font-weight: bold;
            font-size: 1.3em;
            margin-top: 10px;
            display: none;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

    </style>
</head>
<body>

    <div class="container" id="menu-screen">
        <h1>OPERATIUM</h1>
        <h2>L'Imperi de les Matemàtiques</h2>
        <p>Uneix-te a les legions de Roma. Resol els càlculs, guanya denaris i demostra el teu valor en combat.</p>
        
        <div class="level-card">
            <button class="btn" onclick="startGame(1)">Auxiliar (1r nivell)</button>
            <div class="high-score-text">Rècord: <span id="hs-1">0</span> 🪙</div>
        </div>
        
        <div class="level-card">
            <button class="btn" onclick="startGame(2)">Legionari (2n nivell)</button>
            <div class="high-score-text">Rècord: <span id="hs-2">0</span> 🪙</div>
        </div>
        
        <div class="level-card">
            <button class="btn" onclick="startGame(3)">Centurió (3r nivell)</button>
            <div class="high-score-text">Rècord: <span id="hs-3">0</span> 🪙</div>
        </div>
    </div>

    <div class="container" id="game-screen">
        <div class="stats-board">
            <div>Denaris: <span id="score-display">0</span> 🪙</div>
            <div class="lives" id="lives-display">🛡️🛡️🛡️</div>
        </div>
        
        <div class="problem" id="math-problem"></div>
        <input type="number" id="answer-input" autocomplete="off" onkeypress="handleEnter(event)" placeholder="Resposta...">
        <br>
        
        <button class="btn" onclick="checkAnswer()">Confirmar</button>
        <br>
        <button class="btn btn-abandon" onclick="showMenu()">Tornar al campament</button>
        
        <div class="feedback" id="feedback-msg"></div>
    </div>

    <div class="container" id="game-over-screen">
        <h1>FI DE LA BATALLA</h1>
        <h2>Has perdut tots els escuts</h2>
        <p style="font-size: 1.5em; margin: 30px 0; color: var(--text-dark);">
            Total recollit:<br>
            <strong style="font-size: 1.5em; color: var(--gold);"><span id="final-score"></span> 🪙</strong>
        </p>
        <div id="new-record-msg">🏆 NOU RÈCORD ACONSEGUIT! 🏆</div>
        <button class="btn" style="margin-top: 20px;" onclick="showMenu()">Tornar a jugar</button>
    </div>

    <script>
        let currentLevel = 1;
        let score = 0;
        let streak = 0;
        let lives = 3;
        let correctAnswer = 0;

        // Carregar rècords guardats al navegador
        let highScores = JSON.parse(localStorage.getItem('operatiumHighScores')) || { 1: 0, 2: 0, 3: 0 };

        // Actualitzar visió dels rècords al carregar la pàgina
        function updateHighScoreDisplay() {
            document.getElementById('hs-1').innerText = highScores[1];
            document.getElementById('hs-2').innerText = highScores[2];
            document.getElementById('hs-3').innerText = highScores[3];
        }

        // Executar la primera vegada
        updateHighScoreDisplay();

        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function startGame(level) {
            currentLevel = level;
            score = 0;
            streak = 0;
            lives = 3;
            updateStats();
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('new-record-msg').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('feedback-msg').innerHTML = '';
            generateProblem();
        }

        function showMenu() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
            updateHighScoreDisplay();
        }

        function generateProblem() {
            const ops = ['+', '-', '*', '/'];
            const op = ops[Math.floor(Math.random() * ops.length)];
            let num1, num2;

            if (currentLevel === 1) { 
                if (op === '+') { num1 = rand(1000, 9999); num2 = rand(100, 9999); correctAnswer = num1 + num2; }
                if (op === '-') { num1 = rand(1000, 9999); num2 = rand(100, num1 - 1); correctAnswer = num1 - num2; }
                if (op === '*') { num1 = rand(100, 9999); num2 = rand(2, 9); correctAnswer = num1 * num2; }
                if (op === '/') { num2 = rand(2, 9); correctAnswer = rand(10, 999); num1 = num2 * correctAnswer; }
            } else if (currentLevel === 2) { 
                if (op === '+') { num1 = rand(10000, 99999); num2 = rand(1000, 99999); correctAnswer = num1 + num2; }
                if (op === '-') { num1 = rand(10000, 99999); num2 = rand(1000, num1 - 1); correctAnswer = num1 - num2; }
                if (op === '*') { num1 = rand(100, 9999); num2 = rand(10, 99); correctAnswer = num1 * num2; }
                if (op === '/') { num2 = rand(2, 12); correctAnswer = rand(100, 4000); num1 = num2 * correctAnswer; }
            } else { 
                if (op === '+') { num1 = rand(50000, 999999); num2 = rand(10000, 999999); correctAnswer = num1 + num2; }
                if (op === '-') { num1 = rand(50000, 999999); num2 = rand(10000, num1 - 1); correctAnswer = num1 - num2; }
                if (op === '*') { num1 = rand(1000, 9999); num2 = rand(100, 999); correctAnswer = num1 * num2; }
                if (op === '/') { num2 = rand(10, 99); correctAnswer = rand(100, 9999); num1 = num2 * correctAnswer; }
            }

            const opSymbol = op === '*' ? '×' : op === '/' ? '÷' : op;
            const formatNumber = (num) => num.toLocaleString('ca-ES');

            document.getElementById('math-problem').innerText = `${formatNumber(num1)} ${opSymbol} ${formatNumber(num2)}`;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
        }

        function checkAnswer() {
            const userInput = document.getElementById('answer-input').value;
            const cleanInput = userInput.replace(/\./g, '');
            const userAnswer = parseInt(cleanInput);
            const feedback = document.getElementById('feedback-msg');

            if (isNaN(userAnswer)) {
                feedback.innerHTML = "Introdueix un número vàlid.";
                feedback.className = "feedback incorrect";
                return;
            }

            if (userAnswer === correctAnswer) {
                streak++;
                let pointsEarned = (10 * currentLevel) + (streak * 5);
                score += pointsEarned;
                
                feedback.innerHTML = `Correcte! (+${pointsEarned} 🪙)`;
                feedback.className = "feedback correct";
                updateStats();
                
                setTimeout(() => {
                    feedback.innerHTML = '';
                    generateProblem();
                }, 1200);
            } else {
                streak = 0;
                lives--;
                feedback.innerHTML = "Incorrecte. Era " + correctAnswer.toLocaleString('ca-ES');
                feedback.className = "feedback incorrect";
                updateStats();
                
                if (lives <= 0) {
                    setTimeout(() => {
                        endGame();
                    }, 2000);
                } else {
                    setTimeout(() => {
                        feedback.innerHTML = '';
                        generateProblem();
                    }, 2000);
                }
            }
        }

        function updateStats() {
            document.getElementById('score-display').innerText = score;
            
            let livesHtml = "";
            for(let i=0; i<lives; i++) livesHtml += "🛡️";
            for(let i=lives; i<3; i++) livesHtml += "❌";
            document.getElementById('lives-display').innerHTML = livesHtml;
        }

        function endGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'block';
            document.getElementById('final-score').innerText = score;

            // Comprovar si hi ha nou rècord
            if (score > highScores[currentLevel]) {
                highScores[currentLevel] = score;
                localStorage.setItem('operatiumHighScores', JSON.stringify(highScores));
                document.getElementById('new-record-msg').style.display = 'block';
            }
        }

        function handleEnter(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        }
    </script>
</body>
</html>
