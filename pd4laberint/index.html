<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Joc del Laberint</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { margin-top: 0; margin-bottom: 5px; color: #4CAF50; text-align: center; }
        .instructions {
            max-width: 600px;
            text-align: center;
            margin-bottom: 15px;
            color: #bbb;
            line-height: 1.4;
            font-size: 14px;
        }
        .ui-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
        }
        .score-box {
            font-size: 22px;
            font-weight: bold;
            background: #2c3e50;
            padding: 10px 20px;
            border-radius: 8px;
            color: #f4d03f;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .status-msg {
            font-size: 14px;
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            padding: 5px 10px;
            border-radius: 4px;
            display: none; /* Amagat per defecte */
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
            border: 4px solid #2c3e50;
            background: #000;
        }
        canvas {
            display: block;
            max-width: 100vw;
            max-height: 60vh;
            object-fit: contain;
        }
        .controls {
            display: none; /* Només es mostra en mòbils */
            margin-top: 20px;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 8px;
        }
        .btn {
            background: #34495e;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 0 #1abc9c;
            transition: all 0.1s;
        }
        .btn:active {
            box-shadow: 0 0 0 #1abc9c;
            transform: translateY(4px);
            background: #1abc9c;
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        #winScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        #winScreen h2 { font-size: 40px; color: #f4d03f; margin-bottom: 10px; text-align: center; }
        #winScreen p { font-size: 20px; margin-bottom: 30px; }
        #winScreen button {
            padding: 15px 30px; font-size: 20px; background: #1abc9c;
            border: none; border-radius: 8px; color: white; cursor: pointer;
            box-shadow: 0 4px 0 #16a085;
            font-weight: bold;
        }
        #winScreen button:active { transform: translateY(4px); box-shadow: 0 0 0 #16a085; }
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
            text-align: center;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Explora el Laberint</h1>
    <div class="instructions">
        Fes servir les <b>fletxes del teclat</b> o els controls per moure el jugador/a.<br>
        Has de passar per sobre de tots els <b>punts grocs</b> per guanyar!
    </div>

    <div class="ui-bar">
        <div class="status-msg" id="statusMsg">Mode estricte (no s'ha trobat la imatge)</div>
        <div class="score-box">Punts: <span id="score">0</span> / <span id="total">?</span></div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="winScreen">
            <h2>Molt bé! 🎉</h2>
            <p>Has recollit tots els punts grocs!</p>
            <button onclick="resetGame()">Tornar a jugar</button>
        </div>
    </div>

    <div class="controls" id="touchControls">
        <div class="d-pad">
            <button class="btn btn-up" id="btnUp">▲</button>
            <button class="btn btn-left" id="btnLeft">◀</button>
            <button class="btn btn-right" id="btnRight">▶</button>
            <button class="btn btn-down" id="btnDown">▼</button>
        </div>
    </div>

    <div class="footer">
        PD4 PCMAT - Creat per Oriol Soler
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const totalEl = document.getElementById('total');
        const winScreen = document.getElementById('winScreen');
        const statusMsg = document.getElementById('statusMsg');

        let useImageMode = false;
        let imgDataArray = null;
        let imgWidth = 0;
        let imgHeight = 0;
        let dots = [];
        let score = 0;
        let gameLoopId;
        let bgImage = null;

        // Jugador
        let player = { x: 50, y: 50, radius: 5, speed: 2.5 };
        let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false };

        // Detecció de mòbil per mostrar controls tàctils
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('touchControls').style.display = 'block';
        }

        // Events de teclat
        window.addEventListener('keydown', (e) => { 
            // Evitar que la pàgina faci scroll amb les fletxes i l'espai
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(e.key) > -1) {
                e.preventDefault();
            }
            if(keys.hasOwnProperty(e.key)) keys[e.key] = true; 
        }, { passive: false });
        
        window.addEventListener('keyup', (e) => { 
            if(keys.hasOwnProperty(e.key)) keys[e.key] = false; 
        });

        // Events tàctils per mòbils
        const bindBtn = (id, key) => {
            const btn = document.getElementById(id);
            if(!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindBtn('btnUp', 'ArrowUp'); bindBtn('btnDown', 'ArrowDown'); 
        bindBtn('btnLeft', 'ArrowLeft'); bindBtn('btnRight', 'ArrowRight');

        // ====== MOTOR 1: LECTURA DE LA IMATGE ======
        const img = new Image();
        img.crossOrigin = "Anonymous";
        
        img.onload = () => {
            try {
                // Provem d'extreure els píxels
                let tCan = document.createElement('canvas');
                tCan.width = img.width; tCan.height = img.height;
                let tCtx = tCan.getContext('2d', { willReadFrequently: true });
                tCtx.drawImage(img, 0, 0);
                let idata = tCtx.getImageData(0, 0, img.width, img.height);
                
                imgDataArray = idata.data;
                imgWidth = img.width;
                imgHeight = img.height;
                bgImage = img;
                useImageMode = true;
                
                initImageMode();
            } catch(e) {
                // Error de CORS
                console.warn("CORS Error - utilitzant laberint per defecte", e);
                showFallbackMessage();
                initGridMode();
            }
        };

        img.onerror = () => {
            showFallbackMessage();
            initGridMode();
        };

        // Carrega la imatge de l'usuari
        img.src = 'pcmat.png';

        function showFallbackMessage() {
            statusMsg.style.display = 'block';
            statusMsg.innerText = "S'usa el mapa generat (pcmat.png no trobat o blocat per CORS en local)";
        }

        function initImageMode() {
            canvas.width = imgWidth;
            canvas.height = imgHeight;
            extractDotsFromImage();

            if(dots.length > 0) {
                // Ordenem d'esquerra a dreta per trobar l'entrada
                let leftmost = dots.slice().sort((a,b) => a.x - b.x)[0];
                player.x = leftmost.x;
                player.y = leftmost.y;
                // Ajustem la mida del jugador al tamany del punt groc
                player.radius = Math.max(4, Math.min(12, leftmost.radius * 0.8));
                player.speed = player.radius * 0.6; 
            } else {
                player.x = 20; player.y = imgHeight / 2;
                player.radius = 6;
            }

            totalEl.innerText = dots.length;
            startGame();
        }

        // Cerca els punts grocs llegint els píxels
        function extractDotsFromImage() {
            dots = [];
            let visited = new Uint8Array(imgWidth * imgHeight);
            
            for(let y=0; y<imgHeight; y+=2) {
                for(let x=0; x<imgWidth; x+=2) {
                    let idx = (y * imgWidth + x) * 4;
                    let r = imgDataArray[idx], g = imgDataArray[idx+1], b = imgDataArray[idx+2];
                    
                    // Detecta el color groc
                    if(r > 180 && g > 160 && b < 120 && !visited[y*imgWidth+x]) {
                        let q = [{x,y}]; 
                        visited[y*imgWidth+x] = 1;
                        let minX=x, maxX=x, minY=y, maxY=y;
                        let count = 0;
                        
                        while(q.length > 0) {
                            let p = q.pop();
                            count++;
                            if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x;
                            if(p.y < minY) minY = p.y; if(p.y > maxY) maxY = p.y;
                            
                            let nbrs = [{x:p.x+1,y:p.y}, {x:p.x-1,y:p.y}, {x:p.x,y:p.y+1}, {x:p.x,y:p.y-1}];
                            for(let n of nbrs) {
                                if(n.x>=0 && n.x<imgWidth && n.y>=0 && n.y<imgHeight) {
                                    if(!visited[n.y*imgWidth+n.x]) {
                                        let nI = (n.y*imgWidth+n.x)*4;
                                        let nr = imgDataArray[nI], ng = imgDataArray[nI+1], nb = imgDataArray[nI+2];
                                        if(nr > 150 && ng > 140 && nb < 150) { 
                                            visited[n.y*imgWidth+n.x] = 1;
                                            q.push(n);
                                        }
                                    }
                                }
                            }
                        }
                        
                        if(count > 8) {
                            dots.push({ 
                                x: (minX+maxX)/2, 
                                y: (minY+maxY)/2, 
                                radius: Math.max((maxX-minX)/2, (maxY-minY)/2), 
                                collected: false 
                            });
                        }
                    }
                }
            }
        }

        // Col·lisió amb els murs de la imatge
        function isWallImage(x, y, radius) {
            const points = [
                {dx: 0, dy: 0},
                {dx: radius, dy: 0}, {dx: -radius, dy: 0},
                {dx: 0, dy: radius}, {dx: 0, dy: -radius},
                {dx: radius*0.7, dy: radius*0.7}, {dx: -radius*0.7, dy: -radius*0.7},
                {dx: radius*0.7, dy: -radius*0.7}, {dx: -radius*0.7, dy: radius*0.7}
            ];
            for(let p of points) {
                let cx = Math.floor(x + p.dx);
                let cy = Math.floor(y + p.dy);
                if(cx < 0 || cy < 0 || cx >= imgWidth || cy >= imgHeight) return true;
                
                let idx = (cy * imgWidth + cx) * 4;
                let r = imgDataArray[idx], g = imgDataArray[idx+1], b = imgDataArray[idx+2];
                
                let brightness = (r + g + b) / 3;
                if(brightness < 140) return true;
            }
            return false;
        }

        // ====== MOTOR 2: MAPA GENERAT (FALLBACK) ======
        const fallbackMap = [
            "1111111111111111111111111111111",
            "1000000000000000000000000000001",
            "1011111110111111111111111011101",
            "1010000010100000000000001010001",
            "1010111010101111111111101010101",
            "1010121010101000000000101010101",
            "1010101010101011111110101010101",
            "1010101010101010000010101010101",
            "1010101010101010000010101010101",
            "2020101020101010000020101020101",
            "1010101010101011111110101010101",
            "1010101010101000000000101010101",
            "1010101010101111111111101010101",
            "1010101010100000000000001010101",
            "1010101010111111111111111010101",
            "1012101010000000000000000012101",
            "1010111011111111111111111110101",
            "1010000000000000000000000000101",
            "1111111111111111111111111111111"
        ];
        const TILE_SIZE = 25;

        function initGridMode() {
            canvas.width = fallbackMap[0].length * TILE_SIZE;
            canvas.height = fallbackMap.length * TILE_SIZE;
            dots = [];
            
            for(let y=0; y<fallbackMap.length; y++) {
                for(let x=0; x<fallbackMap[y].length; x++) {
                    if(fallbackMap[y][x] === '2') {
                        dots.push({ 
                            x: x*TILE_SIZE + TILE_SIZE/2, 
                            y: y*TILE_SIZE + TILE_SIZE/2, 
                            radius: TILE_SIZE/4, 
                            collected: false 
                        });
                    }
                }
            }
            player.radius = TILE_SIZE * 0.3;
            player.speed = 3;
            if(dots.length > 0) {
                let leftmost = dots.slice().sort((a,b) => a.x - b.x)[0];
                player.x = leftmost.x; player.y = leftmost.y;
            }
            totalEl.innerText = dots.length;
            startGame();
        }

        function isWallGrid(x, y, radius) {
            const points = [
                {dx: radius, dy: radius}, {dx: -radius, dy: -radius},
                {dx: radius, dy: -radius}, {dx: -radius, dy: radius}
            ];
            for(let p of points) {
                let gx = Math.floor((x + p.dx) / TILE_SIZE);
                let gy = Math.floor((y + p.dy) / TILE_SIZE);
                if(gy < 0 || gy >= fallbackMap.length || gx < 0 || gx >= fallbackMap[0].length) return true;
                if(fallbackMap[gy][gx] === '1') return true;
            }
            return false;
        }

        // ====== LÒGICA GENERAL DEL JOC ======
        function startGame() {
            score = 0;
            scoreEl.innerText = score;
            winScreen.style.display = 'none';
            if(gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoop();
        }

        function resetGame() {
            dots.forEach(d => d.collected = false);
            if(dots.length > 0) {
                let leftmost = dots.slice().sort((a,b) => a.x - b.x)[0];
                player.x = leftmost.x; player.y = leftmost.y;
            }
            startGame();
        }

        function checkWall(x, y, radius) {
            return useImageMode ? isWallImage(x, y, radius) : isWallGrid(x, y, radius);
        }

        function update() {
            let dx = 0, dy = 0;
            if(keys.ArrowUp || keys.w) dy -= player.speed;
            if(keys.ArrowDown || keys.s) dy += player.speed;
            if(keys.ArrowLeft || keys.a) dx -= player.speed;
            if(keys.ArrowRight || keys.d) dx += player.speed;

            if(dx !== 0 && dy !== 0) {
                let len = Math.sqrt(dx*dx + dy*dy);
                dx = (dx/len) * player.speed;
                dy = (dy/len) * player.speed;
            }

            // NOVA CAIXA DE COL·LISIÓ (Hitbox): 
            // Fem que la paret xoqui només amb el centre de la rodona (40% de la mida real)
            // Això permet lliscar perfectament per les parets sense encallar-se.
            let hitbox = player.radius * 0.4;

            if(!checkWall(player.x + dx, player.y, hitbox)) player.x += dx;
            if(!checkWall(player.x, player.y + dy, hitbox)) player.y += dy;

            // Comprovar col·lisió amb punts grocs
            for(let d of dots) {
                if(!d.collected) {
                    let dist = Math.sqrt(Math.pow(player.x - d.x, 2) + Math.pow(player.y - d.y, 2));
                    if(dist < player.radius + d.radius) {
                        d.collected = true;
                        score++;
                        scoreEl.innerText = score;
                        if(score === dots.length) {
                            winScreen.style.display = 'flex';
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if(useImageMode && bgImage) {
                ctx.drawImage(bgImage, 0, 0);
                
                for(let d of dots) {
                    if(d.collected) {
                        ctx.beginPath();
                        ctx.arc(d.x, d.y, d.radius + 3, 0, Math.PI*2);
                        ctx.fillStyle = '#fdf8e4'; // Color del camí (oculta el punt groc)
                        ctx.fill();
                    }
                }
            } else {
                for(let y=0; y<fallbackMap.length; y++) {
                    for(let x=0; x<fallbackMap[y].length; x++) {
                        if(fallbackMap[y][x] === '1') {
                            ctx.fillStyle = '#006633';
                            ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        } else {
                            ctx.fillStyle = '#fdf8e4';
                            ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
                for(let d of dots) {
                    if(!d.collected) {
                        ctx.beginPath();
                        ctx.arc(d.x, d.y, d.radius, 0, Math.PI*2);
                        ctx.fillStyle = '#F4D03F';
                        ctx.fill();
                    }
                }
            }

            // Dibuixa el jugador
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = '#E74C3C'; // Vermell
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#C0392B';
            ctx.stroke();
        }

        function gameLoop() {
            update();
            draw();
            if(score < dots.length) {
                gameLoopId = requestAnimationFrame(gameLoop);
            } else {
                draw(); // Dibuixa l'últim frame
            }
        }
    </script>
</body>
</html>
