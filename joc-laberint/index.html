<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laberint dels Matemàtics</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f5f0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-top: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        button {
            background-color: #1d5932;
            color: white;
            border: none;
            transition: background 0.2s;
        }
        button:hover { background-color: #144023; }
        
        /* Contenidor del tauler */
        #board-container {
            position: relative;
            margin: 40px; /* Espai pels marcadors E i S que surten fora */
        }
        
        #game-board {
            display: grid;
            background: #fff;
            padding: 10px;
            border: 2px solid #333;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        /* Elements de la graella */
        .cell {
            background: #cdd4d9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .obstacle { background: #a2a0a8; }
        
        /* Murs clicables */
        .wall-v, .wall-h {
            background: #e0e0e0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .wall-v:hover, .wall-h:hover { background: #bbb; }
        .wall-v.active, .wall-h.active { background: #000; }
        .pillar { background: #333; }

        /* Indicadors d'Entrada/Sortida */
        .marker {
            position: absolute;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 2px solid #333;
        }
        .marker.start { background: #b8e6c7; color: #1d5932; }
        .marker.end { background: #f2c7d2; color: #7d1c3a; }
        
        /* Posicions dels marcadors */
        .pos-top { top: -32px; left: -2px; width: calc(100% + 4px); height: 30px; border-bottom: none; }
        .pos-bottom { bottom: -32px; left: -2px; width: calc(100% + 4px); height: 30px; border-top: none; }
        .pos-left { left: -32px; top: -2px; width: 30px; height: calc(100% + 4px); border-right: none; }
        .pos-right { right: -32px; top: -2px; width: 30px; height: calc(100% + 4px); border-left: none; }

        /* El personatge */
        .player {
            width: 20px;
            height: 20px;
            background-color: #007bff;
            border-radius: 50%;
            position: absolute;
            z-index: 10;
            transition: all 0.3s ease;
        }
        .visited { background: #f2d250 !important; }

        /* Peu de pàgina */
        .footer {
            margin-top: auto;
            padding: 15px;
            background-color: #333;
            color: #fff;
            width: 100%;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Laberint dels Matemàtics</h1>
        
        <div class="controls">
            <select id="level-select" onchange="loadLevel(parseInt(this.value))">
                <option value="0">Nivell 1</option>
                <option value="1">Nivell 2</option>
                <option value="2">Nivell 3</option>
                <option value="3">Nivell 4</option>
                <option value="4">Nivell 5</option>
            </select>
            <button onclick="walkPath()">🚶‍♂️ Resoldre (Caminar)</button>
            <button onclick="resetBoard()">🔄 Netejar Parets</button>
        </div>
    </div>

    <div id="board-container">
        <div id="game-board"></div>
    </div>

    <div class="footer">PD4 PCMAT - Creat per Oriol Soler</div>

    <script>
        // Definició de nivells basats en el PDF original
        const levels = [
            {
                // Nivell 1
                cols: 5, rows: 5,
                E: { r: 4, c: 2, pos: 'bottom' },
                S: { r: 0, c: 2, pos: 'top' },
                grayCells: [[0,0], [0,1], [4,3], [4,4]]
            },
            {
                // Nivell 2
                cols: 6, rows: 5,
                E: { r: 4, c: 1, pos: 'bottom' },
                S: { r: 0, c: 1, pos: 'top' },
                grayCells: [[0,0], [0,5], [1,5], [3,5], [4,0], [4,5]]
            },
            {
                // Nivell 3
                cols: 7, rows: 6,
                E: { r: 0, c: 0, pos: 'left' },
                S: { r: 0, c: 3, pos: 'top' },
                grayCells: [[2,3]]
            },
            {
                // Nivell 4
                cols: 7, rows: 6,
                E: { r: 0, c: 4, pos: 'top' },
                S: { r: 5, c: 0, pos: 'bottom' },
                grayCells: [[2,3], [2,4], [3,3], [3,4]]
            },
            {
                // Nivell 5
                cols: 8, rows: 7,
                E: { r: 1, c: 7, pos: 'right' },
                S: { r: 6, c: 0, pos: 'bottom' },
                grayCells: [[0,0], [0,7], [2,3], [2,4], [3,3], [3,4], [4,7], [5,7], [6,7]]
            }
        ];

        let currentLevelIndex = 0;
        let cellsDom = [];
        let walls = {};
        let playerDom = null;

        const board = document.getElementById('game-board');

        function loadLevel(index) {
            currentLevelIndex = index;
            const level = levels[index];
            buildGrid(level);
        }

        function buildGrid(level) {
            board.innerHTML = '';
            cellsDom = [];
            walls = {};
            
            const { cols, rows, E, S, grayCells } = level;

            let colTemplate = "60px";
            for (let i = 1; i < cols; i++) colTemplate += " 10px 60px";
            board.style.gridTemplateColumns = colTemplate;

            for (let r = 0; r < rows * 2 - 1; r++) {
                cellsDom[Math.floor(r/2)] = cellsDom[Math.floor(r/2)] || [];
                for (let c = 0; c < cols * 2 - 1; c++) {
                    const div = document.createElement('div');
                    const isCellRow = r % 2 === 0;
                    const isCellCol = c % 2 === 0;

                    if (isCellRow && isCellCol) {
                        const cellR = r/2; const cellC = c/2;
                        div.className = 'cell';
                        div.id = `cell-${cellR}-${cellC}`;
                        
                        if (grayCells.some(g => g[0] === cellR && g[1] === cellC)) {
                            div.classList.add('obstacle');
                        }

                        if (E.r === cellR && E.c === cellC) {
                            div.innerHTML += `<div class="marker start pos-${E.pos}">E</div>`;
                        }
                        if (S.r === cellR && S.c === cellC) {
                            div.innerHTML += `<div class="marker end pos-${S.pos}">S</div>`;
                        }
                        
                        cellsDom[cellR][cellC] = div;
                    } 
                    else if (isCellRow && !isCellCol) {
                        div.className = 'wall-v';
                        div.id = `v-${r/2}-${(c-1)/2}`;
                        div.onclick = () => toggleWall(div.id);
                    } 
                    else if (!isCellRow && isCellCol) {
                        div.className = 'wall-h';
                        div.id = `h-${(r-1)/2}-${c/2}`;
                        div.onclick = () => toggleWall(div.id);
                    } 
                    else {
                        div.className = 'pillar';
                    }

                    div.style.height = isCellRow ? '60px' : '10px';
                    board.appendChild(div);
                }
            }
        }

        function toggleWall(id) {
            const el = document.getElementById(id);
            el.classList.toggle('active');
            walls[id] = el.classList.contains('active');
        }

        function resetBoard() {
            loadLevel(currentLevelIndex);
        }

        async function walkPath() {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('visited'));
            if(playerDom) playerDom.remove();

            const level = levels[currentLevelIndex];
            let { r, c } = level.E;
            let visitedCount = 0;
            let pathBlocked = false;

            const totalToVisit = (level.cols * level.rows) - level.grayCells.length;

            playerDom = document.createElement('div');
            playerDom.className = 'player';
            cellsDom[r][c].appendChild(playerDom);

            while (!pathBlocked) {
                cellsDom[r][c].classList.add('visited');
                cellsDom[r][c].appendChild(playerDom);
                visitedCount++;

                if (r === level.S.r && c === level.S.c) {
                    await sleep(300);
                    if (visitedCount === totalToVisit) {
                        alert('🏆 Enhorabona! Has passat per totes les caselles!');
                    } else {
                        alert(`❌ Has arribat a la sortida, però t'has deixat ${totalToVisit - visitedCount} caselles per visitar.`);
                    }
                    return;
                }

                await sleep(300);

                const neighbors = [];
                if (r > 0 && !walls[`h-${r-1}-${c}`] && isValid(r-1, c)) neighbors.push({nr: r-1, nc: c});
                if (r < level.rows-1 && !walls[`h-${r}-${c}`] && isValid(r+1, c)) neighbors.push({nr: r+1, nc: c});
                if (c > 0 && !walls[`v-${r}-${c-1}`] && isValid(r, c-1)) neighbors.push({nr: r, nc: c-1});
                if (c < level.cols-1 && !walls[`v-${r}-${c}`] && isValid(r, c+1)) neighbors.push({nr: r, nc: c+1});

                if (neighbors.length === 1) {
                    r = neighbors[0].nr;
                    c = neighbors[0].nc;
                } else if (neighbors.length > 1) {
                    alert("⛔ El personatge està confús! Has deixat bifurcacions obertes. Construeix més parets per fer un camí únic.");
                    pathBlocked = true;
                } else {
                    alert("🧱 El personatge s'ha quedat atrapat o no troba la sortida.");
                    pathBlocked = true;
                }
            }
        }

        function isValid(r, c) {
            const cell = cellsDom[r][c];
            return !(cell.classList.contains('visited') || cell.classList.contains('obstacle'));
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        // Iniciar el joc amb el nivell 1
        window.onload = () => loadLevel(0);
    </script>
</body>
</html>
