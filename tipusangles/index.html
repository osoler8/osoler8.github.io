<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipus d'angles</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <style>
    :root {
      --primary: #4a90e2;
      --success: #48bb78;
      --error: #f56565;
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #1e293b;
    }

    body {
      margin: 0; padding: 0;
      display: flex;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg);
      height: 100vh;
      overflow: hidden;
    }

    #ui-panel {
      width: 320px;
      background: var(--panel);
      box-shadow: 4px 0 15px rgba(0,0,0,0.05);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      z-index: 10;
    }

    .mode-selector {
      display: flex;
      gap: 5px;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 10px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .active-mode { background: var(--primary); color: white; }

    .info-box {
      background: #f1f5f9;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
    }

    .angle-value { font-size: 2.2rem; font-weight: 800; color: var(--primary); }
    
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .option-btn {
      padding: 10px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    .option-btn:hover { border-color: var(--primary); background: #f0f7ff; }
    
    .feedback {
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      display: none;
      margin-top: 10px;
    }

    #canvas-container {
      flex-grow: 1;
      position: relative;
    }
  </style>
</head>
<body>

  <div id="ui-panel">
    <h2 style="margin:0; color:var(--primary)">Angles i Geometria</h2>
    
    <div class="mode-selector">
      <button id="btn-explora" class="mode-btn active-mode" onclick="setMode('explora')">Explora</button>
      <button id="btn-examen" class="mode-btn" onclick="setMode('examen')">Examen</button>
    </div>

    <div id="panel-explora">
      <div class="info-box">
        <span id="valDisplay" class="angle-value">45°</span>
        <div id="typeDisplay" style="font-weight:600; color:#64748b">Agut</div>
      </div>
      <p style="font-size:0.9rem; color:#94a3b8">Mou el ratolí o fes clic al canvas per canviar l'angle.</p>
    </div>

    <div id="panel-examen" style="display:none">
      <div class="info-box">
        <span style="display:block; margin-bottom:5px">Quin tipus d'angle és?</span>
        <div id="target-angle" class="angle-value">?</div>
      </div>
      <div class="options-grid">
        <button class="option-btn" onclick="checkAnswer('Nul')">Nul</button>
        <button class="option-btn" onclick="checkAnswer('Agut')">Agut</button>
        <button class="option-btn" onclick="checkAnswer('Recte')">Recte</button>
        <button class="option-btn" onclick="checkAnswer('Obtús')">Obtús</button>
        <button class="option-btn" onclick="checkAnswer('Plà')">Plà</button>
        <button class="option-btn" onclick="checkAnswer('Còncau')">Còncau</button>
        <button class="option-btn" onclick="checkAnswer('Complet')">Complet</button>
      </div>
      <div id="feedback" class="feedback"></div>
      <button id="next-btn" style="display:none; width:100%; margin-top:10px; padding:10px; background:var(--primary); color:white; border:none; border-radius:8px; cursor:pointer" onclick="newQuestion()">Següent</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    let currentAngle = 45;
    let mode = 'explora'; // 'explora' o 'examen'
    let targetType = '';

    function setup() {
      let container = document.getElementById('canvas-container');
      let cnv = createCanvas(container.offsetWidth, container.offsetHeight);
      cnv.parent('canvas-container');
      angleMode(DEGREES);
    }

    function draw() {
      background(248, 250, 252);
      
      if (mode === 'explora') {
        if (mouseIsPressed && mouseX > 0) {
          let dx = mouseX - width/2;
          let dy = mouseY - height/2;
          currentAngle = floor(atan2(dy, dx));
          if (currentAngle < 0) currentAngle += 360;
          currentAngle = (360 - currentAngle) % 360; 
        }
        updateUI();
      }

      translate(width/2, height/2);
      
      // Arc de mesura
      noFill();
      stroke(74, 144, 226, 80);
      strokeWeight(3);
      arc(0, 0, 100, 100, -currentAngle, 0);

      // Linies de l'angle
      strokeCap(ROUND);
      stroke(30, 41, 59);
      strokeWeight(6);
      line(0, 0, 180, 0); // Base

      push();
      rotate(-currentAngle);
      stroke(245, 158, 11); // Taronja per la línia mòbil
      line(0, 0, 180, 0);
      fill(245, 158, 11);
      noStroke();
      circle(180, 0, 12);
      pop();

      // Vèrtex
      fill(30, 41, 59);
      circle(0, 0, 15);
    }

    function updateUI() {
      document.getElementById('valDisplay').innerText = currentAngle + "°";
      document.getElementById('typeDisplay').innerText = getAngleType(currentAngle);
    }

    function getAngleType(v) {
      if (v === 0) return "Nul";
      if (v < 90) return "Agut";
      if (v === 90) return "Recte";
      if (v < 180) return "Obtús";
      if (v === 180) return "Plà";
      if (v < 360) return "Còncau";
      return "Complet";
    }

    function setMode(m) {
      mode = m;
      document.getElementById('btn-explora').classList.toggle('active-mode', m === 'explora');
      document.getElementById('btn-examen').classList.toggle('active-mode', m === 'examen');
      document.getElementById('panel-explora').style.display = m === 'explora' ? 'block' : 'none';
      document.getElementById('panel-examen').style.display = m === 'examen' ? 'block' : 'none';
      if (m === 'examen') newQuestion();
    }

    function newQuestion() {
      currentAngle = floor(random(0, 361));
      targetType = getAngleType(currentAngle);
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('target-angle').innerText = currentAngle + "°";
    }

    function checkAnswer(answer) {
      let f = document.getElementById('feedback');
      f.style.display = 'block';
      if (answer === targetType) {
        f.innerText = "Correcte! 🎉";
        f.style.background = "#dcfce7";
        f.style.color = "#166534";
        document.getElementById('next-btn').style.display = 'block';
      } else {
        f.innerText = "Torna-ho a provar...";
        f.style.background = "#fee2e2";
        f.style.color = "#991b1b";
      }
    }

    function windowResized() {
      let container = document.getElementById('canvas-container');
      resizeCanvas(container.offsetWidth, container.offsetHeight);
    }
  </script>
</body>
</html>
