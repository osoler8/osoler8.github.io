<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipus d'angles</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <style>
    :root {
      --primary: #4a90e2;
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      margin: 0; padding: 0;
      display: flex;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg);
      height: 100vh;
      overflow: hidden;
    }

    #ui-panel {
      width: 280px;
      background: var(--panel);
      box-shadow: 4px 0 15px rgba(0,0,0,0.05);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .panel-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    /* Hem eliminat el h2.side-title */

    .author {
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    #main-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .top-header {
      padding: 15px;
      text-align: center;
    }

    h1.main-title {
      font-size: 2.2rem;
      margin: 0;
      color: var(--text);
      font-weight: 800;
    }

    #canvas-container {
      flex-grow: 1;
      width: 100%;
    }

    .mode-selector {
      display: flex;
      gap: 4px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 5px; /* Espai extra sota el selector */
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.3s;
      color: #64748b;
    }

    .active-mode { background: var(--primary); color: white; }

    .info-box {
      background: #f1f5f9;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
    }

    .angle-question {
      font-size: 0.9rem;
      color: #1e293b;
      display: block;
      margin-bottom: 4px;
    }

    .angle-value { 
      font-size: 2.8rem; 
      font-weight: 800; 
      color: var(--primary); 
      line-height: 1;
    }
    
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .option-btn {
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      color: var(--text);
    }

    .option-btn:hover { border-color: var(--primary); background: #f0f7ff; }

    .feedback {
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
      padding: 8px;
      font-size: 0.9rem;
      border-radius: 8px;
    }

    .btn-next {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div id="ui-panel">
    <div class="panel-content">
      <div class="mode-selector">
        <button id="btn-explora" class="mode-btn active-mode" onclick="setMode('explora')">Explora</button>
        <button id="btn-examen" class="mode-btn" onclick="setMode('examen')">Test</button>
      </div>

      <div id="panel-explora">
        <div class="info-box">
          <span class="angle-question">Angle actual</span>
          <span id="valDisplay" class="angle-value">45°</span>
          <div id="typeDisplay" style="font-weight:600; color:#64748b; margin-top:8px; font-size: 1rem;">Agut</div>
        </div>
      </div>

      <div id="panel-examen" style="display:none">
        <div class="info-box">
          <span class="angle-question">Quin tipus d'angle és?</span>
          <div id="target-angle" class="angle-value">?</div>
        </div>

        <div class="options-grid">
          <button class="option-btn" onclick="checkAnswer('Nul')">Nul</button>
          <button class="option-btn" onclick="checkAnswer('Agut')">Agut</button>
          <button class="option-btn" onclick="checkAnswer('Recte')">Recte</button>
          <button class="option-btn" onclick="checkAnswer('Obtús')">Obtús</button>
          <button class="option-btn" onclick="checkAnswer('Pla')">Pla</button>
          <button class="option-btn" onclick="checkAnswer('Còncau')">Còncau</button>
          <button class="option-btn" onclick="checkAnswer('Complet')">Complet</button>
        </div>

        <div id="feedback" class="feedback" style="display:none"></div>
        <button id="next-btn" class="btn-next" style="display:none" onclick="newQuestion()">Següent angle</button>
      </div>
    </div>

    <div class="author">
      Creat per <strong>Oriol Soler</strong>
    </div>
  </div>

  <div id="main-area">
    <div class="top-header">
      <h1 class="main-title">Tipus d'angles</h1>
    </div>
    <div id="canvas-container"></div>
  </div>

  <script>
    let currentAngle = 45;
    let mode = 'explora';
    let targetType = '';

    function setup() {
      let container = document.getElementById('canvas-container');
      let cnv = createCanvas(container.offsetWidth, container.offsetHeight);
      cnv.parent('canvas-container');
      angleMode(DEGREES);
    }

    function draw() {
      background(248, 250, 252);
      
      if (mode === 'explora') {
        if (mouseIsPressed && mouseX > 0) {
          let dx = mouseX - width/2;
          let dy = mouseY - height/2; 
          currentAngle = floor(atan2(dy, dx));
          if (currentAngle < 0) currentAngle += 360;
          currentAngle = (360 - currentAngle) % 360; 
        }
        updateUI();
      }

      translate(width/2, height/2);
      noFill();
      stroke(74, 144, 226, 40);
      strokeWeight(4);
      arc(0, 0, 140, 140, -currentAngle, 0);

      strokeCap(ROUND);
      stroke(30, 41, 59);
      strokeWeight(6);
      line(0, 0, 190, 0); 

      push();
      rotate(-currentAngle);
      stroke(245, 158, 11); 
      line(0, 0, 190, 0);
      fill(245, 158, 11);
      noStroke();
      circle(190, 0, 10);
      pop();

      fill(30, 41, 59);
      circle(0, 0, 16);
    }

    function updateUI() {
      document.getElementById('valDisplay').innerText = currentAngle + "°";
      document.getElementById('typeDisplay').innerText = getAngleType(currentAngle);
    }

    function getAngleType(v) {
      if (v === 0) return "Nul";
      if (v < 90) return "Agut";
      if (v === 90) return "Recte";
      if (v < 180) return "Obtús";
      if (v === 180) return "Pla";
      if (v < 360) return "Còncau";
      return "Complet";
    }

    function setMode(m) {
      mode = m;
      document.getElementById('btn-explora').classList.toggle('active-mode', m === 'explora');
      document.getElementById('btn-examen').classList.toggle('active-mode', m === 'examen');
      document.getElementById('panel-explora').style.display = m === 'explora' ? 'block' : 'none';
      document.getElementById('panel-examen').style.display = m === 'examen' ? 'block' : 'none';
      if (m === 'examen') newQuestion();
    }

    function newQuestion() {
      currentAngle = floor(random(0, 361));
      targetType = getAngleType(currentAngle);
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('target-angle').innerText = currentAngle + "°";
    }

    function checkAnswer(answer) {
      let f = document.getElementById('feedback');
      f.style.display = 'block';
      if (answer === targetType) {
        f.innerText = "Molt bé! ✨";
        f.style.background = "#dcfce7";
        f.style.color = "#166534";
        document.getElementById('next-btn').style.display = 'block';
      } else {
        f.innerText = "Torna-ho a provar";
        f.style.background = "#fee2e2";
        f.style.color = "#991b1b";
      }
    }

    function windowResized() {
      let container = document.getElementById('canvas-container');
      resizeCanvas(container.offsetWidth, container.offsetHeight);
    }
  </script>
</body>
</html>
