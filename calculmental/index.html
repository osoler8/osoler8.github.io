<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Càlcul Mental - Arcade Edition</title>
    <!-- Llibreria de confeti i icones -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Font moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0B0F19;
            --surface: #151C2C;
            --surface-hover: #1E273C;
            --neon-cyan: #00F0FF;
            --neon-pink: #FF003C;
            --neon-yellow: #FFE800;
            --neon-green: #00FF66;
            --text: #E2E8F0;
            --text-dim: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; user-select: none; }

        body {
            background-color: var(--bg);
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at top, var(--surface) 0%, var(--bg) 100%);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        @media (min-width: 500px) {
            .container { height: 90vh; border-radius: 20px; border: 1px solid #2A354E; }
        }

        /* Gestió de Pantalles */
        .screen { display: none; flex-direction: column; height: 100%; flex-grow: 1; padding: 20px; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Títols Globals */
        h1 { text-align: center; font-size: 32px; font-weight: 900; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,240,255,0.4); margin-bottom: 5px; }
        .subtitle-main { text-align: center; color: var(--neon-pink); font-size: 14px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 25px; }

        /* Pantalla MAPA (Nivells) */
        .levels-grid { display: grid; gap: 15px; overflow-y: auto; padding-bottom: 20px; }
        .levels-grid::-webkit-scrollbar { width: 5px; }
        .levels-grid::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 5px; }
        
        .level-card {
            background: var(--surface);
            border: 2px solid #2A354E;
            border-radius: 15px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
        }
        .level-card:hover { transform: scale(1.02); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,240,255,0.2); }
        .level-card.locked { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
        .level-card.locked:hover { transform: none; border-color: #2A354E; box-shadow: none; }
        
        .level-info h3 { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
        .level-info p { font-size: 13px; color: var(--text-dim); }
        
        .level-stars { color: #475569; font-size: 14px; }
        .level-stars .active { color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255,232,0,0.6); }
        .level-icon { font-size: 24px; color: var(--neon-cyan); }
        .locked .level-icon { color: var(--text-dim); }

        /* Pantalla JOC */
        .top-hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 10px 15px; border-radius: 12px; border: 1px solid #2A354E; }
        .lives-box { color: var(--neon-pink); font-size: 18px; text-shadow: 0 0 8px rgba(255,0,60,0.6); }
        .lives-box i.empty { color: #334155; text-shadow: none; }
        .score-box { font-weight: 900; font-size: 20px; color: var(--neon-yellow); }
        
        .progress-container { width: 100%; background: #1E293B; height: 8px; border-radius: 4px; margin-bottom: 30px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--neon-cyan); width: 0%; transition: width 0.3s; box-shadow: 0 0 10px var(--neon-cyan); }

        .question-area { text-align: center; margin: auto 0; display: flex; flex-direction: column; align-items: center; }
        .streak-indicator { color: var(--neon-pink); font-weight: 900; font-size: 18px; height: 25px; margin-bottom: 10px; opacity: 0; transition: opacity 0.2s; }
        .streak-indicator.visible { opacity: 1; }
        .streak-indicator.bump { animation: pop 0.2s ease-out; }
        
        .question-text { font-size: 60px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .input-display { font-size: 55px; color: var(--neon-cyan); height: 70px; margin-top: 5px; border-bottom: 4px solid var(--neon-cyan); min-width: 120px; text-shadow: 0 0 15px rgba(0,240,255,0.6); }

        /* Teclat */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: auto; margin-bottom: 15px; }
        .key {
            background: var(--surface-hover);
            border: 1px solid #2A354E;
            border-radius: 12px;
            font-size: 28px;
            font-weight: 900;
            padding: 18px 0;
            color: var(--text);
            cursor: pointer;
            transition: all 0.1s;
        }
        .key:active { background: #2A354E; transform: scale(0.95); }
        .key-clear { color: var(--neon-pink); }
        .key-action { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px rgba(0,240,255,0.4); border: none; }
        .key-action:active { background: #00C0CC; }

        /* Pantalla RESULTAT */
        .result-content { text-align: center; margin: auto 0; }
        .result-title { font-size: 42px; margin-bottom: 10px; }
        .result-title.win { color: var(--neon-green); text-shadow: 0 0 15px rgba(0,255,102,0.5); }
        .result-title.lose { color: var(--neon-pink); text-shadow: 0 0 15px rgba(255,0,60,0.5); }
        
        .big-stars { font-size: 50px; color: #334155; margin: 20px 0; letter-spacing: 10px; }
        .big-stars .active { color: var(--neon-yellow); text-shadow: 0 0 20px rgba(255,232,0,0.8); animation: starPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards; }
        .big-stars i:nth-child(2) { animation-delay: 0.2s; font-size: 65px; transform: translateY(-10px); display: inline-block; }
        .big-stars i:nth-child(3) { animation-delay: 0.4s; }
        @keyframes starPop { 0% { transform: scale(0) rotate(-45deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
        
        .final-score-text { font-size: 20px; color: var(--text-dim); }
        .final-score-number { font-size: 48px; font-weight: 900; color: var(--neon-cyan); margin-bottom: 30px; }
        
        .btn-large {
            display: block; width: 100%; background: var(--surface-hover); border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan); font-size: 20px; font-weight: 900; padding: 18px; border-radius: 12px;
            cursor: pointer; text-transform: uppercase; margin-bottom: 15px; transition: all 0.2s;
        }
        .btn-large.primary { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px rgba(0,240,255,0.4); }
        .btn-large:active { transform: scale(0.98); }

        /* Footer */
        .footer { text-align: center; color: var(--text-dim); font-size: 13px; margin-top: auto; padding-top: 15px; border-top: 1px solid #2A354E; padding-bottom: 10px; }

        /* Animacions Action */
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-15px); } 40%, 80% { transform: translateX(15px); } }
    </style>
</head>
<body>

<div class="container" id="game-container">
    
    <!-- 1. PANTALLA MAPA NIVELLS -->
    <div id="screen-map" class="screen active">
        <h1>Arcade</h1>
        <div class="subtitle-main">Càlcul Mental</div>
        
        <div class="levels-grid" id="levels-container">
            <!-- Els nivells es generen per JS -->
        </div>
        
        <div class="footer">Creat per Oriol Soler</div>
    </div>

    <!-- 2. PANTALLA JOC -->
    <div id="screen-game" class="screen">
        <div class="top-hud">
            <div class="lives-box" id="lives-display">
                <i class="fa-solid fa-heart"></i> <i class="fa-solid fa-heart"></i> <i class="fa-solid fa-heart"></i>
            </div>
            <div style="font-weight: bold; color: var(--text-dim);" id="level-title-ingame">Nivell 1</div>
            <div class="score-box" id="score-text">0</div>
        </div>
        
        <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>

        <div class="question-area" id="question-area">
            <div class="streak-indicator" id="streak-text">COMBO x2!</div>
            <div class="question-text" id="question">5 x 7</div>
            <div class="input-display" id="input-display"></div>
        </div>

        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>
            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>
            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>
            <button class="key key-clear" onclick="pressKey('C')">C</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key key-action" onclick="checkAnswer()">OK</button>
        </div>
    </div>

    <!-- 3. PANTALLA RESULTAT -->
    <div id="screen-result" class="screen">
        <div class="result-content">
            <h2 class="result-title" id="result-title">NIVELL SUPERAT!</h2>
            
            <div class="big-stars" id="result-stars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
            </div>
            
            <div class="final-score-text" id="result-msg">Puntuació aconseguida</div>
            <div class="final-score-number" id="result-score">0</div>
        </div>
        
        <div style="margin-top: auto;">
            <button class="btn-large primary" id="btn-next" onclick="nextLevelAction()">Següent Nivell</button>
            <button class="btn-large" onclick="initMap()">Tornar al Menú</button>
        </div>
    </div>

</div>

<script>
    // --- DEFINICIÓ DELS NIVELLS ---
    const GAME_LEVELS = [
        { id: 1, title: "NIVELL 1", subtitle: "Sumes Inicia't", op: '+', max: 10 },
        { id: 2, title: "NIVELL 2", subtitle: "Restes Inicia't", op: '-', max: 15 },
        { id: 3, title: "NIVELL 3", subtitle: "Multiplica x2, x3", op: '*', maxM1: 3, maxM2: 10 },
        { id: 4, title: "NIVELL 4", subtitle: "Sumes Avançades", op: '+', max: 50 },
        { id: 5, title: "NIVELL 5", subtitle: "Mix Bàsic", op: 'MIX', max: 20, maxM1: 4, maxM2: 10 },
        { id: 6, title: "NIVELL 6", subtitle: "Taules x4, x5, x6", op: '*', maxM1: 6, maxM2: 10 },
        { id: 7, title: "NIVELL 7", subtitle: "Restes Perilloses", op: '-', max: 99 },
        { id: 8, title: "NIVELL 8", subtitle: "Sumes Centenàries", op: '+', max: 200 },
        { id: 9, title: "NIVELL 9", subtitle: "Totes les Taules", op: '*', maxM1: 10, maxM2: 10 },
        { id: 10, title: "BOSS FINAL", subtitle: "Mestre del Càlcul", op: 'MIX', max: 100, maxM1: 10, maxM2: 10 }
    ];

    // --- VARIABLES GLOBALS ---
    let progressData = JSON.parse(localStorage.getItem('calculMentalArcade')) || {};
    let currentLevel = null;
    let score = 0;
    let streak = 1;
    let lives = 3;
    let qCount = 0;
    const MAX_QUESTIONS = 10;
    let correctAnswer = 0;
    let currentInput = '';
    let questionStartTime = 0;

    // Elements DOM
    const inputDisplay = document.getElementById('input-display');
    const questionEl = document.getElementById('question');
    const streakText = document.getElementById('streak-text');
    const scoreText = document.getElementById('score-text');
    const progressBar = document.getElementById('progress-bar');
    const livesDisplay = document.getElementById('lives-display');

    // --- INICIALITZACIÓ ---
    initMap();

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // Genera la llista de botons de nivells
    function initMap() {
        showScreen('screen-map');
        const container = document.getElementById('levels-container');
        container.innerHTML = '';

        // Comprovem quin és l'últim nivell desbloquejat (sempre el 1 està obert)
        let highestUnlocked = 1;
        for (let i = 1; i <= GAME_LEVELS.length; i++) {
            if (progressData[i] && progressData[i] > 0) highestUnlocked = i + 1;
        }

        GAME_LEVELS.forEach(lvl => {
            const isUnlocked = lvl.id <= highestUnlocked;
            const stars = progressData[lvl.id] || 0;
            
            let starsHTML = '';
            for(let i=1; i<=3; i++) {
                starsHTML += `<i class="fa-solid fa-star ${i <= stars ? 'active' : ''}"></i>`;
            }

            const card = document.createElement('div');
            card.className = `level-card ${isUnlocked ? '' : 'locked'}`;
            if(isUnlocked) card.onclick = () => startLevel(lvl.id);

            card.innerHTML = `
                <div class="level-info">
                    <h3 style="color: ${isUnlocked ? 'var(--neon-cyan)' : 'var(--text-dim)'}">${lvl.title}</h3>
                    <p>${lvl.subtitle}</p>
                    <div class="level-stars">${isUnlocked ? starsHTML : ''}</div>
                </div>
                <div class="level-icon">
                    <i class="fa-solid ${isUnlocked ? 'fa-play' : 'fa-lock'}"></i>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- LÒGICA DE JOC ---
    function startLevel(id) {
        currentLevel = GAME_LEVELS.find(l => l.id === id);
        score = 0;
        streak = 1;
        lives = 3;
        qCount = 0;
        currentInput = '';
        
        document.getElementById('level-title-ingame').innerText = currentLevel.title;
        updateHUD();
        showScreen('screen-game');
        nextQuestion();
    }

    function updateHUD() {
        scoreText.innerText = score;
        progressBar.style.width = `${(qCount / MAX_QUESTIONS) * 100}%`;
        
        // Dibuixar cors
        let heartsHTML = '';
        for(let i=1; i<=3; i++) {
            heartsHTML += `<i class="fa-solid fa-heart ${i > lives ? 'empty' : ''}"></i> `;
        }
        livesDisplay.innerHTML = heartsHTML;

        // Combo text
        if (streak > 1) {
            streakText.innerText = `COMBO x${streak}!`;
            streakText.classList.add('visible');
            // Re-trigger animació
            streakText.classList.remove('bump');
            void streakText.offsetWidth;
            streakText.classList.add('bump');
        } else {
            streakText.classList.remove('visible');
        }
    }

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function nextQuestion() {
        if (qCount >= MAX_QUESTIONS) { finishLevel(true); return; }
        if (lives <= 0) { finishLevel(false); return; }

        qCount++;
        currentInput = '';
        inputDisplay.innerText = '';
        inputDisplay.style.borderColor = 'var(--neon-cyan)';
        updateHUD();

        let op = currentLevel.op;
        if (op === 'MIX') {
            const ops = ['+', '-', '*'];
            op = ops[Math.floor(Math.random() * ops.length)];
        }

        let num1, num2;
        if (op === '+') {
            const m = currentLevel.max || 20;
            num1 = rand(2, m); num2 = rand(2, m);
            correctAnswer = num1 + num2;
        } else if (op === '-') {
            const m = currentLevel.max || 20;
            num1 = rand(5, m); num2 = rand(2, num1 - 1);
            correctAnswer = num1 - num2;
        } else if (op === '*') {
            const m1 = currentLevel.maxM1 || 5;
            const m2 = currentLevel.maxM2 || 10;
            // Fem que a vegades el gran estigui a la dreta o a l'esquerra per evitar sempre "2 x 9"
            if(Math.random() > 0.5) { num1 = rand(2, m1); num2 = rand(2, m2); }
            else { num1 = rand(2, m2); num2 = rand(2, m1); }
            correctAnswer = num1 * num2;
        }

        let displayOp = op === '*' ? 'x' : op;
        questionEl.innerText = `${num1} ${displayOp} ${num2}`;
        questionStartTime = Date.now();
    }

    function pressKey(key) {
        if (key === 'C') { currentInput = ''; } 
        else { if (currentInput.length < 4) currentInput += key; }
        inputDisplay.innerText = currentInput;
    }

    function checkAnswer() {
        if (currentInput === '') return;
        const userAnswer = parseInt(currentInput);
        
        if (userAnswer === correctAnswer) {
            // ENCERT!
            const timeTaken = (Date.now() - questionStartTime) / 1000;
            let pts = 100;
            if (timeTaken < 5) pts += Math.floor((5 - timeTaken) * 20); // Bonus velocitat
            
            score += Math.floor(pts * streak);
            streak++;
            
            inputDisplay.style.borderColor = 'var(--neon-green)';
            inputDisplay.style.color = 'var(--neon-green)';
            setTimeout(() => {
                inputDisplay.style.color = 'var(--neon-cyan)';
                nextQuestion();
            }, 300);

        } else {
            // ERROR!
            streak = 1;
            lives--;
            updateHUD();
            
            document.getElementById('game-container').classList.add('shake');
            inputDisplay.style.borderColor = 'var(--neon-pink)';
            inputDisplay.style.color = 'var(--neon-pink)';
            
            setTimeout(() => {
                document.getElementById('game-container').classList.remove('shake');
                currentInput = '';
                inputDisplay.innerText = '';
                inputDisplay.style.color = 'var(--neon-cyan)';
                inputDisplay.style.borderColor = 'var(--neon-cyan)';
                if (lives <= 0) nextQuestion(); // Força el Game Over
            }, 400);
        }
    }

    // --- FI DEL NIVELL ---
    function finishLevel(isWin) {
        showScreen('screen-result');
        const titleEl = document.getElementById('result-title');
        const scoreEl = document.getElementById('result-score');
        const starsContainer = document.getElementById('result-stars');
        const msgEl = document.getElementById('result-msg');
        const btnNext = document.getElementById('btn-next');

        if (isWin) {
            // Càlcul d'estrelles: Base per sobreviure = 1 estrella.
            // 2 estrelles si fas > 3000 pts. 3 estrelles si fas > 6000 pts.
            let earnedStars = 1;
            if (score > 3000) earnedStars = 2;
            if (score > 6000) earnedStars = 3;

            // Guardem rècord si és millor
            if (!progressData[currentLevel.id] || earnedStars > progressData[currentLevel.id]) {
                progressData[currentLevel.id] = earnedStars;
                localStorage.setItem('calculMentalArcade', JSON.stringify(progressData));
            }

            titleEl.innerText = "NIVELL SUPERAT!";
            titleEl.className = "result-title win";
            scoreEl.innerText = score;
            msgEl.innerText = "Puntuació aconseguida";
            btnNext.style.display = "block";
            btnNext.innerText = currentLevel.id === GAME_LEVELS.length ? "Has guanyat el joc!" : "Següent Nivell";

            // Pintar estrelles
            starsContainer.innerHTML = `
                <i class="fa-solid fa-star ${earnedStars >= 1 ? 'active' : ''}"></i>
                <i class="fa-solid fa-star ${earnedStars >= 2 ? 'active' : ''}"></i>
                <i class="fa-solid fa-star ${earnedStars >= 3 ? 'active' : ''}"></i>
            `;
            triggerConfetti();

        } else {
            titleEl.innerText = "GAME OVER";
            titleEl.className = "result-title lose";
            scoreEl.innerText = score;
            msgEl.innerText = "Has perdut totes les vides...";
            starsContainer.innerHTML = `
                <i class="fa-solid fa-skull" style="color:var(--neon-pink);"></i>
            `;
            btnNext.style.display = "block";
            btnNext.innerText = "Tornar a intentar";
        }
    }

    function nextLevelAction() {
        if (lives <= 0) {
            startLevel(currentLevel.id); // Reintentar
        } else {
            if (currentLevel.id < GAME_LEVELS.length) {
                startLevel(currentLevel.id + 1); // Següent
            } else {
                initMap(); // Ha acabat el joc
            }
        }
    }

    function triggerConfetti() {
        var duration = 2.5 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0, colors: ['#00F0FF', '#FF003C', '#FFE800'] };

        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random(), y: Math.random() - 0.2 } }));
        }, 250);
    }

    // Suport per teclat
    document.addEventListener('keydown', (event) => {
        if (document.getElementById('screen-game').classList.contains('active')) {
            if (event.key >= '0' && event.key <= '9') pressKey(event.key);
            else if (event.key === 'Backspace' || event.key === 'Delete' || event.key.toLowerCase() === 'c') pressKey('C');
            else if (event.key === 'Enter') checkAnswer();
        }
    });

</script>
</body>
</html>
