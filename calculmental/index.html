<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Càlcul mental - gamificat</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F3F4F6;
            --surface: #FFFFFF;
            --text: #1F2937;
            --success: #10B981;
            --error: #EF4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation; /* Evita zoom al fer doble tap als botons */
        }

        .container {
            background-color: var(--surface);
            width: 100%;
            max-width: 400px;
            min-height: 600px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Pantalles */
        .screen { display: none; flex-direction: column; height: 100%; flex-grow: 1; }
        .screen.active { display: flex; }

        h1, h2 { text-align: center; margin-bottom: 20px; color: var(--primary); }

        /* Pantalla d'Inici */
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .btn-mode {
            background: var(--surface);
            border: 2px solid var(--primary);
            color: var(--primary);
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-mode:hover { background: var(--primary); color: white; transform: translateY(-3px); }

        /* Header Joc */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .streak-box {
            font-size: 18px;
            color: #FCD34D;
            transition: transform 0.2s;
        }
        .streak-bump { transform: scale(1.3); }

        /* Zona de Pregunta */
        .question-area {
            text-align: center;
            margin: auto 0;
            transition: all 0.2s;
        }
        .question-text { font-size: 48px; font-weight: bold; letter-spacing: 2px; }
        .input-display {
            font-size: 48px;
            color: var(--primary);
            min-height: 60px;
            margin-top: 10px;
            border-bottom: 3px dashed #CBD5E1;
            display: inline-block;
            min-width: 100px;
        }

        /* Teclat */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: auto;
        }
        .key {
            background: #E2E8F0;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            padding: 15px 0;
            cursor: pointer;
            color: var(--text);
            transition: background 0.1s;
        }
        .key:active { background: #CBD5E1; }
        .key-action { background: var(--primary); color: white; }
        .key-clear { background: var(--error); color: white; }

        /* Animacions i Feedback */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .error-shake { animation: shake 0.4s ease-in-out; background-color: #FEE2E2 !important; }
        
        @keyframes success-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); color: var(--success); }
            100% { transform: scale(1); }
        }
        .success-pop { animation: success-pop 0.3s ease-out; }

        /* Pantalla Final */
        .score-display { text-align: center; font-size: 64px; color: var(--primary); font-weight: bold; margin: 20px 0; }
        .highscore-display { text-align: center; font-size: 18px; color: #6B7280; margin-bottom: 30px; }
        .btn-restart {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container" id="game-container">
    
    <div id="screen-start" class="screen active">
        <h1>Càlcul Mental</h1>
        <p style="text-align: center; color: #6B7280;">Completa 10 operacions ràpidament i sense fallar per guanyar més punts!</p>
        <div class="mode-grid">
            <button class="btn-mode" onclick="startGame('+')">+</button>
            <button class="btn-mode" onclick="startGame('-')">-</button>
            <button class="btn-mode" onclick="startGame('*')">×</button>
            <button class="btn-mode" onclick="startGame('MIX')">MIX</button>
        </div>
        <div style="margin-top: auto; text-align: center; color: #9CA3AF; font-size: 14px;">
            Rècord actual: <span id="home-highscore">0</span> pts
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div class="game-header">
            <div>Pregunta: <span id="progress-text">1/10</span></div>
            <div>Punts: <span id="score-text">0</span></div>
            <div class="streak-box" id="streak-text">🔥 x1</div>
        </div>

        <div class="question-area" id="question-area">
            <div class="question-text" id="question">5 + 7</div>
            <div class="input-display" id="input-display"></div>
        </div>

        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>
            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>
            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>
            <button class="key key-clear" onclick="pressKey('C')">C</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key key-action" onclick="checkAnswer()">OK</button>
        </div>
    </div>

    <div id="screen-end" class="screen">
        <h2>🎉 Completat!</h2>
        <div class="score-display" id="final-score">0</div>
        <div class="highscore-display" id="highscore-msg">Rècord anterior: 0</div>
        <div style="margin: auto 0;"></div> <button class="btn-restart" onclick="showScreen('screen-start')">Tornar a jugar</button>
    </div>

</div>

<script>
    // Variables d'estat
    let currentMode = '';
    let correctAnswer = 0;
    let currentInput = '';
    let questionCount = 0;
    let maxQuestions = 10;
    
    // Sistema de puntuació
    let score = 0;
    let streak = 1;
    let questionStartTime = 0;

    // Elements DOM
    const inputDisplay = document.getElementById('input-display');
    const questionEl = document.getElementById('question');
    const scoreText = document.getElementById('score-text');
    const streakText = document.getElementById('streak-text');
    const progressText = document.getElementById('progress-text');
    const questionArea = document.getElementById('question-area');
    const container = document.getElementById('game-container');

    // Carregar Highscore
    let highScore = localStorage.getItem('calculMentalHighScore') || 0;
    document.getElementById('home-highscore').innerText = highScore;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        if(id === 'screen-start') {
            document.getElementById('home-highscore').innerText = localStorage.getItem('calculMentalHighScore') || 0;
        }
    }

    function startGame(mode) {
        currentMode = mode;
        score = 0;
        streak = 1;
        questionCount = 0;
        updateStatsUI();
        showScreen('screen-game');
        nextQuestion();
    }

    function updateStatsUI() {
        scoreText.innerText = score;
        progressText.innerText = `${questionCount}/${maxQuestions}`;
        streakText.innerText = `🔥 x${streak}`;
        
        // Animació visual del combo
        streakText.classList.remove('streak-bump');
        void streakText.offsetWidth; // Trigger reflow
        if (streak > 1) streakText.classList.add('streak-bump');
    }

    function generateNumber(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function nextQuestion() {
        if (questionCount >= maxQuestions) {
            endGame();
            return;
        }

        questionCount++;
        currentInput = '';
        inputDisplay.innerText = '';
        updateStatsUI();

        let op = currentMode;
        if (op === 'MIX') {
            const ops = ['+', '-', '*'];
            op = ops[Math.floor(Math.random() * ops.length)];
        }

        let num1, num2;

        if (op === '+') {
            num1 = generateNumber(2, 50);
            num2 = generateNumber(2, 50);
            correctAnswer = num1 + num2;
        } else if (op === '-') {
            num1 = generateNumber(10, 50);
            num2 = generateNumber(2, num1 - 1); // Evita resultats negatius
            correctAnswer = num1 - num2;
        } else if (op === '*') {
            num1 = generateNumber(2, 10);
            num2 = generateNumber(2, 10);
            correctAnswer = num1 * num2;
        }

        questionEl.innerText = `${num1} ${op} ${num2}`;
        questionStartTime = Date.now();
    }

    function pressKey(key) {
        if (key === 'C') {
            currentInput = '';
        } else {
            // Evitar números massa llargs
            if (currentInput.length < 4) {
                currentInput += key;
            }
        }
        inputDisplay.innerText = currentInput;
    }

    function checkAnswer() {
        if (currentInput === '') return;

        const userAnswer = parseInt(currentInput);
        
        if (userAnswer === correctAnswer) {
            // ENCERT!
            const timeTaken = (Date.now() - questionStartTime) / 1000;
            
            // Càlcul de punts: Base 100 + bonus si tardes menys de 5 segons
            let points = 100;
            if (timeTaken < 5) {
                points += Math.floor((5 - timeTaken) * 20); 
            }
            
            // Aplicar multiplicador de combo
            score += Math.floor(points * streak);
            streak++; // Pugem el combo
            
            // Animació de "Juice" correcte
            questionArea.classList.add('success-pop');
            setTimeout(() => {
                questionArea.classList.remove('success-pop');
                nextQuestion();
            }, 300);

        } else {
            // ERROR!
            streak = 1; // Resetejem el combo
            updateStatsUI();
            
            // Animació de "Juice" error (Shake & Red)
            container.classList.add('error-shake');
            currentInput = ''; // Buidem per tornar a intentar-ho
            inputDisplay.innerText = '';
            
            setTimeout(() => {
                container.classList.remove('error-shake');
            }, 400);
        }
    }

    function endGame() {
        showScreen('screen-end');
        document.getElementById('final-score').innerText = score;
        
        // Comprovar Highscore amb LocalStorage
        let currentHighScore = parseInt(localStorage.getItem('calculMentalHighScore')) || 0;
        const hsMsg = document.getElementById('highscore-msg');
        
        if (score > currentHighScore) {
            localStorage.setItem('calculMentalHighScore', score);
            hsMsg.innerText = "🏆 Nou Rècord!";
            hsMsg.style.color = "var(--success)";
            hsMsg.style.fontWeight = "bold";
        } else {
            hsMsg.innerText = `Rècord anterior: ${currentHighScore}`;
            hsMsg.style.color = "#6B7280";
            hsMsg.style.fontWeight = "normal";
        }

        // Llançar confeti!
        triggerConfetti();
    }

    function triggerConfetti() {
        var duration = 3 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();

            if (timeLeft <= 0) {
                return clearInterval(interval);
            }

            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }

    // Suport per teclat físic
    document.addEventListener('keydown', (event) => {
        if (document.getElementById('screen-game').classList.contains('active')) {
            if (event.key >= '0' && event.key <= '9') {
                pressKey(event.key);
            } else if (event.key === 'Backspace' || event.key === 'Delete' || event.key.toLowerCase() === 'c') {
                pressKey('C');
            } else if (event.key === 'Enter') {
                checkAnswer();
            }
        }
    });

</script>
</body>
</html>
