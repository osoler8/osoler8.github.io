     <!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Càlcul mental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f8fafc; touch-action: manipulation; }
        .glass { background: white; border: 1px solid #e2e8f0; }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        .correct-pop { animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.05); border-color: #22c55e; } 100% { transform: scale(1); } }
        .numpad-btn { background: white; border-radius: 12px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: bold; box-shadow: 0 2px 0px #e2e8f0; border: 1px solid #e2e8f0; transition: all 0.05s; }
        .numpad-btn:active { transform: translateY(2px); box-shadow: none; background: #f1f5f9; }
        .progress-bar { transition: width 0.3s linear; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center overflow-x-hidden">

    <header class="w-full max-w-md p-4 text-center">
        <h1 class="text-2xl font-bold text-slate-800">Càlcul mental</h1>
    </header>

    <nav id="controls" class="w-full max-w-md px-4 pb-2 flex flex-col gap-2">
        <div class="flex gap-2">
            <select id="game-mode" onchange="updateSubModes(); resetGame();" class="flex-1 bg-white px-3 py-2 rounded-xl text-[11px] font-black shadow-sm outline-none border border-slate-200 uppercase text-slate-600">
                <option value="goal">Mode Repte (Ops)</option>
                <option value="timed">Mode Cronometrat / Lliure</option>
            </select>
            <select id="op-type" onchange="resetGame()" class="w-20 bg-white px-3 py-2 rounded-xl text-[11px] font-black shadow-sm outline-none border border-slate-200 text-center text-slate-600">
                <option value="sum">+</option>
                <option value="sub">-</option>
                <option value="mul">×</option>
                <option value="mix">MIX</option>
            </select>
        </div>
        <select id="sub-mode" onchange="resetGame()" class="w-full bg-white px-3 py-2 rounded-xl text-[11px] font-black shadow-sm outline-none border border-slate-200 uppercase text-slate-600"></select>
    </nav>

    <div class="w-full max-w-md px-6 mb-4">
        <div class="flex justify-between text-[9px] uppercase font-black text-slate-400 mb-1">
            <span id="label-left">Progrés</span>
            <span id="label-right">0/10</span>
        </div>
        <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
            <div id="progress-fill" class="progress-bar h-full bg-blue-500 w-0"></div>
        </div>
    </div>

    <main id="game-container" class="w-[92%] max-w-md glass rounded-3xl p-5 shadow-lg shadow-slate-200/50 mb-4 flex flex-col items-center border-2 border-transparent transition-all min-h-[220px] justify-center text-center">
        <div id="game-ui">
            <div id="operation-container" class="text-5xl font-bold text-slate-800 mb-4 flex items-center justify-center gap-3 tracking-tighter">
                <span id="num1">0</span>
                <span id="operator" class="text-blue-500 text-3xl"> + </span>
                <span id="num2">0</span>
            </div>
            <input type="number" id="answer" readonly class="w-full text-center text-4xl font-bold bg-slate-50 rounded-xl py-3 border-none focus:outline-none" placeholder="?">
            <div id="feedback" class="mt-2 h-4 text-[10px] font-black uppercase tracking-[0.2em]"></div>
        </div>

        <div id="win-ui" class="hidden">
            <h2 id="win-title" class="text-3xl font-bold text-green-500 mb-2">🎉 Completat!</h2>
            <p id="win-stats" class="text-slate-500 mb-6 font-medium uppercase text-xs tracking-widest"></p>
            <button onclick="resetGame()" class="bg-slate-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-slate-700 uppercase tracking-tighter">Torna a jugar</button>
        </div>
    </main>

    <div id="numpad" class="w-full max-w-md grid grid-cols-3 gap-2 px-6 mb-4">
        <button class="numpad-btn" onclick="addNum(1)">1</button>
        <button class="numpad-btn" onclick="addNum(2)">2</button>
        <button class="numpad-btn" onclick="addNum(3)">3</button>
        <button class="numpad-btn" onclick="addNum(4)">4</button>
        <button class="numpad-btn" onclick="addNum(5)">5</button>
        <button class="numpad-btn" onclick="addNum(6)">6</button>
        <button class="numpad-btn" onclick="addNum(7)">7</button>
        <button class="numpad-btn" onclick="addNum(8)">8</button>
        <button class="numpad-btn" onclick="addNum(9)">9</button>
        <button class="numpad-btn text-red-500 bg-red-50" onclick="clearNum()">C</button>
        <button class="numpad-btn" onclick="addNum(0)">0</button>
        <button class="numpad-btn bg-slate-800 text-white" onclick="checkAnswer()">OK</button>
    </div>

    <footer class="mt-auto pb-4">
        <p class="text-slate-400 text-[10px] font-bold tracking-wide uppercase">Creat per Oriol Soler</p>
    </footer>

    <script>
        let currentResult, solved, goal, timer, timeLeft, isGameActive = false;
        const subModeSelect = document.getElementById('sub-mode');
        const gameModeSelect = document.getElementById('game-mode');

        function updateSubModes() {
            subModeSelect.innerHTML = '';
            if (gameModeSelect.value === 'goal') {
                const opt = (v, t) => { let o = document.createElement('option'); o.value=v; o.innerText=t; return o; };
                subModeSelect.appendChild(opt("10", "Fàcil (10 operacions)"));
                subModeSelect.appendChild(opt("25", "Mitjà (25 operacions)"));
                subModeSelect.appendChild(opt("50", "Difícil (50 operacions)"));
            } else {
                const opt = (v, t) => { let o = document.createElement('option'); o.value=v; o.innerText=t; return o; };
                subModeSelect.appendChild(opt("60", "1 Minut"));
                subModeSelect.appendChild(opt("120", "2 Minuts"));
                subModeSelect.appendChild(opt("300", "5 Minuts"));
                subModeSelect.appendChild(opt("free", "Mode Lliure (Sense temps)"));
            }
        }

        function generateOperation() {
            const type = document.getElementById('op-type').value;
            let n1 = Math.floor(Math.random() * 20) + 1;
            let n2 = Math.floor(Math.random() * 20) + 1;
            let ops = ['+', '-', '*'];
            let currentOp = type === 'mix' ? ops[Math.floor(Math.random() * ops.length)] : (type === 'sum' ? '+' : (type === 'sub' ? '-' : '*'));
            if (currentOp === '-' && n1 < n2) [n1, n2] = [n2, n1];
            if (currentOp === '*') { n1 = Math.floor(Math.random() * 12) + 1; n2 = Math.floor(Math.random() * 10) + 1; }
            document.getElementById('num1').innerText = n1;
            document.getElementById('num2').innerText = n2;
            document.getElementById('operator').innerText = currentOp === '*' ? '×' : (currentOp === '-' ? '−' : '+');
            currentResult = eval(`${n1} ${currentOp} ${n2}`);
            document.getElementById('answer').value = '';
            document.getElementById('feedback').innerText = "";
        }

        function checkAnswer() {
            if (!isGameActive) return;
            const userAns = parseInt(document.getElementById('answer').value);
            if (isNaN(userAns)) return;

            if (userAns === currentResult) {
                solved++;
                updateProgress();
                if (gameModeSelect.value === 'goal' && solved >= goal) {
                    endGame();
                } else {
                    document.getElementById('feedback').innerText = "Molt bé!";
                    document.getElementById('feedback').className = "mt-2 h-4 text-[10px] font-black text-green-500";
                    document.getElementById('game-container').classList.add('correct-pop');
                    setTimeout(() => {
                        document.getElementById('game-container').classList.remove('correct-pop');
                        generateOperation();
                    }, 300);
                }
            } else {
                document.getElementById('feedback').innerText = "Incorrecte!";
                document.getElementById('feedback').className = "mt-2 h-4 text-[10px] font-black text-red-500";
                document.getElementById('game-container').classList.add('shake');
                setTimeout(() => { document.getElementById('game-container').classList.remove('shake'); clearNum(); }, 400);
            }
        }

        function updateProgress() {
            const fill = document.getElementById('progress-fill');
            const labelR = document.getElementById('label-right');
            const labelL = document.getElementById('label-left');

            if (gameModeSelect.value === 'goal') {
                labelL.innerText = "Progrés";
                fill.style.width = `${(solved / goal) * 100}%`;
                labelR.innerText = `${solved}/${goal}`;
            } else if (subModeSelect.value === 'free') {
                labelL.innerText = "Operacions";
                fill.style.width = `100%`;
                labelR.innerText = `${solved}`;
            } else {
                labelL.innerText = "Temps";
                fill.style.width = `${(timeLeft / goal) * 100}%`;
                labelR.innerText = `${timeLeft}s`;
            }
        }

        function endGame() {
            isGameActive = false;
            clearInterval(timer);
            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('win-ui').classList.remove('hidden');
            document.getElementById('win-stats').innerText = `Has resolt ${solved} operacions`;
        }

        function resetGame() {
            clearInterval(timer);
            if (!event || event.target.id !== 'sub-mode') updateSubModes();
            isGameActive = true;
            solved = 0;
            const modeVal = subModeSelect.value;
            
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('win-ui').classList.add('hidden');
            
            if (modeVal === 'free') {
                goal = Infinity;
            } else {
                goal = parseInt(modeVal);
                timeLeft = goal;
                if (gameModeSelect.value === 'timed') {
                    timer = setInterval(() => {
                        timeLeft--;
                        updateProgress();
                        if (timeLeft <= 0) endGame();
                    }, 1000);
                }
            }
            updateProgress();
            generateOperation();
        }

        function addNum(n) { if(isGameActive) document.getElementById('answer').value += n; }
        function clearNum() { document.getElementById('answer').value = ''; }

        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') addNum(e.key);
            if (e.key === 'Backspace') clearNum();
            if (e.key === 'Enter') checkAnswer();
        });

        updateSubModes();
        resetGame();
    </script>
</body>
</html>
