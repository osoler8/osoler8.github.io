<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualitzador de fraccions</title>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2980b9;
            --bg: #f4f7f6;
            --text: #2c3e50;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 800px;
            padding: clamp(1.5rem, 5vw, 2.5rem);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            flex-grow: 1;
        }

        h1 {
            margin-top: 0;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            color: var(--primary);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: #f9fbfd;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #edf2f7;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        label {
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        input, select {
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        button {
            grid-column: 1 / -1;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: var(--secondary); }

        .info {
            background: #ebf8ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-weight: 500;
            color: #2c5282;
            border-left: 4px solid var(--primary);
        }

        .canvas-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🎨 Visualitzador de fraccions</h1>
    
    <div class="controls">
        <div class="input-group">
            <label>Numerador</label>
            <input type="number" id="num" value="2" min="1">
        </div>
        <div class="input-group">
            <label>Denominador</label>
            <input type="number" id="den" value="4" min="1">
        </div>
        <div class="input-group">
            <label>Forma</label>
            <select id="tipus">
                <option value="cercle">Cercles (Pizza)</option>
                <option value="barra">Barres (Rajola)</option>
            </select>
        </div>
        <div class="input-group">
            <label>Color</label>
            <input type="color" id="color" value="#3498db">
        </div>
        <button onclick="generar()">Actualitzar representació</button>
    </div>

    <div id="textInfo" class="info"></div>
    <div id="canvasContainer" class="canvas-container"></div>
</div>

<footer>
    Creat per <strong>Oriol Soler</strong>
</footer>

<script>
    function mcd(a, b) { return b === 0 ? a : mcd(b, a % b); }

    function generar() {
        const container = document.getElementById('canvasContainer');
        const num = Math.abs(parseInt(document.getElementById('num').value)) || 0;
        const den = Math.abs(parseInt(document.getElementById('den').value)) || 1;
        const tipus = document.getElementById('tipus').value;
        const color = document.getElementById('color').value;
        
        container.innerHTML = "";

        // Informació matemàtica
        const divisorComu = mcd(num, den);
        let info = `Fracció actual: ${num}/${den}. `;
        if (divisorComu > 1) info += `Equival a ${num/divisorComu}/${den/divisorComu}. `;
        if (num > den) info += `Representa ${Math.floor(num/den)} unitat(s) i ${num % den}/${den}.`;
        document.getElementById('textInfo').innerText = info;

        // Dibuix per unitats
        const unitats = Math.ceil(num / den);
        let trossosRestants = num;

        for (let i = 0; i < unitats; i++) {
            const canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 200;
            container.appendChild(canvas);
            
            const trossosUnitat = Math.min(trossosRestants, den);
            dibuixar(canvas.getContext('2d'), trossosUnitat, den, tipus, color);
            trossosRestants -= trossosUnitat;
        }
    }

    function dibuixar(ctx, n, d, tipus, col) {
        const size = 200;
        const center = size / 2;

        if (tipus === 'cercle') {
            const r = 80;
            for (let i = 0; i < d; i++) {
                const s = (i * 2 * Math.PI) / d - Math.PI/2;
                const e = ((i + 1) * 2 * Math.PI) / d - Math.PI/2;
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, r, s, e);
                ctx.closePath();
                ctx.fillStyle = i < n ? col : '#f1f5f9';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        } else {
            const h = 60, w = 160;
            const x = (size-w)/2, y = (size-h)/2;
            const step = w / d;
            for (let i = 0; i < d; i++) {
                ctx.beginPath();
                ctx.rect(x + (i * step), y, step, h);
                ctx.fillStyle = i < n ? col : '#f1f5f9';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
    }

    window.onload = generar;
</script>
</body>
</html>
