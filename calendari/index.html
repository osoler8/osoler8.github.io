<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El meu calendari personalitzat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fffcf7;
            --day-bg: #e2e2f9;
            --empty-bg: #ffd6e0;
            --yellow-accent: #fecd1a;
            --blue-grid: #e4f0f6;
            --text-color: #333333;
            --btn-green: #4caf50;
            --btn-blue: #008cba;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        /* Controls superiors i botons */
        .interficie-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .selectors {
            display: flex;
            gap: 15px;
        }

        .selectors select {
            padding: 10px 20px;
            font-size: 1.1rem;
            border: 3px solid var(--text-color);
            border-radius: 20px;
            background-color: white;
            cursor: pointer;
            font-weight: 600;
            outline: none;
        }

        .botons-accions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            border: 3px solid var(--text-color);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--text-color);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--text-color);
        }

        .btn-guardar { background-color: var(--btn-green); }
        .btn-pdf { background-color: var(--btn-blue); }

        .missatge-alerta {
            font-weight: 600;
            color: var(--btn-green);
            height: 20px;
            margin-top: -5px;
            transition: opacity 0.3s;
            opacity: 0;
        }

        /* Layout Principal */
        .calendari-wrapper {
            display: grid;
            grid-template-columns: 3fr 1.2fr;
            gap: 30px;
            max-width: 1300px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .calendari-wrapper {
                grid-template-columns: 1fr;
            }
        }

        /* Gralla del Calendari */
        .calendari-principal {
            background: transparent;
        }

        .dies-setmana {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .dies-gralla {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(110px, auto);
            gap: 12px;
        }

        .casella {
            border-radius: 12px;
            padding: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .casella.actiu {
            background-color: var(--day-bg);
            border: 2px solid transparent;
        }

        .casella.buda {
            background-color: var(--empty-bg);
            opacity: 0.7;
        }

        .num-dia {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        /* Àrea editable de text dins el dia */
        .esdeveniment-text {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            resize: none;
            font-size: 0.9rem;
            color: #444;
            outline: none;
            font-family: inherit;
        }

        /* Barra Lateral */
        .lateral {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .nom-mes-gegant {
            font-size: 3.5rem;
            font-weight: 900;
            text-align: right;
            text-transform: capitalize;
            margin-bottom: 10px;
            color: #222;
        }

        /* Bloc de Notes Estil Núvol */
        .bloc-notes {
            background-color: var(--yellow-accent);
            border-radius: 40px 60px 35px 50px;
            padding: 25px;
            box-shadow: 5px 5px 0px var(--text-color);
            border: 3px solid var(--text-color);
        }

        .bloc-notes h3, .bloc-altres h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .bloc-notes textarea {
            width: 100%;
            height: 150px;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            font-size: 1.05rem;
            font-family: inherit;
        }

        /* Bloc Altres Estil Quadres */
        .bloc-altres {
            background-color: var(--blue-grid);
            background-image: 
                linear-gradient(to right, #c6dbe7 1px, transparent 1px),
                linear-gradient(to bottom, #c6dbe7 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 12px;
            padding: 25px;
            position: relative;
            border: 2px solid #b2cbdc;
        }

        /* Efecte de cinta adhesiva ("washi tape") */
        .bloc-altres::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 30%;
            width: 80px;
            height: 25px;
            background-color: rgba(255, 182, 193, 0.7);
            transform: rotate(-3deg);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }

        .bloc-altres textarea {
            width: 100%;
            height: 200px;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            font-size: 1.05rem;
            line-height: 20px;
            font-family: inherit;
        }

        /* OPTIMITZACIÓ PER A GENERAR PDF / IMPRIMIR */
        @media print {
            .interficie-controls {
                display: none !important;
            }
            body {
                background-color: var(--bg-color) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 0;
            }
            .calendari-wrapper {
                max-width: 100%;
                grid-template-columns: 3fr 1.2fr;
            }
            .casella, .bloc-notes, .bloc-altres {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            @page {
                size: A4 landscape;
                margin: 10mm;
            }
        }
    </style>
</head>
<body>

    <div class="interficie-controls">
        <div class="selectors">
            <select id="mesSelector"></select>
            <select id="anySelector"></select>
        </div>
        <div class="botons-accions">
            <button class="btn btn-guardar" id="btnGuardar">Guardar dades</button>
            <button class="btn btn-pdf" id="btnPDF">Generar PDF</button>
        </div>
        <div class="missatge-alerta" id="missatgeAlerta">Dades desades correctament al navegador! ✓</div>
    </div>

    <div class="calendari-wrapper">
        
        <div class="calendari-principal">
            <div class="dies-setmana">
                <div>Dl</div>
                <div>Dt</div>
                <div>Dc</div>
                <div>Dj</div>
                <div>Dv</div>
                <div>Ds</div>
                <div style="color: #e45757;">Dg</div>
            </div>
            <div class="dies-gralla" id="grallaDies"></div>
        </div>

        <div class="lateral">
            <div class="nom-mes-gegant" id="nomMesGegant">Gener</div>
            
            <div class="bloc-notes">
                <h3>Notes</h3>
                <textarea id="textNotes" placeholder="Apunta coses aquí..."></textarea>
            </div>

            <div class="bloc-altres">
                <h3>Altres</h3>
                <textarea id="textAltres" placeholder="Altres anotacions o tasques importants..."></textarea>
            </div>
        </div>

    </div>

    <script>
        const nomsMesos = ["Gener", "Febrer", "Març", "Abril", "Maig", "Juny", "Juliol", "Agost", "Setembre", "Octubre", "Novembre", "Desembre"];
        const canviAnyRef = document.getElementById('anySelector');
        const canviMesRef = document.getElementById('mesSelector');
        const grallaDies = document.getElementById('grallaDies');
        const nomMesGegant = document.getElementById('nomMesGegant');
        const textNotes = document.getElementById('textNotes');
        const textAltres = document.getElementById('textAltres');
        const btnGuardar = document.getElementById('btnGuardar');
        const btnPDF = document.getElementById('btnPDF');
        const missatgeAlerta = document.getElementById('missatgeAlerta');

        // Inicialitzar selectors d'anys (2025-2035)
        const anyActual = new Date().getFullYear();
        for (let a = 2025; a <= 2035; a++) {
            let opt = document.createElement('option');
            opt.value = a;
            opt.textContent = a;
            if (a === anyActual) opt.selected = true;
            canviAnyRef.appendChild(opt);
        }

        // Inicialitzar selector de mesos
        nomsMesos.forEach((mes, index) => {
            let opt = document.createElement('option');
            opt.value = index;
            opt.textContent = mes;
            if (index === new Date().getMonth()) opt.selected = true;
            canviMesRef.appendChild(opt);
        });

        // Funció principal per renderitzar el calendari
        function dibuixaCalendari() {
            const any = parseInt(canviAnyRef.value);
            const mes = parseInt(canviMesRef.value);

            nomMesGegant.textContent = nomsMesos[mes];
            grallaDies.innerHTML = '';

            // Obtener el primer día de forma nativa (0 = Dg, 1 = Dl, 2 = Dt...)
            const primerDiaNatiu = new Date(any, mes, 1).getDay(); 
            
            // Reajustar l'índex perquè el Dilluns sigui 0 i el Diumenge sigui 6
            const primerDiaIndex = primerDiaNatiu === 0 ? 6 : primerDiaNatiu - 1;
            
            const totalDies = new Date(any, mes + 1, 0).getDate();

            // 1. Caselles buides inicials (rosa) adaptades al Dilluns
            for (let i = 0; i < primerDiaIndex; i++) {
                const casellaBuida = document.createElement('div');
                casellaBuida.classList.add('casella', 'buda');
                grallaDies.appendChild(casellaBuida);
            }

            // 2. Caselles dels dies actius
            for (let dia = 1; dia <= totalDies; dia++) {
                const casella = document.createElement('div');
                casella.classList.add('casella', 'actiu');

                const numDia = document.createElement('div');
                numDia.classList.add('num-dia');
                numDia.textContent = dia;
                casella.appendChild(numDia);

                const areaText = document.createElement('textarea');
                areaText.classList.add('esdeveniment-text');
                areaText.placeholder = "...";
                
                const storageKey = `cal-${any}-${mes}-${dia}`;
                areaText.value = localStorage.getItem(storageKey) || '';

                // Desa automàticament al teclejar
                areaText.addEventListener('input', () => {
                    localStorage.setItem(storageKey, areaText.value);
                });

                casella.appendChild(areaText);
                grallaDies.appendChild(casella);
            }

            // 3. Caselles buides al final per quadrar la gralla de 7 columnes
            const casellesTotals = primerDiaIndex + totalDies;
            const restants = casellesTotals % 7 === 0 ? 0 : 7 - (casellesTotals % 7);
            for (let i = 0; i < restants; i++) {
                const casellaBuida = document.createElement('div');
                casellaBuida.classList.add('casella', 'buda');
                grallaDies.appendChild(casellaBuida);
            }

            // Carregar Notes i Altres del mes concret
            textNotes.value = localStorage.getItem(`notes-${any}-${mes}`) || '';
            textAltres.value = localStorage.getItem(`altres-${any}-${mes}`) || '';
        }

        // Funció per al botó de Guardar Manual
        function guardarManual() {
            const any = canviAnyRef.value;
            const mes = canviMesRef.value;
            
            localStorage.setItem(`notes-${any}-${mes}`, textNotes.value);
            localStorage.setItem(`altres-${any}-${mes}`, textAltres.value);

            missatgeAlerta.style.opacity = '1';
            setTimeout(() => {
                missatgeAlerta.style.opacity = '0';
            }, 3000);
        }

        // Auto-desat al modificar les caixes laterals
        textNotes.addEventListener('input', () => {
            const any = canviAnyRef.value;
            const mes = canviMesRef.value;
            localStorage.setItem(`notes-${any}-${mes}`, textNotes.value);
        });

        textAltres.addEventListener('input', () => {
            const any = canviAnyRef.value;
            const mes = canviMesRef.value;
            localStorage.setItem(`altres-${any}-${mes}`, textAltres.value);
        });

        canviMesRef.addEventListener('change', dibuixaCalendari);
        canviAnyRef.addEventListener('change', dibuixaCalendari);
        
        btnGuardar.addEventListener('click', guardarManual);
        btnPDF.addEventListener('click', () => {
            window.print();
        });

        // Execució inicial
        dibuixaCalendari();
    </script>
</body>
</html>
