<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprenem a restar, pas a pas</title>
    <style>
        :root {
            --blue: #00a8e8;
            --gold: #ffd54f;
            --gold-dark: #f9a825;
            --green: #4caf50;
            --error: #d32f2f;
            --centena: #ff5252;
            --centena-dark: #b71c1c;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #f0f4f8; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px;
            margin: 0;
            min-height: 100vh;
        }

        /* CONFIGURACIÓ SUPERIOR RESPONSIVE */
        .config-top { 
            margin: 10px 0;
            background: white; 
            padding: 15px; 
            border-radius: 15px; 
            border: 1px solid #ddd;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
        }

        .input-group { display: flex; align-items: center; gap: 5px; }
        .config-top label { font-weight: bold; font-size: 0.8rem; }
        .config-top input { width: 55px; padding: 5px; border-radius: 8px; border: 1px solid #ccc; text-align: center; }

        .btn-gen { background: var(--blue); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* CONTENIDOR PRINCIPAL RESPONSIVE */
        .main-wrapper { 
            display: flex; 
            flex-direction: row; /* Per defecte en PC */
            gap: 15px; 
            max-width: 1200px; 
            width: 100%; 
            justify-content: center; 
        }

        @media (max-width: 850px) {
            .main-wrapper { flex-direction: column; align-items: center; }
            .guide-panel { max-width: 100% !important; width: 100% !important; order: -1; } /* Guia a dalt en mòbil */
            .math-card { width: 100%; box-sizing: border-box; }
        }

        /* Guia lateral */
        .guide-panel { 
            flex: 1;
            min-width: 250px;
            max-width: 280px;
            background: white; 
            padding: 15px; 
            border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-top: 5px solid var(--blue);
        }

        .step { margin-bottom: 10px; padding: 8px; border-radius: 8px; font-size: 0.85rem; color: #666; }
        .step.active { background: #e3f2fd; color: #0d47a1; border-left: 4px solid var(--blue); font-weight: bold; }

        .game-area { flex: 3; display: flex; flex-direction: column; gap: 15px; width: 100%; }

        /* TAULA DE BLOCS ADAPTABLE */
        .board { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            background: white; 
            border: 2px solid var(--blue); 
            border-radius: 12px; 
            overflow-x: auto; /* Permet scroll si els blocs no caben */
        }
        
        .zone { min-height: 180px; padding: 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .units-layout { display: grid !important; grid-template-columns: repeat(auto-fit, 25px); gap: 4px; justify-content: center; width: 100%; }

        /* BLOCS MÉS PETITS PER MÒBIL */
        .block-hundred { width: 60px; height: 60px; background: var(--centena); border: 1px solid var(--centena-dark); display: grid; grid-template-columns: repeat(10, 1fr); position: relative; }
        .block-ten { width: 80px; height: 20px; background: var(--gold); border: 1px solid var(--gold-dark); display: grid; grid-template-columns: repeat(10, 1fr); position: relative; }
        .block-one { width: 25px; height: 25px; background: var(--gold); border: 1px solid var(--gold-dark); }

        @media (min-width: 600px) {
            .block-hundred { width: 90px; height: 90px; }
            .block-ten { width: 130px; height: 25px; }
            .block-one { width: 30px; height: 30px; }
            .units-layout { grid-template-columns: repeat(5, 30px); }
        }

        .break-btn { position: absolute; top: -12px; right: -12px; background: white; border: 1.5px solid var(--blue); border-radius: 50%; width: 22px; height: 22px; font-size: 12px; display: flex; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }

        .divider { grid-column: span 3; background: #f8f9fa; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; padding: 5px; text-align: center; }
        .discard-info { font-size: 0.75rem; color: #1565c0; font-weight: bold; }

        /* OPERACIÓ */
        .math-card { background: white; padding: 20px; border-radius: 15px; border: 1px solid #ddd; display: flex; flex-direction: column; align-items: center; }
        .op-container { display: grid; grid-template-columns: 30px 50px 50px 50px; align-items: center; justify-items: center; font-size: 2.5rem; font-family: monospace; }
        .math-line { grid-column: 1 / span 4; width: 100%; border-bottom: 3px solid #333; margin: 5px 0; }
        .res-input { width: 45px; height: 55px; font-size: 2rem; text-align: center; border: 2px solid #90caf9; border-radius: 8px; }

        footer { padding: 15px; color: #888; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="config-top">
        <div class="input-group">
            <label>Minuend:</label>
            <input type="number" id="n1" value="77"> 
        </div>
        <div class="input-group">
            <label>Subtrahend:</label>
            <input type="number" id="n2" value="67">
        </div>
        <button class="btn-gen" onclick="iniciar()">Generar</button>
    </div>

    <div class="main-wrapper">
        <div class="guide-panel">
            <h3 style="margin-top:0; font-size: 1rem;">Guia de passos</h3>
            <div id="step1" class="step active">1. Mira el primer número (<span id="txt-n1">77</span>).</div>
            <div id="step2" class="step">2. Treu el segon número. Usa ✂️ si cal!</div>
            <div id="step3" class="step">3. Escriu el resultat del que queda a dalt.</div>
            <div id="step4" class="step">4. Prem Comprovar.</div>
        </div>

        <div class="game-area">
            <div class="board">
                <div class="col-header">C</div><div class="col-header">D</div><div class="col-header">U</div>
                <div class="zone" id="huns-top"></div><div class="zone" id="tens-top"></div><div class="zone units-layout" id="units-top"></div>
                <div class="divider"><span class="discard-info" id="discard-sum">SENSE ÚS: 0</span></div>
                <div class="zone bottom-zone" id="huns-bottom"></div><div class="zone bottom-zone" id="tens-bottom"></div><div class="zone units-layout bottom-zone" id="units-bottom"></div>
            </div>

            <div class="math-card">
                <div class="op-container">
                    <div></div><div id="v-h1">0</div><div id="v-t1">7</div><div id="v-u1">7</div>
                    <div style="color:var(--error)">-</div><div id="v-h2" style="color:var(--error)">0</div><div id="v-t2" style="color:var(--error)">6</div><div id="v-u2" style="color:var(--error)">7</div>
                    <div class="math-line"></div>
                    <div></div>
                    <input type="text" id="ans-h" class="res-input" maxlength="1" placeholder="C">
                    <input type="text" id="ans-t" class="res-input" maxlength="1" placeholder="D">
                    <input type="text" id="ans-u" class="res-input" maxlength="1" placeholder="U">
                </div>
                <button class="btn-gen" style="background:var(--green); width:100%; margin-top:15px; font-size:1.1rem;" onclick="validar()">Comprovar resultat</button>
            </div>
        </div>
    </div>

    <footer>Fet per Oriol Soler</footer>

    <script>
        function iniciar() {
            let n1 = Math.min(parseInt(document.getElementById('n1').value) || 0, 999);
            let n2 = Math.min(parseInt(document.getElementById('n2').value) || 0, 999);
            if (n2 > n1) { alert("El minuend ha de ser més gran!"); return; }

            document.getElementById('txt-n1').innerText = n1;
            document.getElementById('v-h1').innerText = Math.floor(n1/100);
            document.getElementById('v-t1').innerText = Math.floor((n1%100)/10);
            document.getElementById('v-u1').innerText = n1%10;
            document.getElementById('v-h2').innerText = Math.floor(n2/100);
            document.getElementById('v-t2').innerText = Math.floor((n2%100)/10);
            document.getElementById('v-u2').innerText = n2%10;

            ['huns-top', 'tens-top', 'units-top', 'huns-bottom', 'tens-bottom', 'units-bottom'].forEach(id => document.getElementById(id).innerHTML = '');
            for(let i=0; i<Math.floor(n1/100); i++) crearBloc('block-hundred', 'huns-top', 'huns-bottom');
            for(let i=0; i<Math.floor((n1%100)/10); i++) crearBloc('block-ten', 'tens-top', 'tens-bottom');
            for(let i=0; i<n1%10; i++) crearBloc('block-one', 'units-top', 'units-bottom');
            
            actualitzarSumatori();
            setStep(1);
        }

        function crearBloc(classe, homeId, targetId) {
            const b = document.createElement('div');
            b.className = classe;
            if (classe === 'block-hundred') for(let j=0; j<100; j++) b.appendChild(document.createElement('div'));
            if (classe === 'block-ten') for(let j=0; j<10; j++) b.appendChild(document.createElement('div'));
            b.onclick = function() {
                const isTop = this.parentElement.id.includes('top');
                document.getElementById(isTop ? targetId : homeId).appendChild(this);
                actualitzarSumatori();
            };
            document.getElementById(homeId).appendChild(b);
            return b;
        }

        function actualitzarSumatori() {
            const h = document.getElementById('huns-bottom').children.length;
            const t = document.getElementById('tens-bottom').children.length;
            const u = document.getElementById('units-bottom').children.length;
            document.getElementById('discard-sum').innerText = `SENSE ÚS: ${(h*100)+(t*10)+u} (${h}C ${t}D ${u}U)`;
            gestionarTisores();
        }

        function gestionarTisores() {
            document.querySelectorAll('.break-btn').forEach(btn => btn.remove());
            const n2 = parseInt(document.getElementById('n2').value) || 0;
            const uTarget = n2 % 10;
            const tTarget = Math.floor((n2 % 100) / 10);
            const uMoguts = document.getElementById('units-bottom').children.length;
            const tMoguts = document.getElementById('tens-bottom').children.length;
            const uDisponibles = document.getElementById('units-top').children.length;
            const tDisponibles = document.getElementById('tens-top').children.length;

            if (uMoguts < uTarget && uDisponibles < (uTarget - uMoguts) && tDisponibles > 0) {
                afegirTisora(document.getElementById('tens-top').lastElementChild, 'block-ten');
            } else if (tMoguts < tTarget && tDisponibles < (tTarget - tMoguts) && document.getElementById('huns-top').children.length > 0) {
                afegirTisora(document.getElementById('huns-top').lastElementChild, 'block-hundred');
            }
        }

        function afegirTisora(parent, tipus) {
            if (!parent) return;
            const btn = document.createElement('div');
            btn.className = 'break-btn'; btn.innerHTML = '✂️';
            btn.onclick = (e) => {
                e.stopPropagation(); parent.remove();
                if (tipus === 'block-ten') for(let i=0; i<10; i++) crearBloc('block-one', 'units-top', 'units-bottom');
                else for(let i=0; i<10; i++) crearBloc('block-ten', 'tens-top', 'tens-bottom');
                actualitzarSumatori();
            };
            parent.appendChild(btn);
        }

        function setStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
        }

        function validar() {
            const n1 = parseInt(document.getElementById('n1').value) || 0;
            const n2 = parseInt(document.getElementById('n2').value) || 0;
            const res = parseInt((document.getElementById('ans-h').value || "0") + (document.getElementById('ans-t').value || "0") + (document.getElementById('ans-u').value || "0"));
            if (res === (n1 - n2)) alert("✨ Molt bé! L'operació és correcta."); 
            else alert("Torna-ho a provar.");
        }
        iniciar();
    </script>
</body>
</html>
