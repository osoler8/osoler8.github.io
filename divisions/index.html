<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Tutor de Divisió amb Restes Visuals</title>
    <style>
        :root { --p: #2563eb; --s: #10b981; --e: #ef4444; --bg: #f8fafc; }
        body { font-family: 'Courier New', Courier, monospace; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        
        /* Estructura de la divisió */
        .division-grid { display: grid; grid-template-columns: 180px 120px; justify-content: center; font-size: 2.2rem; font-weight: bold; margin-bottom: 20px; }
        .dividend-column { text-align: right; padding-right: 15px; position: relative; }
        .divisor-column { border-left: 5px solid #333; border-bottom: 5px solid #333; padding-left: 15px; color: var(--p); }
        .quotient-column { padding-left: 15px; color: var(--s); }
        
        .subtraction-step { color: #64748b; font-size: 1.8rem; border-bottom: 2px solid #cbd5e1; display: inline-block; width: 100%; }
        .remainder-step { color: #334155; font-size: 1.8rem; }

        .controls { background: #f1f5f9; padding: 20px; border-radius: 12px; text-align: center; border: 2px solid var(--p); }
        input { font-size: 1.5rem; width: 80px; text-align: center; border-radius: 8px; border: 2px solid #cbd5e1; margin: 10px; }
        button { background: var(--p); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: sans-serif; }
        .instruction { font-family: sans-serif; margin-bottom: 10px; font-weight: bold; color: #1e293b; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; font-family:sans-serif;">Simulador de Restes Reals</h2>
    
    <div class="division-grid">
        <div class="dividend-column">
            <div id="display-dividend">000</div>
            <div id="restes-log" style="line-height: 1;"></div>
        </div>
        <div class="divisor-column" id="display-divisor">00</div>
        <div></div>
        <div class="quotient-column" id="display-quotient"></div>
    </div>

    <div class="controls">
        <div id="msg" class="instruction">Tria un nivell:</div>
        <div id="input-area" style="display:none;">
            <input type="number" id="user-input" placeholder="?">
            <button onclick="checkStep()">Validar pas</button>
        </div>
        <div id="setup-buttons">
            <button onclick="start(1)">Nivell 1</button>
            <button onclick="start(2)" style="background:#475569">Nivell 2</button>
        </div>
    </div>
</div>

<script>
    let dnd, dsr, current_remainder, full_q, q_index;

    function start(lv) {
        dsr = lv === 1 ? Math.floor(Math.random()*8)+2 : Math.floor(Math.random()*89)+11;
        dnd = Math.floor(Math.random()*800)+100;
        full_q = Math.floor(dnd / dsr).toString();
        
        q_index = 0;
        current_remainder = 0;
        
        document.getElementById('display-dividend').innerText = dnd;
        document.getElementById('display-divisor').innerText = dsr;
        document.getElementById('display-quotient').innerText = "";
        document.getElementById('restes-log').innerHTML = "";
        document.getElementById('input-area').style.display = "block";
        document.getElementById('setup-buttons').style.display = "none";
        
        nextInstruction();
    }

    function nextInstruction() {
        document.getElementById('msg').innerText = `Pas ${q_index + 1}: Quants cops cap el ${dsr}?`;
    }

    function checkStep() {
        const val = document.getElementById('user-input').value;
        const target = full_q[q_index];

        if (val === target) {
            // Càlcul de la resta visual
            let q_so_far = parseInt(full_q.substring(0, q_index + 1));
            let portion_length = (q_index === 0) ? (dnd.toString().length - full_q.length + 1) : 1;
            
            // Simulem el procés de resta a la pissarra
            const partial_dnd = Math.floor(dnd / Math.pow(10, full_q.length - 1 - q_index));
            const subtract_val = parseInt(val) * dsr;
            const sub_res = partial_dnd - subtract_val;

            addVisualStep(subtract_val, sub_res);
            
            document.getElementById('display-quotient').innerText += val;
            q_index++;

            if (q_index >= full_q.length) {
                document.getElementById('msg').innerText = "✨ Divisió acabada!";
                document.getElementById('input-area').style.display = "none";
                document.getElementById('setup-buttons').style.display = "block";
            } else {
                nextInstruction();
            }
        } else {
            document.getElementById('msg').innerText = "❌ No és correcte. Revisa la taula!";
        }
        document.getElementById('user-input').value = "";
    }

    function addVisualStep(sub, res) {
        const log = document.getElementById('restes-log');
        log.innerHTML += `<div class="subtraction-step">-${sub}</div>`;
        log.innerHTML += `<div class="remainder-step">${res}</div>`;
    }
</script>

</body>
</html>
