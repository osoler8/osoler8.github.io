<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Divisió - Mètode de Restes</title>
    <style>
        :root { --p: #3b82f6; --correct: #10b981; --error: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #f9fafb; color: #1f2937; }
        
        /* CONTENIDOR PRINCIPAL */
        .main-container { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 700px; display: flex; flex-direction: column; align-items: center; }

        .selector-nivell { margin-bottom: 30px; display: flex; gap: 10px; }
        button.nav { background: #475569; color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        button.nav.active { background: var(--p); transform: scale(1.05); }

        /* LA CAIXA DE DIVISIÓ */
        .caixa-divisio { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: 20px; width: 100%; max-width: 500px; }
        
        .dividend-area { text-align: right; padding-right: 25px; font-size: 3.5rem; font-weight: bold; display: flex; flex-direction: column; align-items: flex-end; }
        .divisor-area { border-left: 6px solid #000; padding-left: 25px; min-height: 150px; }
        .divisor-top { border-bottom: 6px solid #000; padding-bottom: 10px; font-size: 3.5rem; font-weight: bold; color: var(--p); display: block; min-width: 120px; }

        /* ELEMENTS INTERACTIUS */
        .fila-operacio { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        .simbol { font-size: 2.5rem; font-weight: bold; }
        .caixeta { border: 3px solid #d1d5db; border-radius: 14px; width: 130px; height: 65px; font-size: 2rem; text-align: center; font-weight: bold; outline: none; transition: 0.3s; }
        .caixeta:focus { border-color: var(--p); background: #f0f7ff; }
        .caixeta.small { width: 90px; }
        .linia { border-bottom: 4px solid #000; width: 100%; margin: 5px 0; }

        /* HISTORIAL */
        .historial { font-size: 2rem; color: #64748b; margin-bottom: 5px; }
        .quocient-llista { color: var(--correct); font-size: 2.2rem; font-weight: bold; margin-top: 10px; }

        /* GUIES I BOTONS */
        .guia-box { background: #1e293b; color: white; padding: 20px; border-radius: 16px; width: 90%; text-align: center; font-size: 1.3rem; margin: 20px 0; line-height: 1.4; }
        .btn-check { background: var(--correct); color: white; border: none; padding: 18px 45px; border-radius: 14px; cursor: pointer; font-size: 1.4rem; font-weight: bold; box-shadow: 0 4px 0 #059669; }
        .btn-check:active { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="selector-nivell">
            <button id="btn-lv1" class="nav" onclick="iniciar(1)">Fàcil (1 xifra)</button>
            <button id="btn-lv2" class="nav" onclick="iniciar(2)">Difícil (2 xifres)</button>
        </div>

        <div class="caixa-divisio">
            <div class="dividend-area">
                <div id="valor-dividend">3508</div>
                <div id="historial-restes" style="display: flex; flex-direction: column; align-items: flex-end; width: 100%;"></div>
                
                <div id="zona-activa" style="display: flex; flex-direction: column; align-items: flex-end; width: 100%;">
                    <div class="fila-operacio">
                        <span class="simbol">-</span>
                        <input type="number" id="in-mult" class="caixeta" placeholder="...">
                    </div>
                    <div class="linia"></div>
                    <input type="number" id="in-res" class="caixeta" placeholder="...">
                </div>
            </div>

            <div class="divisor-area">
                <span class="divisor-top" id="valor-divisor">53</span>
                <div style="margin-top: 15px;">
                    <input type="number" id="in-quo" class="caixeta small" placeholder="...">
                </div>
                <div id="llista-q" class="quocient-llista"></div>
            </div>
        </div>

        <div class="guia-box" id="text-guia">
            Busca un número per multiplicar el 53 i acostar-te a 3508.
        </div>

        <button class="btn-check" onclick="validar()">Comprova aquest pas</button>
    </div>

<script>
    let d, s, r, totalQ;

    function iniciar(lv) {
        // Actualitzar estils botons
        document.getElementById('btn-lv1').classList.remove('active');
        document.getElementById('btn-lv2').classList.remove('active');
        document.getElementById(`btn-lv${lv}`).classList.add('active');

        // Configurar números
        if(lv === 1) { d = 456; s = 6; }
        else { d = 3508; s = 53; }
        
        r = d;
        totalQ = 0;
        
        // Reset visual
        document.getElementById('valor-dividend').innerText = d;
        document.getElementById('valor-divisor').innerText = s;
        document.getElementById('historial-restes').innerHTML = "";
        document.getElementById('llista-q').innerText = "";
        document.getElementById('zona-activa').style.display = "flex";
        
        netejaInputs();
        actualitzarGuia();
    }

    function actualitzarGuia() {
        document.getElementById('text-guia').innerText = `Busca un número per multiplicar el ${s} i acostar-te a ${r}.`;
    }

    function netejaInputs() {
        document.getElementById('in-mult').value = "";
        document.getElementById('in-quo').value = "";
        document.getElementById('in-res').value = "";
        document.getElementById('in-quo').focus();
    }

    function validar() {
        const q = parseInt(document.getElementById('in-quo').value);
        const m = parseInt(document.getElementById('in-mult').value);
        const resUser = parseInt(document.getElementById('in-res').value);

        // Validacions
        if (isNaN(q) || isNaN(m) || isNaN(resUser)) return;

        if (m !== q * s) {
            alert(`Error: ${q} x ${s} no són ${m}`);
            return;
        }
        if (m > r) {
            alert(`No pots restar ${m} perquè només en queden ${r}`);
            return;
        }
        if (resUser !== r - m) {
            alert("La resta no és correcta.");
            return;
        }

        // Si tot és correcte: Moure a l'historial
        const historial = document.getElementById('historial-restes');
        historial.innerHTML += `
            <div class="historial" style="color:#ef4444">-${m}</div>
            <div class="linia" style="border-color:#cbd5e1"></div>
            <div class="historial" style="margin-bottom:15px; color:#1f2937">${resUser}</div>
        `;

        r = resUser;
        totalQ += q;
        document.getElementById('llista-q').innerText = (totalQ > 0) ? `Total: ${totalQ}` : "";
        document.getElementById('valor-dividend').style.display = "none"; // El dividend inicial es "tapa" pel primer residu

        if (r < s) {
            document.getElementById('zona-activa').style.display = "none";
            document.getElementById('text-guia').innerHTML = `🎉 **EXCEL·LENT!**<br>Quocient: ${totalQ} | Residu: ${r}`;
        } else {
            netejaInputs();
            actualitzarGuia();
        }
    }

    // Iniciar amb nivell 2 per defecte
    iniciar(2);
</script>
</body>
</html>
