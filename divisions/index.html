<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor de Divisió Interactiva</title>
    <style>
        :root { --p: #2563eb; --s: #10b981; --e: #ef4444; --bg: #f8fafc; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 700px; }
        
        .setup-zone { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        
        /* Graella de la Divisió */
        .division-box { display: grid; grid-template-columns: 200px 150px; justify-content: center; font-family: 'Courier New', monospace; font-size: 2.2rem; }
        .dividend-container { text-align: right; padding-right: 15px; position: relative; line-height: 1.2; }
        .divisor-container { border-left: 4px solid #333; border-bottom: 4px solid #333; padding-left: 15px; min-height: 50px; color: var(--p); }
        .quotient-container { padding-left: 15px; color: var(--s); letter-spacing: 5px; }
        
        /* Inputs dinàmics */
        .step-input { width: 40px; border: none; border-bottom: 2px solid #ccc; text-align: center; font-family: inherit; font-size: inherit; outline: none; transition: 0.3s; }
        .step-input:focus { border-bottom-color: var(--p); background: #f0f7ff; }
        .correct { color: var(--s); border-bottom-color: var(--s); }
        .wrong { color: var(--e); border-bottom-color: var(--e); }

        .instruction { background: #f1f5f9; padding: 15px; border-radius: 10px; margin: 20px 0; text-align: center; font-weight: 500; border-left: 4px solid var(--p); }
        button { background: var(--p); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .history-row { display: block; text-align: right; padding-right: 15px; color: #64748b; font-size: 1.8rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="setup-zone">
        <button onclick="newGame(1)">Nivell 1 (1 xifra)</button>
        <button onclick="newGame(2)" style="background:#475569">Nivell 2 (2 xifres)</button>
    </div>

    <div class="division-box">
        <div class="dividend-container" id="dividend-area">
            <span id="d-val">000</span>
            <div id="restes-area"></div>
        </div>
        <div class="divisor-container" id="divisor-val">00</div>
        <div></div>
        <div class="quotient-container" id="quotient-area">_</div>
    </div>

    <div id="msg" class="instruction">Tria un nivell per començar a practicar.</div>
    
    <div id="input-zone" style="text-align: center; display:none;">
        <input type="number" id="user-val" placeholder="?">
        <button onclick="validateStep()">Comprova pas</button>
    </div>
</div>

<script>
    let dnd, dsr, qtn_final, current_qtn = "";
    let step = "QUOTIENT"; // QUOTIENT, MULTIPLY, SUBTRACT, DOWN
    let pointer = 0; // Quants números del dividend hem agafat

    function newGame(lv) {
        dsr = lv === 1 ? Math.floor(Math.random()*8)+2 : Math.floor(Math.random()*89)+11;
        dnd = Math.floor(Math.random()*800)+100;
        qtn_final = Math.floor(dnd / dsr).toString();
        current_qtn = "";
        
        document.getElementById('d-val').innerText = dnd;
        document.getElementById('divisor-val').innerText = dsr;
        document.getElementById('quotient-area').innerText = "";
        document.getElementById('restes-area').innerHTML = "";
        document.getElementById('input-zone').style.display = "block";
        
        step = "QUOTIENT";
        updateMsg(`Quants cops cap ${dsr} en la primera part del número?`);
    }

    function updateMsg(m) { document.getElementById('msg').innerText = m; }

    function validateStep() {
        const val = document.getElementById('user-val').value;
        const targetDigit = qtn_final[current_qtn.length];

        if (val === targetDigit) {
            current_qtn += val;
            document.getElementById('quotient-area').innerText = current_qtn;
            
            if (current_qtn === qtn_final) {
                const residu = dnd % dsr;
                addRestRow(residu);
                updateMsg("¡Molt bé! Divisió completada. El residu és " + residu);
                document.getElementById('input-zone').style.display = "none";
            } else {
                updateMsg("Correcte! Ara continua amb la següent xifra.");
            }
        } else {
            updateMsg("❌ Revisa el càlcul, aquest número no és correcte.");
        }
        document.getElementById('user-val').value = "";
    }

    function addRestRow(val) {
        const div = document.createElement('div');
        div.className = "history-row";
        div.innerText = val;
        document.getElementById('restes-area').appendChild(div);
    }
</script>

</body>
</html>
