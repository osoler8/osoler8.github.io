<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Divisions pas a pas</title>
    <style>
        :root { --p: #3b82f6; --correct: #10b981; --bg: #f3f4f6; }
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: var(--bg); min-height: 100vh; margin: 0; }
        
        .main-container { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 750px; flex-grow: 1; margin-bottom: 40px; }

        h1 { text-align: center; color: #1e293b; margin-top: 0; }

        .controls-top { margin-bottom: 30px; display: flex; gap: 10px; justify-content: center; }
        button.nav { background: #475569; color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: bold; }
        button.nav.active { background: var(--p); }
        button.refresh { background: #f59e0b; color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: bold; }

        .caixa-divisio { display: grid; grid-template-columns: 1fr 10px 1fr; gap: 0; margin-bottom: 20px; }
        .col-dividend { text-align: right; padding-right: 25px; display: flex; flex-direction: column; align-items: flex-end; }
        .col-separator { background: #000; width: 6px; height: 100%; min-height: 350px; border-radius: 3px; }
        .col-divisor { padding-left: 25px; display: flex; flex-direction: column; align-items: flex-start; }

        .num-gran { font-size: 3.5rem; font-weight: bold; line-height: 1.1; margin-bottom: 10px; }
        .divisor-line { border-bottom: 6px solid #000; padding-bottom: 10px; font-size: 3.5rem; font-weight: bold; color: var(--p); display: block; min-width: 150px; text-align: left; }
        
        .fila-operacio { display: flex; align-items: center; gap: 10px; margin: 10px 0; width: 100%; justify-content: flex-end; }
        .caixeta { border: 3px solid #d1d5db; border-radius: 18px; width: 150px; height: 75px; font-size: 2.2rem; text-align: center; font-weight: bold; background: #fff; display: flex; align-items: center; justify-content: center; }
        .caixeta.input-quo { border-color: var(--p); color: #1f2937; margin-top: 15px; }
        .linia-negra { border-bottom: 5px solid #000; width: 160px; margin: 5px 0; }

        .historial-item { font-size: 2.2rem; font-weight: bold; margin: 5px 0; }
        .text-resta { color: #ef4444; }
        
        .q-item { font-size: 2.2rem; font-weight: bold; color: #4b5563; margin: 5px 0; width: 100%; text-align: left; padding-left: 10px; }
        .suma-line { border-top: 4px solid #333; width: 120px; margin-top: 10px; margin-bottom: 10px; }
        .total-text { color: var(--correct); font-size: 2.8rem; font-weight: bold; }

        .guia-box { background: #1e293b; color: white; padding: 25px; border-radius: 20px; text-align: center; font-size: 1.4rem; margin: 30px 0; width: 100%; box-sizing: border-box; font-weight: 500; }
        .btn-validar { background: var(--correct); color: white; border: none; padding: 20px; border-radius: 15px; cursor: pointer; font-size: 1.6rem; font-weight: bold; width: 100%; }

        footer { font-size: 0.9rem; color: #64748b; margin-bottom: 20px; text-align: center; }
        footer a { color: var(--p); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>Divisions pas a pas</h1>

        <div class="controls-top">
            <button id="btn-lv1" class="nav" onclick="canviarNivell(1)">1 xifra</button>
            <button id="btn-lv2" class="nav" onclick="canviarNivell(2)">2 xifres</button>
            <button class="refresh" onclick="generarNova()">🔄 Nova divisió</button>
        </div>

        <div class="caixa-divisio">
            <div class="col-dividend">
                <div id="valor-inicial" class="num-gran">0</div>
                <div id="historial-container" style="display: flex; flex-direction: column; align-items: flex-end; width: 100%;"></div>
                
                <div id="zona-activa" style="display: flex; flex-direction: column; align-items: flex-end; width: 100%;">
                    <div class="fila-operacio">
                        <span style="font-size: 3rem; font-weight: bold; margin-right: 5px;">-</span>
                        <div id="preview-mult" class="caixeta" style="color: #94a3b8;">...</div>
                    </div>
                    <div class="linia-negra"></div>
                    <div id="preview-res" class="caixeta" style="color: #94a3b8;">...</div>
                </div>
            </div>

            <div class="col-separator"></div>

            <div class="col-divisor">
                <span class="divisor-line" id="valor-divisor">0</span>
                <div id="llista-quocients" style="display: flex; flex-direction: column; width: 100%;"></div>
                
                <div id="input-container">
                    <input type="number" id="in-quo" class="caixeta input-quo" placeholder="..." oninput="actualitzarPreviews()">
                </div>

                <div id="zona-final" style="display:none; flex-direction: column; align-items: flex-start;">
                    <div class="suma-line"></div>
                    <div id="total-resultat" class="total-text"></div>
                </div>
            </div>
        </div>

        <div class="guia-box" id="text-guia"></div>
        <button id="btn-validar" class="btn-validar" onclick="validar()">Comprova aquest pas</button>
    </div>

    <footer>
        Divisions pas a pas © 2026 Oriol Soler. Llicència del codi: 
        <a href="https://www.gnu.org/licenses/agpl-3.0.ca.html" target="_blank">AGPL v3</a>
    </footer>

<script>
    let d, s, r, totalQ, nivellActual = 1;

    function canviarNivell(lv) {
        nivellActual = lv;
        generarNova();
    }

    function generarNova() {
        document.getElementById('btn-lv1').classList.toggle('active', nivellActual === 1);
        document.getElementById('btn-lv2').classList.toggle('active', nivellActual === 2);

        s = nivellActual === 1 ? Math.floor(Math.random()*8)+2 : Math.floor(Math.random()*89)+11;
        d = nivellActual === 1 ? Math.floor(Math.random()*800)+100 : Math.floor(Math.random()*8000)+1000;
        
        r = d; totalQ = 0;
        document.getElementById('valor-inicial').innerText = d;
        document.getElementById('valor-divisor').innerText = s;
        document.getElementById('historial-container').innerHTML = "";
        document.getElementById('llista-quocients').innerHTML = "";
        document.getElementById('zona-final').style.display = "none";
        document.getElementById('input-container').style.display = "block";
        document.getElementById('zona-activa').style.display = "flex";
        document.getElementById('btn-validar').style.display = "block";
        
        netejaInputs();
        actualitzarGuia();
    }

    function actualitzarPreviews() {
        const q = parseInt(document.getElementById('in-quo').value);
        const pMult = document.getElementById('preview-mult');
        const pRes = document.getElementById('preview-res');

        if (!isNaN(q) && q > 0) {
            const mult = q * s;
            if (mult <= r) {
                pMult.innerText = mult;
                pMult.style.color = "#ef4444";
                pRes.innerText = r - mult;
                pRes.style.color = "#1f2937";
            } else {
                pMult.innerText = "Massa!";
                pRes.innerText = "...";
            }
        } else {
            pMult.innerText = "..."; pRes.innerText = "...";
            pMult.style.color = "#94a3b8";
        }
    }

    function netejaInputs() {
        document.getElementById('in-quo').value = "";
        document.getElementById('preview-mult').innerText = "...";
        document.getElementById('preview-res').innerText = "...";
        document.getElementById('in-quo').focus();
    }

    function actualitzarGuia() {
        document.getElementById('text-guia').innerText = `Busca un número per multiplicar el ${s} i acostar-te a ${r}.`;
    }

    function validar() {
        const q = parseInt(document.getElementById('in-quo').value);
        if (isNaN(q) || q <= 0 || (q * s) > r) return;

        const mult = q * s;
        const nouResidu = r - mult;

        const historial = document.getElementById('historial-container');
        historial.innerHTML += `
            <div class="fila-operacio"><span style="font-size: 2.2rem; font-weight: bold; margin-right: 5px;">-</span><div class="historial-item text-resta">${mult}</div></div>
            <div class="linia-negra" style="border-color: #94a3b8;"></div>
            <div class="historial-item">${nouResidu}</div>
        `;

        const llistaQ = document.getElementById('llista-quocients');
        llistaQ.innerHTML += `<div class="q-item">${q}</div>`;

        r = nouResidu;
        totalQ += q;

        if (r < s) {
            document.getElementById('zona-activa').style.display = "none";
            document.getElementById('input-container').style.display = "none";
            document.getElementById('btn-validar').style.display = "none";
            
            document.getElementById('zona-final').style.display = "flex";
            document.getElementById('total-resultat').innerText = totalQ;
            
            const tipusDivisio = (r === 0) ? "Exacta" : "Entera";
            document.getElementById('text-guia').innerHTML = `✨ **HO HAS ACONSEGUIT!** <br> Divisió ${tipusDivisio} | Quocient: ${totalQ} | Residu: ${r}`;
        } else {
            netejaInputs();
            actualitzarGuia();
        }
    }

    generarNova();
</script>
</body>
</html>
