<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Tutor de Divisions per Paquets</title>
    <style>
        :root { --p: #2563eb; --s: #10b981; --e: #ef4444; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 650px; }
        
        .division-table { display: flex; justify-content: center; gap: 0; font-family: 'Courier New', monospace; font-size: 2rem; margin: 20px 0; }
        .left-side { text-align: right; border-right: 4px solid #333; padding-right: 20px; min-width: 150px; }
        .right-side { padding-left: 20px; color: var(--p); text-align: left; }
        
        .sub-val { color: var(--e); font-size: 1.5rem; }
        .rem-val { color: #333; font-weight: bold; border-top: 2px solid #333; margin-bottom: 10px; }
        .q-part { color: var(--s); display: block; }
        
        .controls { background: #f1f5f9; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .input-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        input { font-size: 1.2rem; width: 100px; padding: 8px; border-radius: 8px; border: 2px solid #cbd5e1; }
        button { background: var(--p); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .total-box { margin-top: 20px; padding: 10px; background: #dcfce7; border-radius: 8px; font-weight: bold; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center">Mètode de Restes Successives</h2>
    
    <div class="division-table">
        <div class="left-side">
            <div id="current-dividend" style="margin-bottom: 10px;">682</div>
            <div id="history-area"></div>
        </div>
        <div class="right-side">
            <div id="divisor-val" style="border-bottom: 4px solid #333; margin-bottom: 10px;">8</div>
            <div id="quotients-history"></div>
        </div>
    </div>

    <div class="controls">
        <div id="instruction" style="text-align:center; font-weight:bold;">Quin paquet vols treure ara?</div>
        <div class="input-group">
            <input type="number" id="user-q" placeholder="Quocient">
            <span style="font-size: 1.5rem; align-self: center;">x <span id="hint-dsr">8</span></span>
            <button onclick="processPackage()">Resta aquest paquet</button>
        </div>
    </div>

    <div id="final-result" class="total-box"></div>
    <button onclick="start()" style="margin-top:20px; background:#64748b; width:100%;">Nova Divisió</button>
</div>

<script>
    let dnd, dsr, rem;
    let total_q = 0;

    function start() {
        dnd = Math.floor(Math.random() * 800) + 100;
        dsr = Math.floor(Math.random() * 8) + 2;
        rem = dnd;
        total_q = 0;
        
        document.getElementById('current-dividend').innerText = dnd;
        document.getElementById('divisor-val').innerText = dsr;
        document.getElementById('hint-dsr').innerText = dsr;
        document.getElementById('history-area').innerHTML = "";
        document.getElementById('quotients-history').innerHTML = "";
        document.getElementById('final-result').style.display = "none";
        document.getElementById('instruction').innerText = `Tinc ${rem}. Quin paquet del ${dsr} vols treure?`;
    }

    function processPackage() {
        const q_part = parseInt(document.getElementById('user-q').value);
        if (isNaN(q_part) || q_part <= 0) return;

        const multiply = q_part * dsr;

        if (multiply > rem) {
            alert("No pots treure tant! Aquest paquet és massa gran.");
            return;
        }

        // Afegir a la part visual esquerra (resta)
        const history = document.getElementById('history-area');
        history.innerHTML += `<div class="sub-val">-${multiply}</div>`;
        rem -= multiply;
        history.innerHTML += `<div class="rem-val">${rem}</div>`;

        // Afegir a la part visual dreta (quocients)
        const qHistory = document.getElementById('quotients-history');
        qHistory.innerHTML += `<span class="q-part">${q_part}</span>`;
        total_q += q_part;

        document.getElementById('user-q').value = "";
        
        if (rem < dsr) {
            finish();
        } else {
            document.getElementById('instruction').innerText = `Ara et queden ${rem}. Continua!`;
        }
    }

    function finish() {
        const resBox = document.getElementById('final-result');
        resBox.style.display = "block";
        resBox.innerHTML = `DIVISIÓ ACABADA!<br>Quocient total: ${total_q}<br>Residu final: ${rem}`;
        document.getElementById('instruction').innerText = "Ja no en pots treure més.";
    }

    start();
</script>
</body>
</html>
