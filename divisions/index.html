<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Divisions pas a pas</title>
    <style>
        :root { --p: #3b82f6; --correct: #10b981; --bg: #f3f4f6; }
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: var(--bg); min-height: 100vh; margin: 0; }
        
        /* CONTENIDOR AJUSTAT */
        .main-container { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 750px; margin-bottom: 20px; }

        h1 { text-align: center; color: #1e293b; margin-top: 0; }

        .controls-top { margin-bottom: 30px; display: flex; gap: 10px; justify-content: center; }
        button.nav { background: #475569; color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: bold; }
        button.nav.active { background: var(--p); }
        button.refresh { background: #f59e0b; color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: bold; }

        /* LA CAIXA CLÀSSICA */
        .caixa-v1 { display: flex; justify-content: center; align-items: flex-start; margin-top: 20px; }
        .col-esquerra { text-align: right; padding-right: 20px; }
        
        .col-dreta { border-left: 6px solid #000; display: flex; flex-direction: column; align-items: flex-start; }
        .divisor-area { border-bottom: 6px solid #000; padding: 0 20px 10px 20px; font-size: 3.5rem; font-weight: bold; color: var(--p); min-width: 150px; }
        .quocients-area { padding: 15px 20px; display: flex; flex-direction: column; align-items: flex-start; width: 100%; }

        .num-v1 { font-size: 3.5rem; font-weight: bold; line-height: 1.1; margin-bottom: 10px; }
        .fila-resta { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin: 10px 0; }
        .caixeta { border: 3px solid #d1d5db; border-radius: 18px; width: 150px; height: 70px; font-size: 2.2rem; text-align: center; font-weight: bold; background: #fff; display: flex; align-items: center; justify-content: center; }
        .caixeta.input-final { border-color: var(--p); color: #1f2937; margin-top: 10px; }
        .linia-v1 { border-bottom: 5px solid #000; width: 160px; margin: 5px 0 5px auto; }
        
        .historial-v1 { font-size: 2.2rem; font-weight: bold; margin: 5px 0; color: #4b5563; }
        .text-vermell { color: #ef4444; }

        .q-part { font-size: 2.2rem; font-weight: bold; color: #4b5563; margin: 5px 0; }
        .linia-suma { border-top: 4px solid #333; width: 100px; margin: 10px 0; }
        .total-final { color: var(--correct); font-size: 2.8rem; font-weight: bold; }

        .guia-box { background: #1e293b; color: white; padding: 25px; border-radius: 20px; text-align: center; font-size: 1.4rem; margin: 30px 0; width: 100%; box-sizing: border-box; }
        .btn-validar { background: var(--correct); color: white; border: none; padding: 20px; border-radius: 15px; cursor: pointer; font-size: 1.6rem; font-weight: bold; width: 100%; }

        footer { font-size: 0.9rem; color: #64748b; padding: 20px 0; text-align: center; width: 100%; }
        footer a { color: var(--p); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>Divisions pas a pas</h1>

        <div class="controls-top">
            <button id="btn-lv1" class="nav" onclick="canviarNivell(1)">1 xifra</button>
            <button id="btn-lv2" class="nav" onclick="canviarNivell(2)">2 xifres</button>
            <button class="refresh" onclick="generarNova()">🔄 Nova divisió</button>
        </div>

        <div class="caixa-v1">
            <div class="col-esquerra">
                <div id="div-original" class="num-v1">0</div>
                <div id="historial-v1-container" style="display: flex; flex-direction: column; align-items: flex-end;"></div>
                
                <div id="zona-activa-v1" style="display: flex; flex-direction: column; align-items: flex-end;">
                    <div class="fila-resta">
                        <span style="font-size: 3rem; font-weight: bold;">-</span>
                        <div id="pre-m" class="caixeta" style="color: #94a3b8;">...</div>
                    </div>
                    <div class="linia-v1"></div>
                    <div id="pre-r" class="caixeta" style="color: #94a3b8;">...</div>
                </div>
            </div>

            <div class="col-dreta">
                <div class="divisor-area" id="disp-s">0</div>
                <div class="quocients-area">
                    <div id="llista-q-v1" style="display: flex; flex-direction: column;"></div>
                    <input type="number" id="in-q-v1" class="caixeta input-final" placeholder="..." oninput="updateV1()">
                    
                    <div id="final-suma-v1" style="display:none; flex-direction: column;">
                        <div class="linia-suma"></div>
                        <div id="res-total-v1" class="total-final">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="guia-box" id="msg-guia">Busca un número...</div>
        <button id="btn-v1" class="btn-validar" onclick="validarV1()">Comprova aquest pas</button>
    </div>

    <footer>
        Divisions pas a pas © 2026 Oriol Soler. Llicència del codi: 
        <a href="https://www.gnu.org/licenses/agpl-3.0.ca.html" target="_blank">AGPL v3</a>
    </footer>

<script>
    let d, s, r, tQ, lv = 1;

    function canviarNivell(n) { lv = n; generarNova(); }

    function generarNova() {
        document.getElementById('btn-lv1').classList.toggle('active', lv === 1);
        document.getElementById('btn-lv2').classList.toggle('active', lv === 2);

        s = lv === 1 ? Math.floor(Math.random()*8)+2 : Math.floor(Math.random()*89)+11;
        d = lv === 1 ? Math.floor(Math.random()*800)+100 : Math.floor(Math.random()*8000)+1000;
        
        r = d; tQ = 0;
        document.getElementById('div-original').innerText = d;
        document.getElementById('disp-s').innerText = s;
        document.getElementById('historial-v1-container').innerHTML = "";
        document.getElementById('llista-q-v1').innerHTML = "";
        document.getElementById('final-suma-v1').style.display = "none";
        document.getElementById('in-q-v1').style.display = "block";
        document.getElementById('zona-activa-v1').style.display = "flex";
        document.getElementById('btn-v1').style.display = "block";
        
        resetInputs();
        updGuia();
    }

    function updateV1() {
        const val = parseInt(document.getElementById('in-q-v1').value);
        const m = document.getElementById('pre-m');
        const res = document.getElementById('pre-r');
        if (!isNaN(val) && val > 0) {
            const prod = val * s;
            if (prod <= r) {
                m.innerText = prod; m.style.color = "#ef4444";
                res.innerText = r - prod; res.style.color = "#1f2937";
            } else { m.innerText = "Massa!"; res.innerText = "..."; }
        } else { m.innerText = "..."; res.innerText = "..."; m.style.color = "#94a3b8"; }
    }

    function resetInputs() {
        document.getElementById('in-q-v1').value = "";
        document.getElementById('pre-m').innerText = "...";
        document.getElementById('pre-r').innerText = "...";
        document.getElementById('in-q-v1').focus();
    }

    function updGuia() {
        document.getElementById('msg-guia').innerText = `Per quin nombre multipliquem el ${s} per acostar-nos a ${r}?`;
    }

    function validarV1() {
        const q = parseInt(document.getElementById('in-q-v1').value);
        if (isNaN(q) || q <= 0 || (q * s) > r) return;

        const prod = q * s;
        const nouR = r - prod;

        document.getElementById('historial-v1-container').innerHTML += `
            <div class="fila-resta"><span style="font-size: 2rem; font-weight: bold;">-</span><div class="historial-v1 text-vermell">${prod}</div></div>
            <div class="linia-v1" style="border-color: #cbd5e1;"></div>
            <div class="historial-v1">${nouR}</div>
        `;

        document.getElementById('llista-q-v1').innerHTML += `<div class="q-part">${q}</div>`;

        r = nouR; tQ += q;

        if (r < s) {
            document.getElementById('zona-activa-v1').style.display = "none";
            document.getElementById('in-q-v1').style.display = "none";
            document.getElementById('btn-v1').style.display = "none";
            document.getElementById('final-suma-v1').style.display = "flex";
            document.getElementById('res-total-v1').innerText = tQ;
            
            const tipus = (r === 0) ? "Exacta" : "Entera";
            document.getElementById('msg-guia').innerHTML = `✨ **HO HAS ACONSEGUIT!** <br> Divisió ${tipus} | Quocient: ${tQ} | Residu: ${r}`;
        } else {
            resetInputs();
            updGuia();
        }
    }

    generarNova();
</script>
</body>
</html>
