<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Tutor de Divisió - Mètode de Restes</title>
    <style>
        :root { --p: #3b82f6; --bg: #ffffff; --correct: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; background: #f9fafb; }
        
        /* LA CAIXA DE DIVISIÓ EXACTA */
        .division-grid { display: grid; grid-template-columns: auto auto; gap: 0; font-family: sans-serif; margin-bottom: 30px; }
        .dividend-side { text-align: right; padding-right: 20px; font-size: 3.5rem; font-weight: bold; }
        .divisor-side { border-left: 6px solid #000; padding-left: 20px; min-width: 140px; }
        .divisor-line { border-bottom: 6px solid #000; padding-bottom: 5px; font-size: 3.5rem; font-weight: bold; color: var(--p); display: block; }
        
        /* ESTILS DE LES CAIXETES (INPUTS) */
        .caixeta { border: 2px solid #9ca3af; border-radius: 12px; width: 140px; height: 60px; font-size: 2rem; text-align: center; margin: 10px 0; outline: none; }
        .caixeta:focus { border-color: var(--p); background: #eff6ff; }
        .caixeta-petita { width: 80px; }

        .resta-simbol { font-size: 2.5rem; vertical-align: middle; margin-right: 10px; font-weight: bold; }
        .linia-resta { border-bottom: 4px solid #000; width: 100%; margin: 10px 0; }
        
        .instruccions { background: #1e293b; color: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 500px; text-align: center; font-size: 1.2rem; }
        .controls-nivell { margin-bottom: 20px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 0 5px; }
        .total-acumulat { color: var(--correct); font-size: 2rem; font-weight: bold; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div class="controls-nivell">
        <button onclick="nouJoc(1)">Fàcil (1 xifra)</button>
        <button onclick="nouJoc(2)" style="background:#475569">Difícil (2 xifres)</button>
    </div>

    <div class="division-grid">
        <div class="dividend-side">
            <div id="display-dividend">3508</div>
            <div id="zona-treball" style="display: flex; flex-direction: column; align-items: flex-end;">
                <div id="fila-input-resta">
                    <span class="resta-simbol">-</span>
                    <input type="number" id="input-multiplicacio" class="caixeta" placeholder="...">
                </div>
                <div class="linia-resta"></div>
                <input type="number" id="input-resta" class="caixeta" placeholder="...">
            </div>
        </div>

        <div class="divisor-side">
            <span class="divisor-line" id="display-divisor">53</span>
            <input type="number" id="input-quocient" class="caixeta caixeta-petita" placeholder="...">
            <div id="llista-quocients" class="total-acumulat"></div>
        </div>
    </div>

    <div class="instruccions" id="guia">
        Per quin nombre vols multiplicar el <span id="hint-dsr">53</span>?
    </div>

    <button onclick="validarPas()" style="margin-top: 25px; padding: 15px 40px; font-size: 1.2rem; background: #10b981;">Comprova aquest pas</button>

<script>
    let dnd, dsr, rem;
    let sumaQ = 0;

    function nouJoc(lv) {
        if(lv === 1) { dnd = 456; dsr = 6; }
        else { dnd = 3508; dsr = 53; }
        
        rem = dnd;
        sumaQ = 0;
        
        document.getElementById('display-dividend').innerText = dnd;
        document.getElementById('display-divisor').innerText = dsr;
        document.getElementById('hint-dsr').innerText = dsr;
        document.getElementById('llista-quocients').innerText = "";
        netejaInputs();
        document.getElementById('guia').innerText = `Busca un número per multiplicar el ${dsr} i acostar-te a ${rem}.`;
    }

    function netejaInputs() {
        document.getElementById('input-multiplicacio').value = "";
        document.getElementById('input-quocient').value = "";
        document.getElementById('input-resta').value = "";
    }

    function validarPas() {
        const q = parseInt(document.getElementById('input-quocient').value);
        const mult = parseInt(document.getElementById('input-multiplicacio').value);
        const restaUser = parseInt(document.getElementById('input-resta').value);

        // 1. Validar la multiplicació
        if (mult !== q * dsr) {
            alert("La multiplicació no és correcta: " + q + " x " + dsr + " no és " + mult);
            return;
        }

        // 2. Validar que no es passi del que tenim
        if (mult > rem) {
            alert("No pots restar " + mult + " perquè només en tens " + rem);
            return;
        }

        // 3. Validar el resultat de la resta
        if (restaUser !== rem - mult) {
            alert("La resta no és correcta.");
            return;
        }

        // SI TOT ÉS CORRECTE:
        rem = restaUser;
        sumaQ += q;
        
        // Actualitzem visualment
        document.getElementById('display-dividend').innerText = rem;
        document.getElementById('llista-quocients').innerText = "Total: " + sumaQ;
        netejaInputs();

        if (rem < dsr) {
            document.getElementById('guia').innerHTML = "✨ **Molt bé!** Divisió acabada. Quocient: " + sumaQ + " | Residu: " + rem;
        } else {
            document.getElementById('guia').innerText = "Correcte! Ara et queden " + rem + ". Continua!";
        }
    }

    nouJoc(2);
</script>
</body>
</html>
